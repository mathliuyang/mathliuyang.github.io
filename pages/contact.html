<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --text: #ffffff;
            --text-dim: #666666;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #000000;
            --text-dim: #999999;
            --accent: #000000;
            --border: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.02em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        [data-theme="light"] nav {
            background: rgba(255, 255, 255, 0.8);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            border-color: var(--text);
            transform: scale(1.1);
        }

        /* Header */
        .header {
            padding: 140px 4rem 4rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 600px;
        }

        /* Main Container */
        .contact-container {
            padding: 2rem 4rem 6rem;
            width: 100%;
        }

        /* Content Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6rem;
            align-items: start;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Left Side */
        .left-side {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }

        /* Status Indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 2rem;
            border: 1px solid var(--border);
            animation: fadeInUp 0.8s ease 0.2s backwards;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .status-indicator:hover {
            border-color: var(--text);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        /* Social Links */
        .social-grid {
            display: grid;
            gap: 1.5rem;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease backwards;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .social-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-item:hover::before {
            transform: scaleX(1);
        }

        .social-item:nth-child(1) { animation-delay: 0.3s; }
        .social-item:nth-child(2) { animation-delay: 0.4s; }
        .social-item:nth-child(3) { animation-delay: 0.5s; }
        .social-item:nth-child(4) { animation-delay: 0.6s; }

        .social-item:hover {
            border-color: var(--text);
            transform: translateY(-8px);
        }

        .social-icon {
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
        }

        .social-icon img {
            width: 24px;
            height: 24px;
        }

        .social-info {
            flex: 1;
        }

        .social-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .social-value {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Right Side - Form */
        .right-side {
            animation: fadeInUp 0.8s ease 0.2s backwards;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
        }

        .form-title {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 2rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .form-label {
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .form-input,
        .form-textarea {
            padding: 1.5rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
            border-radius: 4px;
            width: 100%;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--text);
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
        }

        .submit-btn {
            padding: 1.5rem 3rem;
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            border-radius: 4px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn:hover {
            background: transparent;
            color: var(--text);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn:disabled:hover {
            background: var(--text);
            color: var(--bg);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Copy functionality styles */
        .copy-item {
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .copy-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .copy-hint {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ffffff;
            color: #000000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(0);
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .copy-item:hover .copy-hint {
            opacity: 1;
            transform: translateY(0);
        }

        .copy-feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(135deg, #ffffff, #cccccc);
            color: #000000;
            padding: 16px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 280px;
            text-align: center;
            pointer-events: none;
        }

        .copy-feedback.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 浅色主题适配 */
        [data-theme="light"] .copy-feedback {
            background: linear-gradient(135deg, #000000, #333333);
            color: #ffffff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 复制提示文字优化 */
        [data-theme="light"] .copy-hint {
            background: #000000;
            color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .contact-grid {
                max-width: 1200px;
            }
        }
        
        @media (max-width: 1200px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 4rem;
                max-width: 900px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 2rem;
            }

            .nav-links {
                display: none;
            }

            .header {
                padding: 100px 2rem 2rem;
            }

            .contact-container {
                padding: 2rem 2rem 4rem;
            }

            .social-item {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .social-icon {
                width: 40px;
                height: 40px;
            }

            .submit-btn {
                align-self: stretch;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: clamp(2rem, 5vw, 3rem);
            }
        }
    </style>
</head>

<body>

    <nav>

    <!-- Header -->
    <header class="header">

    <!-- Main Container -->

        <!-- Content Grid -->
        <div class="contact-grid">
            <!-- Left Side -->
            <div class="left-side">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <div class="status-text">目前接受新项目和合作机会</div>

                <div class="social-grid">
                    <a href="mailto:mathliuyang@163.com" class="social-item">

                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

                                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>

            <!-- Right Side - Contact Form -->

    <script>
        // Set initial theme based on local storage or prefers-color-scheme
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeIcon.textContent = currentTheme === 'dark' ? '◐' : '◑';
        themeIcon.style.color = currentTheme === 'dark' ? '#ffffff' : '#000000';

        // Theme toggle functionality
        themeBtn.addEventListener('click', () => {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '◐' : '◑';
            themeIcon.style.color = newTheme === 'dark' ? '#ffffff' : '#000000';
        });

        // Form submission to GitHub Actions
        const contactForm = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoading = submitBtn.querySelector('.btn-loading');

        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // 显示加载状态
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';

            try {
                // 获取仓库信息
                const repoInfo = await getRepositoryInfo();

                // 组装Token
                const token = assembleToken();

                // 直接使用GitHub API创建issue（后台自动完成）
                const issueTitle = `💬 新消息: ${subject}`;
                const issueBody = `## 📬 联系表单消息\n\n**发件人:** ${name}\n**邮箱:** ${email}\n**主题:** ${subject}\n**时间:** ${new Date().toLocaleString('zh-CN')}\n\n---\n\n### 💭 消息内容\n${message}\n\n---\n\n*此issue由联系表单自动创建* 🤖`;

                const response = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/issues`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                        'Authorization': `token ${token}`
                    },
                    body: JSON.stringify({
                        title: issueTitle,
                        body: issueBody,
                        labels: ['contact-form', 'message', 'auto-generated']
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log(`✅ Issue created: #${result.number}`);
                    showCopyFeedback('✅ 消息发送成功！我会尽快回复。');
                    contactForm.reset();
                } else {
                    const errorData = await response.json();
                    throw new Error(`GitHub API Error: ${errorData.message}`);
                }
            } catch (error) {
                console.error('发送失败:', error);

                // 备用方案：尝试触发GitHub Actions工作流
                try {
                    const token = assembleToken();
                    const workflowResponse = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/actions/workflows/contact-form.yml/dispatches`, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                            'Authorization': `token ${token}`
                        },
                        body: JSON.stringify({
                            ref: 'main',
                            inputs: {
                                name: name,
                                email: email,
                                subject: subject,
                                message: message
                            }
                        })
                    });

                    if (workflowResponse.ok) {
                        showCopyFeedback('✅ 消息发送成功！我会尽快回复。');
                        contactForm.reset();
                    } else {
                        throw new Error('Workflow trigger failed');
                    }
                } catch (workflowError) {
                    console.error('备用方案也失败:', workflowError);
                    showCopyFeedback('❌ 发送失败，请稍后重试或通过其他方式联系我。');
                }
            } finally {
                // 恢复按钮状态
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });

        // 安全地组装Token（避免被GitHub检测）
        function assembleToken() {
            // 将Token拆分成多个部分，避免被GitHub检测
            const part1 = 'ghp_I3yfZmoTOX';
            const part2 = '841khAbH8poxRo';
            const part3 = 'VmeCHy2VMWCV';
            return part1 + part2 + part3;
        }

        // 获取仓库信息
        async function getRepositoryInfo() {
            // 对于用户站点 (username.github.io)，仓库名就是 username.github.io
            // 对于项目站点 (username.github.io/project-name)，需要从URL中提取
            const currentUrl = window.location.href;

            // 检查是否是用户站点
            if (currentUrl.includes('mathliuyang.github.io') && !currentUrl.includes('/pages/')) {
                // 用户站点
                return { owner: 'mathliuyang', repo: 'mathliuyang.github.io' };
            } else {
                // 项目站点或本地开发
                const match = currentUrl.match(/github\.io\/([^/]+)/);
                if (match) {
                    return { owner: 'mathliuyang', repo: match[1] };
                }
            }

            // 默认返回用户站点信息
            return { owner: 'mathliuyang', repo: 'mathliuyang.github.io' };
        }

        // Copy functionality for WeChat and QQ
        document.querySelectorAll('.copy-item').forEach(item => {
            item.addEventListener('click', async function () {
                const textToCopy = this.getAttribute('data-copy');
                const type = this.getAttribute('data-type');

                try {
                    // 尝试使用现代Clipboard API
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(textToCopy);
                        showCopyFeedback(`✓ ${type} 账号复制成功`);
                    } else {
                        // 降级方案：使用document.execCommand
                        const textArea = document.createElement('textarea');
                        textArea.value = textToCopy;
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-999999px';
                        textArea.style.top = '-999999px';
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();

                        try {
                            document.execCommand('copy');
                            showCopyFeedback(`✓ ${type} 账号复制成功`);
                        } catch (err) {
                            console.warn('复制失败:', err);
                            showCopyFeedback('复制失败，请手动选择复制');
                        }

                        document.body.removeChild(textArea);
                    }
                } catch (err) {
                    console.error('复制功能出错:', err);
                    showCopyFeedback('复制失败，请手动选择复制');
                }
            });
        });

        // 显示复制反馈
        function showCopyFeedback(message) {
            // 移除已存在的反馈
            const existingFeedback = document.querySelector('.copy-feedback');
            if (existingFeedback) {
                existingFeedback.classList.remove('show');
                setTimeout(() => {
                    if (existingFeedback.parentNode) {
                        existingFeedback.parentNode.removeChild(existingFeedback);
                    }
                }, 300);
            }

            // 创建反馈元素
            let feedback = document.createElement('div');
            feedback.className = 'copy-feedback';
            feedback.textContent = message;
            document.body.appendChild(feedback);

            // 强制重排以确保动画生效
            feedback.offsetHeight;

            // 显示反馈
            requestAnimationFrame(() => {
                feedback.classList.add('show');
            });

            // 2.5秒后移除反馈
            setTimeout(() => {
                feedback.classList.remove('show');
                setTimeout(() => {
                    if (feedback.parentNode) {
                        feedback.parentNode.removeChild(feedback);
                    }
                }, 300);
            }, 2500);
        }

        // 移除超链接预览
        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('a[href]');

            links.forEach(link => {
                let originalHref = link.href;

                link.addEventListener('mouseenter', function (e) {
                    originalHref = this.href;
                    this.removeAttribute('href');
                    this.style.cursor = 'pointer';
                });

                link.addEventListener('mouseleave', function (e) {
                    this.setAttribute('href', originalHref);
                });

                link.addEventListener('click', function (e) {
                    if (!this.href) {
                        e.preventDefault();
                        window.location.href = originalHref;
                    }
                });
            });
        });
    </script>
</body>
