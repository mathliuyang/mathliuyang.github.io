<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简待办清单</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --bg-secondary: #0A0A0A;
            --text: #ffffff;
            --text-dim: #9ca3af;
            --accent: #00FF88;
            --border: #1A1A1A;
            --card-bg: #0A0A0A;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.8;
            min-height: 100vh;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00FF88;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li {
            list-style: none;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a.active {
            color: var(--accent) !important;
        }

        .nav-links.active {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* 移动端触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            .nav-links a:active {
                color: var(--text);
            }
        }

        .back-btn {
            position: fixed;
            top: 100px;
            left: 4rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            z-index: 99;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 120px 4rem 4rem;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            color: var(--accent);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 300;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .add-section {
            margin-bottom: 3rem;
        }

        .add-form {
            display: flex;
            gap: 1rem;
        }

        .add-input {
            flex: 1;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .add-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-btn {
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg);
            border: 1px solid var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            white-space: nowrap;
            font-family: inherit;
        }

        .add-btn:hover {
            background: transparent;
            color: var(--accent);
        }

        .priority-selector {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .priority-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .priority-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: transparent;
        }

        .todo-list {
            display: grid;
            gap: 1rem;
        }

        .todo-item {
            border: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
            background: var(--card-bg);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            border-color: var(--accent);
        }

        .todo-item.completed {
            opacity: 0.5;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            background: transparent;
        }

        .todo-checkbox:hover {
            border-color: var(--accent);
        }

        .todo-item.completed .todo-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            position: relative;
        }

        .todo-item.completed .todo-checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg);
            font-size: 14px;
            font-weight: bold;
        }

        .todo-content {
            flex: 1;
            cursor: pointer;
        }

        .todo-text {
            font-size: 1rem;
            margin-bottom: 0.3rem;
            color: var(--text);
        }

        .todo-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            gap: 1rem;
        }

        .priority-badge {
            padding: 0.2rem 0.6rem;
            border: 1px solid var(--border);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .priority-high {
            border-color: var(--accent);
            color: var(--accent);
        }

        .priority-medium {
            border-color: #ff9900;
            color: #ff9900;
        }

        .priority-low {
            border-color: var(--text-dim);
            color: var(--text-dim);
        }

        .todo-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .delete-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-dim);
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
            color: var(--accent);
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .logo {
                font-size: 0.9rem;
                text-align: center;
                margin-bottom: 0.5rem;
            }

            .nav-right {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .nav-links {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .container {
                padding: 100px 2rem 2rem;
            }

            .add-form {
                flex-direction: column;
            }

            .stats {
                gap: 2rem;
            }

            .todo-item {
                flex-wrap: wrap;
            }

            .todo-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>
    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <nav id="nav">
        <div class="logo" onclick="location.href='../index.html'"><span style="color:#fff">AICore</span><span style="color:#00FF88">Scholar</span></div>
        <div class="nav-right">
            <button class="mobile-menu-btn" id="mobileMenuBtn">

    <div class="container">
        <div class="header">
            <h1>待办清单</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="activeCount">0</div>

                </div>
                <div class="stat-item">

        <div class="add-section">
            <div class="add-form">

            <button class="filter-btn" data-filter="high">高优先级</button>
        </div>

        <div class="todo-list" id="todoList"></div>
    </div>

    <script>
        // ==========================================
        // Particle System (Three.js)
        // ==========================================
        const initParticles = () => {
            const container = document.getElementById('particle-canvas');
            const scene = new THREE.Scene();
            scene.background = null;
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.z = 45;
            
            const renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);

            const spacing = 0.45;
            const width = 280;
            const height = 140;
            const cols = Math.floor(width / spacing);
            const rows = Math.floor(height / spacing);
            const particleCount = cols * rows;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const randoms = new Float32Array(particleCount);

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const idx = (i * rows + j);
                    positions[idx * 3] = (i - cols / 2) * spacing;
                    positions[idx * 3 + 1] = (j - rows / 2) * spacing;
                    positions[idx * 3 + 2] = 0.0;
                    randoms[idx] = Math.random();
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 },
                    uMousePos: { value: new THREE.Vector2(-999, -999) },
                    uMouseForce: { value: 0.0 },
                    uPixelRatio: { value: pixelRatio }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec2 uMousePos;
                    uniform float uMouseForce;
                    uniform float uPixelRatio;
                    
                    attribute float aRandom;
                    
                    varying vec3 vColor;
                    varying float vAlpha;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                    float snoise(vec3 v) {
                        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                        vec3 i  = floor(v + dot(v, C.yyy));
                        vec3 x0 = v - i + dot(i, C.xxx);
                        vec3 g = step(x0.yzx, x0.xyz);
                        vec3 l = 1.0 - g;
                        vec3 i1 = min(g.xyz, l.zxy);
                        vec3 i2 = max(g.xyz, l.zxy);
                        vec3 x1 = x0 - i1 + C.xxx;
                        vec3 x2 = x0 - i2 + C.yyy;
                        vec3 x3 = x0 - D.yyy;
                        i = mod289(i);
                        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                        float n_ = 0.142857142857;
                        vec3 ns = n_ * D.wyz - D.xzx;
                        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                        vec4 x_ = floor(j * ns.z);
                        vec4 y_ = floor(j - 7.0 * x_);
                        vec4 x = x_ *ns.x + ns.yyyy;
                        vec4 y = y_ *ns.x + ns.yyyy;
                        vec4 h = 1.0 - abs(x) - abs(y);
                        vec4 b0 = vec4(x.xy, y.xy);
                        vec4 b1 = vec4(x.zw, y.zw);
                        vec4 s0 = floor(b0)*2.0 + 1.0;
                        vec4 s1 = floor(b1)*2.0 + 1.0;
                        vec4 sh = -step(h, vec4(0.0));
                        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                        vec3 p0 = vec3(a0.xy,h.x);
                        vec3 p1 = vec3(a0.zw,h.y);
                        vec3 p2 = vec3(a1.xy,h.z);
                        vec3 p3 = vec3(a1.zw,h.w);
                        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                        m = m * m;
                        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                    }

                    void main() {
                        vec3 pos = position;
                        float waveSpeed = 0.15;
                        float waveFreq = 0.008;
                        float waveX = pos.x * waveFreq - uTime * waveSpeed;
                        float waveY = pos.y * waveFreq * 0.5;

                        float mainWave = sin(waveX + snoise(vec3(waveY, 0.0, uTime * 0.02)) * 2.0);
                        float subWave = sin(waveX * 2.5 + uTime * 0.3) * 0.5 + 0.5;
                        float verticalWave = sin(pos.y * 0.01 + uTime * 0.2) * 0.3;
                        float combinedWave = mainWave * 0.6 + subWave * 0.3 + verticalWave * 0.1;

                        float noise = snoise(vec3(pos.x * 0.005, pos.y * 0.005, uTime * 0.03));
                        combinedWave += noise * 0.2;

                        float travelWave = sin(waveX * 3.0 + noise * 2.0);
                        float visibilityThreshold = 0.2 + travelWave * 0.3;
                        float particlePhase = sin(waveX * 5.0 + pos.y * 0.01 + uTime * 0.5 + aRandom * 3.14);
                        float isVisible = step(visibilityThreshold, particlePhase);

                        float dist = distance(pos.xy, uMousePos);
                        float glowForce = exp(-(dist * dist) / 80.0) * uMouseForce;
                        glowForce *= 0.8 + 0.2 * sin(uTime * 4.0 - dist * 0.1);

                        float colorPhase = sin(waveX + uTime * 0.1);
                        float isGreen = step(0.0, colorPhase + (aRandom - 0.5) * 0.6);

                        vec3 cGray = vec3(0.2, 0.2, 0.22);
                        vec3 cDarkGreen = vec3(0.0, 0.5, 0.28);
                        vec3 cBrightGreen = vec3(0.0, 0.75, 0.42);

                        vec3 baseColor = mix(cGray, cDarkGreen, isGreen);
                        float waveFront = smoothstep(0.3, 0.7, particlePhase - visibilityThreshold);
                        baseColor = mix(baseColor, cBrightGreen, waveFront * 0.4);

                        vec3 cHighlight = vec3(0.0, 0.9, 0.5);
                        vColor = mix(baseColor, cHighlight, glowForce * 0.6);

                        float fadeInOut = sin(waveX * 2.0 + uTime * 0.3) * 0.5 + 0.5;
                        float baseAlpha = 0.4 + fadeInOut * 0.4;
                        float breathe = 0.7 + 0.3 * sin(uTime * 3.0 + aRandom * 6.28);

                        vAlpha = isVisible * baseAlpha * breathe;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = uPixelRatio * 4.0 * (45.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vAlpha;
                    
                    void main() {
                        if (vAlpha < 0.05) discard;
                        gl_FragColor = vec4(vColor, vAlpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: false
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

            const targetWorldMouse = new THREE.Vector3(0, 0, 0);
            const currentWorldMouse = new THREE.Vector3(0, 0, 0);

            let targetForce = 0.0;
            let currentForce = 0.0;
            let interactionTimeout;
            let isFirstMove = true;

            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(targetPlane, targetWorldMouse);

                if (isFirstMove) {
                    currentWorldMouse.copy(targetWorldMouse);
                    isFirstMove = false;
                }
                targetForce = 1.0;
                clearTimeout(interactionTimeout);
                interactionTimeout = setTimeout(() => {
                    targetForce = 0.0;
                }, 500);
            });

            window.addEventListener('mouseout', () => {
                targetForce = 0.0;
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                currentWorldMouse.lerp(targetWorldMouse, 0.15);
                currentForce += (targetForce - currentForce) * 0.05;
                material.uniforms.uTime.value = clock.getElapsedTime();
                material.uniforms.uMousePos.value.set(currentWorldMouse.x, currentWorldMouse.y);
                material.uniforms.uMouseForce.value = currentForce;
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // Initialize particles
        initParticles();

        // Navbar scroll effect
        const navbar = document.querySelector('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Todo app
        let todos = JSON.parse(localStorage.getItem('todos') || '[]');
        let currentFilter = 'all';
        let selectedPriority = 'medium';

        // Priority selector
        document.querySelectorAll('.priority-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPriority = btn.dataset.priority;
            });
        });

        // Add todo
        document.getElementById('addBtn').addEventListener('click', addTodo);
        document.getElementById('todoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();

            if (!text) return;

            const todo = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: selectedPriority,
                createdAt: new Date().toISOString()
            };

            todos.unshift(todo);
            saveTodos();
            input.value = '';
            renderTodos();
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTodos();
            });
        });

        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            let filteredTodos = todos;

            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            } else if (currentFilter === 'high') {
                filteredTodos = todos.filter(t => t.priority === 'high');
            }

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">✓</div>
                        <p>暂无任务</p>
                    </div>
                `;
            } else {
                todoList.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                        <div class="todo-checkbox" onclick="toggleTodo(${todo.id})"></div>
                        <div class="todo-content" onclick="toggleTodo(${todo.id})">
                            <div class="todo-text">${todo.text}</div>
                            <div class="todo-meta">
                                <span class="priority-badge priority-${todo.priority}">${getPriorityText(todo.priority)}</span>
                                <span>${formatDate(todo.createdAt)}</span>
                            </div>
                        </div>
                        <div class="todo-actions">
                            <button class="action-btn delete-btn" onclick="deleteTodo(${todo.id})">×</button>
                        </div>
                    </div>
                `).join('');
            }

            updateStats();
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            renderTodos();
        }

        function getPriorityText(priority) {
            const map = { low: '低', medium: '中', high: '高' };
            return map[priority] || priority;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = todos.length;
            document.getElementById('activeCount').textContent = todos.filter(t => !t.completed).length;
            document.getElementById('completedCount').textContent = todos.filter(t => t.completed).length;
        }

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Initial render
        renderTodos();

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        if (mobileMenuBtn && navLinks) {
            mobileMenuBtn.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                mobileMenuBtn.classList.toggle('active');
            });

            // Close menu when clicking on a link
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }
    </script>
</body>

</html>
