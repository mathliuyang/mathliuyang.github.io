<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000000;
        }

        :root {
            --bg: #000000;
            --bg-secondary: #0A0A0A;
            --text: #ffffff;
            --text-dim: #9ca3af;
            --accent: #00FF88;
            --grid-bg: #0A0A0A;
            --tile-bg: #1A1A1A;
            --border: #1A1A1A;
            --card-bg: #0A0A0A;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00FF88;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li {
            list-style: none;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a.active {
            color: var(--accent) !important;
        }

        .nav-links.active {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* 移动端触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            .nav-links a:active {
                color: var(--text);
            }
        }

        .container {
            flex: 1;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
        }

        .scores {
            display: flex;
            gap: 1rem;
        }

        .score-box {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .score-label {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .instruction {
            opacity: 0.7;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        .new-game-btn {
            background: var(--accent);
            color: var(--bg);
            border: 1px solid var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-game-btn:hover:not(:disabled) {
            background: transparent;
            color: var(--accent);
        }

        .new-game-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
        }

        .game-board {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 6px;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border-radius: 3px;
            position: relative;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            border-radius: 3px;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tile.new {
            animation: tileAppear 0.3s ease-out;
        }

        .tile.merged {
            animation: tileMerge 0.3s ease-out;
        }

        @keyframes tileAppear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes tileMerge {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .tile-2 {
            background: #1A1A1A;
            color: var(--text);
        }

        .tile-4 {
            background: #2A2A2A;
            color: var(--text);
        }

        .tile-8 {
            background: #3A3A3A;
            color: var(--text);
        }

        .tile-16 {
            background: #4A4A4A;
            color: var(--text);
        }

        .tile-32 {
            background: #5A5A5A;
            color: var(--text);
        }

        .tile-64 {
            background: #6A6A6A;
            color: var(--text);
        }

        .tile-128 {
            background: #007a42;
            color: var(--text);
            font-size: 1.8rem;
        }

        .tile-256 {
            background: #00914f;
            color: var(--text);
            font-size: 1.8rem;
        }

        .tile-512 {
            background: #00a85c;
            color: var(--text);
            font-size: 1.8rem;
        }

        .tile-1024 {
            background: #00bf69;
            color: var(--text);
            font-size: 1.5rem;
        }

        .tile-2048 {
            background: var(--accent);
            color: var(--bg);
            font-size: 1.5rem;
        }

        .game-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 6px;
            z-index: 100;
        }

        .game-message.show {
            display: flex;
        }

        .message-text {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent);
            letter-spacing: -0.03em;
        }

        .try-again-btn {
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg);
            border: 1px solid var(--accent);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .try-again-btn:hover {
            background: transparent;
            color: var(--accent);
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .logo {
                font-size: 0.9rem;
                text-align: center;
                margin-bottom: 0.5rem;
            }

            .nav-right {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .nav-links {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .container {
                padding: 2rem 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .tile {
                font-size: 1.5rem;
            }

            .tile-128,
            .tile-256,
            .tile-512 {
                font-size: 1.3rem;
            }

            .tile-1024,
            .tile-2048 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <nav id="nav">
        <div class="logo" onclick="location.href='../index.html'"><span style="color:#fff">AICore</span><span style="color:#00FF88">Scholar</span></div>
        <div class="nav-right">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">首页</a></li>
                <li><a href="./pinns-research.html">AI4PDEs 论文</a></li>
                <li><a href="./prompt-generator.html">智核提示词</a></li>
                <li><a href="./journal_html_page.html">期刊指南</a></li>

                <li><a href="../pages/tools.html" class="active">更多工具</a></li>
                <li><a href="../pages/contact.html">联系我们</a></li>
            </ul>
        </div>
    </nav>
    <div style="margin-bottom: 4rem;"></div>
    <div class="container">
        <div class="header">
            <div class="title">2048</div>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高</div>
                    <div class="score-value" id="best">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">步数</div>
                    <div class="score-value" id="moves">0</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="instruction">使用方向键或滑动移动方块</div>
            <div class="button-group">
                <button class="new-game-btn" onclick="newGame()">新游戏</button>
                <button class="new-game-btn" onclick="undoMove()" id="undoBtn" disabled>撤销</button>
            </div>
        </div>

        <div class="game-board">
            <div class="grid" id="grid"></div>
            <div class="game-message" id="gameMessage">
                <div class="message-text" id="messageText"></div>
                <button class="try-again-btn" onclick="newGame()">再试一次</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // Particle System (Three.js)
        // ==========================================
        const initParticles = () => {
            const container = document.getElementById('particle-canvas');
            const scene = new THREE.Scene();
            scene.background = null;
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.z = 45;
            
            const renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);

            const spacing = 0.45;
            const width = 280;
            const height = 140;
            const cols = Math.floor(width / spacing);
            const rows = Math.floor(height / spacing);
            const particleCount = cols * rows;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const randoms = new Float32Array(particleCount);

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const idx = (i * rows + j);
                    positions[idx * 3] = (i - cols / 2) * spacing;
                    positions[idx * 3 + 1] = (j - rows / 2) * spacing;
                    positions[idx * 3 + 2] = 0.0;
                    randoms[idx] = Math.random();
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 },
                    uMousePos: { value: new THREE.Vector2(-999, -999) },
                    uMouseForce: { value: 0.0 },
                    uPixelRatio: { value: pixelRatio }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec2 uMousePos;
                    uniform float uMouseForce;
                    uniform float uPixelRatio;
                    attribute float aRandom;
                    varying vec3 vColor;
                    varying float vAlpha;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                    float snoise(vec3 v) {
                        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                        vec3 i  = floor(v + dot(v, C.yyy));
                        vec3 x0 = v - i + dot(i, C.xxx);
                        vec3 g = step(x0.yzx, x0.xyz);
                        vec3 l = 1.0 - g;
                        vec3 i1 = min(g.xyz, l.zxy);
                        vec3 i2 = max(g.xyz, l.zxy);
                        vec3 x1 = x0 - i1 + C.xxx;
                        vec3 x2 = x0 - i2 + C.yyy;
                        vec3 x3 = x0 - D.yyy;
                        i = mod289(i);
                        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                        float n_ = 0.142857142857;
                        vec3 ns = n_ * D.wyz - D.xzx;
                        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                        vec4 x_ = floor(j * ns.z);
                        vec4 y_ = floor(j - 7.0 * x_);
                        vec4 x = x_ *ns.x + ns.yyyy;
                        vec4 y = y_ *ns.x + ns.yyyy;
                        vec4 h = 1.0 - abs(x) - abs(y);
                        vec4 b0 = vec4(x.xy, y.xy);
                        vec4 b1 = vec4(x.zw, y.zw);
                        vec4 s0 = floor(b0)*2.0 + 1.0;
                        vec4 s1 = floor(b1)*2.0 + 1.0;
                        vec4 sh = -step(h, vec4(0.0));
                        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                        vec3 p0 = vec3(a0.xy,h.x);
                        vec3 p1 = vec3(a0.zw,h.y);
                        vec3 p2 = vec3(a1.xy,h.z);
                        vec3 p3 = vec3(a1.zw,h.w);
                        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                        m = m * m;
                        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                    }

                    void main() {
                        vec3 pos = position;
                        float waveSpeed = 0.15;
                        float waveFreq = 0.008;
                        float waveX = pos.x * waveFreq - uTime * waveSpeed;
                        float waveY = pos.y * waveFreq * 0.5;

                        float mainWave = sin(waveX + snoise(vec3(waveY, 0.0, uTime * 0.02)) * 2.0);
                        float subWave = sin(waveX * 2.5 + uTime * 0.3) * 0.5 + 0.5;
                        float verticalWave = sin(pos.y * 0.01 + uTime * 0.2) * 0.3;
                        float combinedWave = mainWave * 0.6 + subWave * 0.3 + verticalWave * 0.1;

                        float noise = snoise(vec3(pos.x * 0.005, pos.y * 0.005, uTime * 0.03));
                        combinedWave += noise * 0.2;

                        float travelWave = sin(waveX * 3.0 + noise * 2.0);
                        float visibilityThreshold = 0.2 + travelWave * 0.3;
                        float particlePhase = sin(waveX * 5.0 + pos.y * 0.01 + uTime * 0.5 + aRandom * 3.14);
                        float isVisible = step(visibilityThreshold, particlePhase);

                        float dist = distance(pos.xy, uMousePos);
                        float glowForce = exp(-(dist * dist) / 80.0) * uMouseForce;
                        glowForce *= 0.8 + 0.2 * sin(uTime * 4.0 - dist * 0.1);

                        float colorPhase = sin(waveX + uTime * 0.1);
                        float isGreen = step(0.0, colorPhase + (aRandom - 0.5) * 0.6);

                        vec3 cGray = vec3(0.2, 0.2, 0.22);
                        vec3 cDarkGreen = vec3(0.0, 0.5, 0.28);
                        vec3 cBrightGreen = vec3(0.0, 0.75, 0.42);

                        vec3 baseColor = mix(cGray, cDarkGreen, isGreen);
                        float waveFront = smoothstep(0.3, 0.7, particlePhase - visibilityThreshold);
                        baseColor = mix(baseColor, cBrightGreen, waveFront * 0.4);

                        vec3 cHighlight = vec3(0.0, 0.9, 0.5);
                        vColor = mix(baseColor, cHighlight, glowForce * 0.6);

                        float fadeInOut = sin(waveX * 2.0 + uTime * 0.3) * 0.5 + 0.5;
                        float baseAlpha = 0.4 + fadeInOut * 0.4;
                        float breathe = 0.7 + 0.3 * sin(uTime * 3.0 + aRandom * 6.28);

                        vAlpha = isVisible * baseAlpha * breathe;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = uPixelRatio * 4.0 * (45.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vAlpha;
                    void main() {
                        if (vAlpha < 0.05) discard;
                        gl_FragColor = vec4(vColor, vAlpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: false
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

            const targetWorldMouse = new THREE.Vector3(0, 0, 0);
            const currentWorldMouse = new THREE.Vector3(0, 0, 0);

            let targetForce = 0.0;
            let currentForce = 0.0;
            let interactionTimeout;
            let isFirstMove = true;

            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(targetPlane, targetWorldMouse);

                if (isFirstMove) {
                    currentWorldMouse.copy(targetWorldMouse);
                    isFirstMove = false;
                }
                targetForce = 1.0;
                clearTimeout(interactionTimeout);
                interactionTimeout = setTimeout(() => {
                    targetForce = 0.0;
                }, 500);
            });

            window.addEventListener('mouseout', () => {
                targetForce = 0.0;
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                currentWorldMouse.lerp(targetWorldMouse, 0.15);
                currentForce += (targetForce - currentForce) * 0.05;
                material.uniforms.uTime.value = clock.getElapsedTime();
                material.uniforms.uMousePos.value.set(currentWorldMouse.x, currentWorldMouse.y);
                material.uniforms.uMouseForce.value = currentForce;
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // Initialize particles
        initParticles();

        // Navbar scroll effect
        const navbar = document.querySelector('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Game logic
        let grid = [];
        let score = 0;
        let best = 0;
        let moves = 0;
        let gameWon = false;
        let history = [];
        const maxHistory = 10;

        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const bestElement = document.getElementById('best');
        const movesElement = document.getElementById('moves');
        const gameMessage = document.getElementById('gameMessage');
        const messageText = document.getElementById('messageText');

        function initGrid() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                gridElement.appendChild(cell);
            }
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) emptyCells.push({ r, c });
                }
            }

            if (emptyCells.length > 0) {
                const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                return { r, c };
            }
            return null;
        }

        function renderGrid(newTilePos = null, mergedTiles = []) {
            document.querySelectorAll('.tile').forEach(t => t.remove());

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${grid[r][c]}`;

                        if (newTilePos && newTilePos.r === r && newTilePos.c === c) {
                            tile.classList.add('new');
                        }
                        if (mergedTiles.some(pos => pos.r === r && pos.c === c)) {
                            tile.classList.add('merged');
                        }

                        tile.textContent = grid[r][c];

                        const targetCell = document.getElementById(`cell-${r * 4 + c}`);
                        if (targetCell) {
                            const cellRect = targetCell.getBoundingClientRect();
                            const gridRect = gridElement.getBoundingClientRect();

                            const relativeTop = cellRect.top - gridRect.top;
                            const relativeLeft = cellRect.left - gridRect.left;

                            tile.style.width = cellRect.width + 'px';
                            tile.style.height = cellRect.height + 'px';
                            tile.style.top = relativeTop + 'px';
                            tile.style.left = relativeLeft + 'px';

                            gridElement.appendChild(tile);
                        }
                    }
                }
            }

            scoreElement.textContent = score;
            bestElement.textContent = best;
            movesElement.textContent = moves;
        }

        function saveState() {
            history.push({
                grid: grid.map(row => [...row]),
                score: score,
                moves: moves
            });
            if (history.length > maxHistory) {
                history.shift();
            }
            document.getElementById('undoBtn').disabled = false;
        }

        function undoMove() {
            if (history.length > 0) {
                const previousState = history.pop();
                grid = previousState.grid;
                score = previousState.score;
                moves = previousState.moves;
                renderGrid();

                if (history.length === 0) {
                    document.getElementById('undoBtn').disabled = true;
                }
            }
        }

        // 处理一行的移动和合并（向左）
        function processLine(line) {
            // 移除所有0
            const filtered = line.filter(val => val !== 0);
            const merged = [];
            let i = 0;

            // 合并相同的相邻数字
            while (i < filtered.length) {
                if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
                    merged.push(filtered[i] * 2);
                    score += filtered[i] * 2;
                    i += 2;
                } else {
                    merged.push(filtered[i]);
                    i++;
                }
            }

            // 填充0到右边
            while (merged.length < 4) {
                merged.push(0);
            }

            return merged;
        }

        function move(direction) {
            saveState();
            let moved = false;
            const newGrid = grid.map(row => [...row]);

            if (direction === 'left') {
                for (let r = 0; r < 4; r++) {
                    const processed = processLine(grid[r]);
                    for (let c = 0; c < 4; c++) {
                        if (grid[r][c] !== processed[c]) moved = true;
                        newGrid[r][c] = processed[c];
                    }
                }
            } else if (direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const reversed = [...grid[r]].reverse();
                    const processed = processLine(reversed);
                    const result = processed.reverse();
                    for (let c = 0; c < 4; c++) {
                        if (grid[r][c] !== result[c]) moved = true;
                        newGrid[r][c] = result[c];
                    }
                }
            } else if (direction === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = [];
                    for (let r = 0; r < 4; r++) {
                        col.push(grid[r][c]);
                    }
                    const processed = processLine(col);
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== processed[r]) moved = true;
                        newGrid[r][c] = processed[r];
                    }
                }
            } else if (direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    const col = [];
                    for (let r = 0; r < 4; r++) {
                        col.push(grid[r][c]);
                    }
                    const reversed = col.reverse();
                    const processed = processLine(reversed);
                    const result = processed.reverse();
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== result[r]) moved = true;
                        newGrid[r][c] = result[r];
                    }
                }
            }

            if (moved) {
                grid = newGrid;
                moves++;
                const newTilePos = addRandomTile();
                renderGrid(newTilePos);
                checkWin();
                checkGameOver();
            } else {
                // 如果没有移动，撤销保存的状态
                history.pop();
                if (history.length === 0) {
                    document.getElementById('undoBtn').disabled = true;
                }
            }
        }

        function checkWin() {
            if (gameWon) return;

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 2048) {
                        gameWon = true;
                        showMessage('恭喜获胜！');
                        return;
                    }
                }
            }
        }

        function checkGameOver() {
            // 检查是否还有空格
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return;
                }
            }

            // 检查是否还能合并
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
                }
            }

            showMessage('游戏结束！');
        }

        function showMessage(msg) {
            messageText.textContent = msg;
            gameMessage.classList.add('show');
            if (score > best) {
                best = score;
            }
        }

        function newGame() {
            score = 0;
            moves = 0;
            gameWon = false;
            gameMessage.classList.remove('show');
            history = [];
            document.getElementById('undoBtn').disabled = true;

            document.querySelectorAll('.tile').forEach(t => t.remove());
            grid = Array(4).fill().map(() => Array(4).fill(0));

            addRandomTile();
            addRandomTile();
            renderGrid();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    move('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    move('down');
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    move('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    move('right');
                    break;
                case 'n':
                case 'N':
                    newGame();
                    break;
            }

            // Ctrl+Z 或 Cmd+Z 撤销
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undoMove();
            }
        });

        // 触摸事件
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > 30) {
                    move(deltaX > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(deltaY) > 30) {
                    move(deltaY > 0 ? 'down' : 'up');
                }
            }

            touchStartX = 0;
            touchStartY = 0;
        });

        // 窗口大小改变时重新渲染
        window.addEventListener('resize', () => {
            setTimeout(renderGrid, 100);
        });

        // 初始化游戏
        window.newGame = newGame;
        initGrid();
        newGame();

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        if (mobileMenuBtn && navLinks) {
            mobileMenuBtn.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                mobileMenuBtn.classList.toggle('active');
            });

            // Close menu when clicking on a link
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }
    </script>
</body>

</html>
