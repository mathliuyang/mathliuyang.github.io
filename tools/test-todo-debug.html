<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项调试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>待办事项调试页面</h1>
    <div id="debugOutput"></div>
    
    <script>
        const debugOutput = document.getElementById('debugOutput');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `debug-info ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugOutput.appendChild(div);
        }
        
        // 测试基本环境
        log('开始调试环境检查...', 'info');
        log(`User Agent: ${navigator.userAgent}`, 'info');
        log(`当前URL: ${window.location.href}`, 'info');
        
        // 测试模块加载
        async function testModuleLoading() {
            try {
                log('开始测试模块加载...', 'info');
                const todoModule = await import('./todo-data.js');
                log('✅ 模块加载成功', 'success');
                log(`可用函数: ${Object.keys(todoModule).join(', ')}`, 'info');
                
                // 测试数据访问
                const todos = todoModule.getTodos();
                log(`获取到 ${todos.length} 个待办事项`, 'info');
                
                if (todos.length > 0) {
                    log(`第一个待办事项: ${todos[0].text}`, 'info');
                }
                
            } catch (error) {
                log(`❌ 模块加载失败: ${error.message}`, 'error');
                log(`错误详情: ${error.stack}`, 'error');
            }
        }
        
        // 测试DOM元素
        function testDOMElements() {
            const elements = ['syncBtn', 'syncStatus', 'todoList', 'todoInput'];
            elements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    log(`✅ 找到元素: ${id}`, 'success');
                } else {
                    log(`❌ 未找到元素: ${id}`, 'warning');
                }
            });
        }
        
        // 测试本地存储
        function testLocalStorage() {
            try {
                localStorage.setItem('test', 'value');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                log(`✅ 本地存储正常: ${value}`, 'success');
            } catch (error) {
                log(`❌ 本地存储失败: ${error.message}`, 'error');
            }
        }
        
        // 运行所有测试
        setTimeout(() => {
            testModuleLoading();
            testDOMElements();
            testLocalStorage();
        }, 1000);
        
        // 监听未捕获的错误
        window.addEventListener('error', (event) => {
            log(`❌ 未捕获错误: ${event.message}`, 'error');
            log(`错误文件: ${event.filename}:${event.lineno}:${event.colno}`, 'error');
        });
        
        // 监听未处理的Promise拒绝
        window.addEventListener('unhandledrejection', (event) => {
            log(`❌ 未处理的Promise拒绝: ${event.reason}`, 'error');
        });
        
        log('调试页面加载完成', 'info');
    </script>
</body>
</html>
