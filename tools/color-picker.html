        function drawLineChart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 90;  // 优化边距：从100调整为90，提供更好的空间利用率
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 根据配色数量动态调整数据集数量
            const datasets = Math.min(colors.length, 16); // 支持最多16条线
            const dataPoints = 50; // 增加数据点以提高精度
            const data = [];

            // 生成科学数据模拟（不同的函数模式）
            for (let i = 0; i < datasets; i++) {
                const series = [];
                for (let j = 0; j < dataPoints; j++) {
                    const x = j / (dataPoints - 1);
                    let y;
                    switch (i % 4) {
                        case 0: // 指数增长
                            y = 0.1 + 0.7 * Math.pow(x, 2) + 0.05 * Math.random();
                            break;
                        case 1: // 对数增长
                            y = 0.2 + 0.6 * Math.log(1 + 4 * x) / Math.log(5) + 0.05 * Math.random();
                            break;
                        case 2: // 正弦波动
                            y = 0.5 + 0.3 * Math.sin(3 * Math.PI * x + i * Math.PI / 4) + 0.05 * Math.random();
                            break;
                        case 3: // 线性趋势
                            y = 0.3 + 0.4 * x + 0.1 * Math.sin(8 * Math.PI * x) + 0.05 * Math.random();
                            break;
                    }
                    series.push({ x, y: Math.max(0.05, Math.min(0.95, y)) });
                }
                data.push(series);
            }

            // 绘制专业网格系统
            drawAcademicGrid(ctx, width, height, padding, 10, 5);
            drawAxisLabels(ctx, width, height, padding, 'Time (s)', 'Response (μV)');

            // 添加X轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = 0; i <= 10; i++) {
                const x = padding + i * chartWidth / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x, height - padding);
                ctx.lineTo(x, height - padding + 5);
                ctx.stroke();

                // 标签
                ctx.fillText(value, x, height - padding + 8);
            }

            // 添加Y轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            for (let i = 0; i <= 10; i++) {
                const y = height - padding - i * chartHeight / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 标签
                ctx.fillText(value, padding - 8, y);
            }

            // 绘制数据线（更专业的样式）
            data.forEach((series, index) => {
                const color = colors[index % colors.length];

                // 绘制数据线
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();

                series.forEach((point, i) => {
                    const x = padding + point.x * chartWidth;
                    const y = height - padding - point.y * chartHeight;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();

                // 绘制数据点（科学图表风格）
                ctx.fillStyle = color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                series.forEach((point, i) => {
                    if (i % 3 === 0) { // 每3个点显示一个标记
                        const x = padding + point.x * chartWidth;
                        const y = height - padding - point.y * chartHeight;
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.stroke();
                    }
                });
            });

            // 图例已移除（根据用户需求）
            // const legendLabels = [];
            // for (let i = 0; i < datasets; i++) {
            //     legendLabels.push(`Series ${String.fromCharCode(65 + i)}`); // A, B, C, ...
            // }
            // drawLineChartLegendBottom(ctx, width, height, colors, datasets, legendLabels);

            // 添加图表标题
            drawChartTitle(ctx, width, '线性图 - 智核学术');
        }

        // 专门为线性图绘制的标准图例（学术风格）
        function drawLineChartLegend(ctx, width, height, colors, datasets, labels) {
            const legendX = width - 150;  // 图例位置：右侧
            const legendY = 60;  // 顶部位置
            const itemHeight = 25;  // 每项高度
            const lineLength = 20;  // 线条长度
            const spacing = 8;  // 元素间距

            // 绘制图例背景（学术标准）
            const legendWidth = 120;
            const legendHeight = datasets * itemHeight + 20;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1.5;  // 学术标准：1.5px边框
            ctx.fillRect(legendX - 10, legendY - 10, legendWidth, legendHeight);
            ctx.strokeRect(legendX - 10, legendY - 10, legendWidth, legendHeight);

            // 绘制每个系列的线条和标签（标准线性图图例样式）
            for (let i = 0; i < datasets; i++) {
                const y = legendY + i * itemHeight + 15;
                const color = colors[i % colors.length];

                // 绘制线条样本（2.5px线宽，与数据线一致）
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(legendX, y);
                ctx.lineTo(legendX + lineLength, y);
                ctx.stroke();

                // 绘制数据点样本（4px圆形，白色边框）
                ctx.fillStyle = color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(legendX + lineLength / 2, y, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // 绘制标签
                ctx.fillStyle = '#000000';  // 学术标准：纯黑色文本
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 中文科研标准字体
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], legendX + lineLength + spacing, y);
            }
        }

        // 线性图底部横向图例（横放在X轴与标签中间）
        function drawLineChartLegendBottom(ctx, width, height, colors, datasets, labels) {
            const itemWidth = 90;  // 每项宽度（从80增加到90）
            const itemHeight = 25;  // 每项高度（从20增加到25）
            const lineLength = 25;  // 线条长度保持不变
            const spacing = 15;  // 元素间距（从8增加到15）

            // 智能行数控制：小于8个单行显示，大于18个双行显示，中间值最多2行
            let maxPerRow;
            if (datasets <= 8) {
                maxPerRow = datasets; // 小于等于8个时单行显示
            } else if (datasets > 18) {
                maxPerRow = Math.ceil(datasets / 2); // 大于18个时双行显示
            } else {
                maxPerRow = Math.ceil(datasets / 2); // 8-18个时最多2行
            }

            const rows = Math.ceil(datasets / maxPerRow);

            // 计算图例总宽度和位置（居中放置在X轴上方）
            const totalWidth = Math.min(datasets, maxPerRow) * itemWidth;
            const rowSpacing = rows > 1 ? 3.33 : 0; // 双行时间距缩小为1/3（10px->3.33px）
            const totalHeight = rows * itemHeight + (rows - 1) * rowSpacing; // 精确计算总高度
            const legendX = (width - totalWidth) / 2;  // 水平居中
            const legendY = height - 60 - (rows - 1) * rowSpacing; // 调整垂直位置

            // 绘制每个系列的水平排列图例项（支持多行）
            for (let i = 0; i < datasets; i++) {
                const row = Math.floor(i / maxPerRow);
                const col = i % maxPerRow;
                const x = legendX + col * itemWidth + 10;
                const y = legendY + row * (itemHeight + rowSpacing); // 使用缩小后的行间距
                const color = colors[i % colors.length];

                // 绘制线条样本（2.5px线宽，与数据线一致）
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x, y + itemHeight / 2);
                ctx.lineTo(x + lineLength, y + itemHeight / 2);
                ctx.stroke();

                // 绘制数据点样本（4px圆形，白色边框）
                ctx.fillStyle = color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x + lineLength / 2, y + itemHeight / 2, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // 绘制标签
                ctx.fillStyle = '#000000';  // 学术标准：纯黑色文本
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 中文科研标准字体
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], x + lineLength + spacing, y + itemHeight / 2);
            }
        }

        function drawBarChart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：从80调整为85，确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清除画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态设置类别数量（基于配色数量）
            const categories = Math.min(colors.length, 16);
            const barWidth = chartWidth / categories * 0.6;
            const barSpacing = chartWidth / categories * 0.4;

            // 生成科学数据（模拟实验结果）
            const data = [];
            const labels = [];
            for (let i = 0; i < categories; i++) {
                // 模拟不同实验条件的结果
                const baseValue = 0.3 + 0.4 * Math.sin(i * Math.PI / (categories - 1));
                const noise = (Math.random() - 0.5) * 0.2;
                data.push(Math.max(0.1, Math.min(0.9, baseValue + noise)));
                labels.push(`Group ${String.fromCharCode(65 + i)}`); // A, B, C, ...
            }

            // 绘制专业网格系统
            drawAcademicGrid(ctx, width, height, padding);

            // 绘制坐标轴标签
            drawAxisLabels(ctx, width, height, padding, 'Experimental Groups', 'Response Rate (%)');

            // 绘制柱状图（学术风格）
            data.forEach((value, index) => {
                const x = padding + (index * chartWidth / categories) + barSpacing / 2;
                const barHeight = value * chartHeight;
                const y = height - padding - barHeight;

                // 柱子填充
                ctx.fillStyle = colors[index % colors.length];
                ctx.fillRect(x, y, barWidth, barHeight);

                // 柱子边框（专业外观）
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, barWidth, barHeight);

                // 数值标签（在柱子顶部）
                ctx.fillStyle = '#333333';
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                ctx.textAlign = 'center';
                const percentage = (value * 100).toFixed(1);
                ctx.fillText(`${percentage}%`, x + barWidth / 2, y - 8);

                // X轴标签
                ctx.fillStyle = '#333333';
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                ctx.textAlign = 'center';
                ctx.fillText(labels[index], x + barWidth / 2, height - padding + 20);
            });

            // 绘制Y轴刻度和标签
            for (let i = 0; i <= 10; i++) {
                const y = height - padding - (i / 10) * chartHeight;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 刻度标签
                ctx.fillStyle = '#333333';
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                ctx.textAlign = 'right';
                ctx.fillText(value, padding - 10, y + 3);
            }

            // 添加图表标题
            drawChartTitle(ctx, width, '柱状图 - 智核学术');
        }

        function drawBoxPlot(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清除画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态设置组数（基于配色数量）
            const groups = Math.min(colors.length, 16);
            const boxWidth = Math.max(20, chartWidth / groups * 0.5);

            // 绘制专业网格系统
            drawAcademicGrid(ctx, width, height, padding);

            // 绘制坐标轴标签
            drawAxisLabels(ctx, width, height, padding, 'Treatment Groups', 'Measurement Values');

            // 绘制箱线图（学术风格）
            const boxData = [];
            for (let i = 0; i < groups; i++) {
                const x = padding + (i + 0.5) * chartWidth / groups;

                // 生成更真实的科学数据分布
                const baseValue = 0.4 + 0.3 * Math.sin(i * Math.PI / (groups - 1));
                const spread = 0.15 + 0.1 * Math.random();

                // 五数概括统计
                const min = Math.max(0.05, baseValue - spread * 1.5);
                const q1 = baseValue - spread * 0.7;
                const median = baseValue + (Math.random() - 0.5) * spread * 0.3;
                const q3 = baseValue + spread * 0.7;
                const max = Math.min(0.95, baseValue + spread * 1.5);

                // 转换为画布坐标
                const y1 = height - padding - min * chartHeight;
                const y2 = height - padding - q1 * chartHeight;
                const yMedian = height - padding - median * chartHeight;
                const y3 = height - padding - q3 * chartHeight;
                const y4 = height - padding - max * chartHeight;

                const color = colors[i % colors.length];

                // 箱体填充（半透明）
                ctx.fillStyle = color + '30';
                ctx.fillRect(x - boxWidth / 2, y3, boxWidth, y2 - y3);

                // 箱体边框
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(x - boxWidth / 2, y3, boxWidth, y2 - y3);

                // 中位数线（加粗）
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x - boxWidth / 2, yMedian);
                ctx.lineTo(x + boxWidth / 2, yMedian);
                ctx.stroke();

                // 须线
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                // 上须线
                ctx.moveTo(x, y3);
                ctx.lineTo(x, y4);
                // 下须线
                ctx.moveTo(x, y2);
                ctx.lineTo(x, y1);
                ctx.stroke();

                // 端点横线
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - boxWidth / 3, y1);
                ctx.lineTo(x + boxWidth / 3, y1);
                ctx.moveTo(x - boxWidth / 3, y4);
                ctx.lineTo(x + boxWidth / 3, y4);
                ctx.stroke();

                // 异常值点（随机生成少量）
                if (Math.random() < 0.3) {
                    const outlierY = height - padding - (max + 0.1 + Math.random() * 0.1) * chartHeight;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(x, outlierY, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }

                // X轴标签
                ctx.fillStyle = '#333333';
                ctx.font = '11px "Times New Roman", serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Series ${i + 1}`, x, height - padding + 20);

                // 存储数据用于统计显示
                boxData.push({ min, q1, median, q3, max, color });
            }

            // 绘制Y轴刻度
            for (let i = 0; i <= 10; i++) {
                const y = height - padding - (i / 10) * chartHeight;
                const value = (i / 10).toFixed(1);

                // 刻度线
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 刻度标签
                ctx.fillStyle = '#333333';
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                ctx.textAlign = 'right';
                ctx.fillText(value, padding - 10, y + 3);
            }

            // 添加图表标题
            drawChartTitle(ctx, width, '箱线图 - 智核学术');
        }

        function drawHeatmap(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态调整网格大小，支持更多颜色
            const maxColors = Math.min(colors.length, 16); // 支持最多16种颜色
            const rows = Math.ceil(Math.sqrt(maxColors * 0.8));
            const cols = Math.ceil(maxColors * 1.2 / rows);
            const cellWidth = chartWidth / cols;
            const cellHeight = chartHeight / rows;

            // 绘制学术化网格和坐标轴
            drawAcademicGrid(ctx, width, height, padding, 5, 5);
            drawAxisLabels(ctx, width, height, padding, 'Spatial Coordinate (mm)', 'Temperature (°C)');

            // 生成科学化热力图数据（模拟温度分布）
            const data = [];
            for (let i = 0; i < rows; i++) {
                const row = [];
                for (let j = 0; j < cols; j++) {
                    // 生成高斯分布的温度数据
                    const centerX = cols / 2;
                    const centerY = rows / 2;
                    const distance = Math.sqrt(Math.pow(j - centerX, 2) + Math.pow(i - centerY, 2));
                    const maxDistance = Math.sqrt(Math.pow(centerX, 2) + Math.pow(centerY, 2));
                    const normalizedDistance = distance / maxDistance;
                    const temperature = Math.exp(-2 * normalizedDistance) + 0.1 * Math.random();
                    row.push(Math.min(1, Math.max(0, temperature)));
                }
                data.push(row);
            }

            // 绘制热力图单元格
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const value = data[i][j];
                    const colorIndex = Math.floor(value * (maxColors - 1));
                    const color = colors[colorIndex % colors.length];

                    const x = padding + j * cellWidth;
                    const y = padding + i * cellHeight;

                    // 绘制带透明度的单元格
                    const alpha = Math.floor((0.3 + value * 0.7) * 255).toString(16).padStart(2, '0');
                    ctx.fillStyle = color + alpha;
                    ctx.fillRect(x, y, cellWidth, cellHeight);

                    // 绘制单元格边框
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, cellWidth, cellHeight);

                    // 在较大单元格中显示数值
                    if (cellWidth > 30 && cellHeight > 20) {
                        ctx.fillStyle = value > 0.5 ? '#ffffff' : '#333333';
                        ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                        ctx.textAlign = 'center';
                        ctx.fillText((value * 100).toFixed(0), x + cellWidth / 2, y + cellHeight / 2 + 3);
                    }
                }
            }

            // 绘制颜色条图例
            const legendX = width - padding + 20;
            const legendY = padding;
            const legendWidth = 20;
            const legendHeight = chartHeight;

            for (let i = 0; i < 100; i++) {
                const value = i / 99;
                const colorIndex = Math.floor(value * (maxColors - 1));
                const color = colors[colorIndex % colors.length];
                const y = legendY + (1 - value) * legendHeight;

                ctx.fillStyle = color;
                ctx.fillRect(legendX, y, legendWidth, legendHeight / 100 + 1);
            }

            // 颜色条边框和标签
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            ctx.strokeRect(legendX, legendY, legendWidth, legendHeight);

            // 颜色条刻度标签
            for (let i = 0; i <= 4; i++) {
                const value = i / 4;
                const y = legendY + (1 - value) * legendHeight;
                ctx.fillStyle = '#333333';
                ctx.font = '12px "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif';  // 统一中文字体
                ctx.textAlign = 'left';
                ctx.fillText((value * 100).toFixed(0), legendX + legendWidth + 5, y + 3);
            }

            // 添加学术化标题
            drawChartTitle(ctx, width, '热力图 - 智核学术');
        }

        function drawDistributionChart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态调整分布数量，支持更多颜色
            const maxDistributions = Math.min(colors.length, 16);

            // 绘制学术化网格和坐标轴
            drawAcademicGrid(ctx, width, height, padding, 10, 5);
            drawAxisLabels(ctx, width, height, padding, 'Variable X', 'Probability Density');

            // 添加X轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = 0; i <= 10; i++) {
                const x = padding + i * chartWidth / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x, height - padding);
                ctx.lineTo(x, height - padding + 5);
                ctx.stroke();

                // 标签
                ctx.fillText(value, x, height - padding + 8);
            }

            // 添加Y轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            for (let i = 0; i <= 10; i++) {
                const y = height - padding - i * chartHeight / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 标签
                ctx.fillText(value, padding - 8, y);
            }

            // 生成不同类型的概率分布
            const distributionTypes = ['normal', 'exponential', 'gamma', 'beta'];

            // 绘制分布曲线
            for (let d = 0; d < maxDistributions; d++) {
                const points = 200;
                const color = colors[d % colors.length];
                const distType = distributionTypes[d % distributionTypes.length];

                // 设置不同分布的参数
                let mean, std, lambda, alpha, beta;
                switch (distType) {
                    case 'normal':
                        mean = 0.2 + (d / maxDistributions) * 0.6;
                        std = 0.08 + Math.random() * 0.04;
                        break;
                    case 'exponential':
                        lambda = 2 + d * 0.5;
                        break;
                    case 'gamma':
                        alpha = 2 + d * 0.3;
                        beta = 1.5;
                        break;
                    case 'beta':
                        alpha = 2 + d * 0.2;
                        beta = 2 + (maxDistributions - d) * 0.2;
                        break;
                }

                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();

                let maxY = 0;
                const yValues = [];

                // 计算所有Y值以找到最大值进行归一化
                for (let i = 0; i < points; i++) {
                    const x = i / (points - 1);
                    let y;

                    switch (distType) {
                        case 'normal':
                            y = Math.exp(-0.5 * Math.pow((x - mean) / std, 2)) / (std * Math.sqrt(2 * Math.PI));
                            break;
                        case 'exponential':
                            y = x > 0 ? lambda * Math.exp(-lambda * x) : 0;
                            break;
                        case 'gamma':
                            y = x > 0 ? Math.pow(x, alpha - 1) * Math.exp(-x / beta) / (Math.pow(beta, alpha) * gamma(alpha)) : 0;
                            break;
                        case 'beta':
                            y = x > 0 && x < 1 ? Math.pow(x, alpha - 1) * Math.pow(1 - x, beta - 1) / betaFunction(alpha, beta) : 0;
                            break;
                    }
                    yValues.push(y);
                    maxY = Math.max(maxY, y);
                }

                // 绘制归一化的分布曲线
                for (let i = 0; i < points; i++) {
                    const x = i / (points - 1);
                    const normalizedY = yValues[i] / maxY;
                    const canvasX = padding + x * chartWidth;
                    const canvasY = height - padding - (normalizedY * chartHeight * 0.8);

                    if (i === 0) {
                        ctx.moveTo(canvasX, canvasY);
                    } else {
                        ctx.lineTo(canvasX, canvasY);
                    }
                }
                ctx.stroke();

                // 绘制分布下方的填充区域
                ctx.fillStyle = color + '20';
                ctx.beginPath();
                ctx.moveTo(padding, height - padding);
                for (let i = 0; i < points; i++) {
                    const x = i / (points - 1);
                    const normalizedY = yValues[i] / maxY;
                    const canvasX = padding + x * chartWidth;
                    const canvasY = height - padding - (normalizedY * chartHeight * 0.8);
                    ctx.lineTo(canvasX, canvasY);
                }
                ctx.lineTo(padding + chartWidth, height - padding);
                ctx.closePath();
                ctx.fill();
            }

            // 图例已移除（根据用户需求）
            // const legendLabels = [];
            // for (let d = 0; d < maxDistributions; d++) {
            //     legendLabels.push(`Series ${String.fromCharCode(65 + d)}`); // SeriesA, SeriesB, SeriesC, ...
            // }
            // drawLineChartLegendBottom(ctx, width, height, colors, maxDistributions, legendLabels);

            // 添加学术化标题
            drawChartTitle(ctx, width, '面积图 - 智核学术');
        }

        // 辅助函数：伽马函数近似
        function gamma(z) {
            return Math.sqrt(2 * Math.PI / z) * Math.pow(z / Math.E, z);
        }

        // 辅助函数：贝塔函数近似
        function betaFunction(a, b) {
            return gamma(a) * gamma(b) / gamma(a + b);
        }

        function drawRadarChart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 120;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 固定轴数为8，数据集数量根据颜色数量动态调整
            const axes = 8; // 固定8个轴
            const maxDatasets = Math.min(colors.length, 16);
            const datasets = Math.max(1, maxDatasets); // 数据集数量跟随颜色数量

            // 绘制雷达图网格（同心圆）
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;

            for (let i = 1; i <= 5; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * i / 5, 0, 2 * Math.PI);
                ctx.stroke();

                // 添加网格标签
                ctx.fillStyle = '#666666';
                ctx.font = '10px "Times New Roman", serif';
                ctx.textAlign = 'center';
                ctx.fillText((i * 20).toString(), centerX + radius * i / 5 + 10, centerY - 5);
            }

            // 绘制轴线和标签
            const axisLabels = [
                'Performance', 'Efficiency', 'Accuracy', 'Reliability', 'Scalability',
                'Security', 'Usability', 'Maintainability', 'Flexibility', 'Innovation',
                'Quality', 'Speed'
            ];

            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;

            for (let i = 0; i < axes; i++) {
                const angle = (i * 2 * Math.PI) / axes - Math.PI / 2;
                const endX = centerX + Math.cos(angle) * radius;
                const endY = centerY + Math.sin(angle) * radius;

                // 绘制轴线
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // 绘制轴标签
                const labelX = centerX + Math.cos(angle) * (radius + 25);
                const labelY = centerY + Math.sin(angle) * (radius + 25);

                ctx.fillStyle = '#333333';
                ctx.font = '11px "Times New Roman", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 根据角度调整文本对齐
                if (Math.cos(angle) < -0.1) {
                    ctx.textAlign = 'right';
                } else if (Math.cos(angle) > 0.1) {
                    ctx.textAlign = 'left';
                }

                ctx.fillText(axisLabels[i % axisLabels.length], labelX, labelY);
            }

            // 绘制数据集
            const legendData = [];
            for (let d = 0; d < datasets; d++) {
                const color = colors[d % colors.length];

                // 生成科学化的数据（基于不同的性能模式）
                const data = [];
                const basePattern = d; // 不同数据集有不同的基础模式

                for (let i = 0; i < axes; i++) {
                    let value;
                    switch (basePattern % 3) {
                        case 0: // 高性能模式
                            value = 0.6 + 0.3 * Math.sin(i * Math.PI / axes) + 0.1 * Math.random();
                            break;
                        case 1: // 平衡模式
                            value = 0.5 + 0.2 * Math.cos(i * Math.PI / axes) + 0.15 * Math.random();
                            break;
                        case 2: // 特化模式
                            value = 0.4 + 0.4 * (i % 2) + 0.1 * Math.random();
                            break;
                    }
                    data.push(Math.min(1, Math.max(0.1, value)));
                }

                // 绘制数据区域（填充）
                ctx.fillStyle = color + '25';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                for (let i = 0; i < axes; i++) {
                    const angle = (i * 2 * Math.PI) / axes - Math.PI / 2;
                    const x = centerX + Math.cos(angle) * radius * data[i];
                    const y = centerY + Math.sin(angle) * radius * data[i];

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 绘制数据点
                ctx.fillStyle = color;
                for (let i = 0; i < axes; i++) {
                    const angle = (i * 2 * Math.PI) / axes - Math.PI / 2;
                    const x = centerX + Math.cos(angle) * radius * data[i];
                    const y = centerY + Math.sin(angle) * radius * data[i];

                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, 2 * Math.PI);
                    ctx.fill();

                    // 白色边框
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                legendData.push(String.fromCharCode(65 + d)); // A, B, C, ...
            }

            // 绘制图例（Nature风格：外部右侧）
            drawLegend(ctx, width, height, colors.slice(0, datasets), legendData, 'outside-right');

            // 添加学术化标题
            drawChartTitle(ctx, width, '雷达图 - 智核学术');
        }

        function drawViolinPlot(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 为小提琴图增加额外的垂直留白
            const violinPadding = chartHeight * 0.1; // 上下各留10%的空间
            const violinHeight = chartHeight - 2 * violinPadding;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态调整组数，支持更多颜色
            const maxGroups = Math.min(colors.length, 16);
            const groups = Math.max(2, maxGroups);

            // 绘制学术化网格和坐标轴
            drawAcademicGrid(ctx, width, height, padding);
            drawAxisLabels(ctx, width, height, padding, 'Group Categories', 'Distribution Density');

            // 生成科学化的小提琴图数据
            const violinData = [];
            const groupLabels = [
                'Control', 'Treatment A', 'Treatment B', 'Treatment C', 'Treatment D',
                'Condition E', 'Condition F', 'Condition G', 'Condition H', 'Condition I'
            ];

            for (let i = 0; i < groups; i++) {
                // 为每个组生成不同的分布特征
                const distributionType = i % 4;
                const data = [];

                // 生成200个数据点用于密度估计
                for (let j = 0; j < 200; j++) {
                    let value;
                    switch (distributionType) {
                        case 0: // 正态分布
                            value = 0.5 + 0.15 * (Math.random() + Math.random() - 1);
                            break;
                        case 1: // 双峰分布
                            value = Math.random() < 0.5 ?
                                0.3 + 0.1 * Math.random() :
                                0.7 + 0.1 * Math.random();
                            break;
                        case 2: // 偏态分布
                            value = Math.pow(Math.random(), 1.5) * 0.8 + 0.1;
                            break;
                        case 3: // 均匀分布
                            value = 0.2 + 0.6 * Math.random();
                            break;
                    }
                    data.push(Math.min(1, Math.max(0, value)));
                }
                violinData.push(data);
            }

            // 绘制小提琴图
            const legendData = [];
            for (let i = 0; i < groups; i++) {
                const x = padding + (i + 0.5) * chartWidth / groups;
                const violinWidth = Math.min(chartWidth / groups * 0.7, 60);
                const color = colors[i % colors.length];

                // 计算核密度估计
                const densityPoints = 100;
                const densities = [];

                for (let j = 0; j < densityPoints; j++) {
                    const y = j / (densityPoints - 1);
                    let density = 0;
                    const bandwidth = 0.05;

                    // 高斯核密度估计
                    for (const dataPoint of violinData[i]) {
                        const diff = (y - dataPoint) / bandwidth;
                        density += Math.exp(-0.5 * diff * diff);
                    }
                    density = density / (violinData[i].length * bandwidth * Math.sqrt(2 * Math.PI));
                    densities.push(density);
                }

                // 标准化密度值
                const maxDensity = Math.max(...densities);
                const normalizedDensities = densities.map(d => d / maxDensity);

                // 绘制小提琴形状（填充）
                ctx.fillStyle = color + '40';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                // 右半边
                for (let j = 0; j < densityPoints; j++) {
                    const y = padding + violinPadding + j * violinHeight / (densityPoints - 1);
                    const width = normalizedDensities[j] * violinWidth / 2;

                    if (j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x + width, y);
                    }
                }

                // 左半边
                for (let j = densityPoints - 1; j >= 0; j--) {
                    const y = padding + violinPadding + j * violinHeight / (densityPoints - 1);
                    const width = normalizedDensities[j] * violinWidth / 2;
                    ctx.lineTo(x - width, y);
                }

                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 计算并绘制统计线
                const sortedData = violinData[i].sort((a, b) => a - b);
                const q1 = sortedData[Math.floor(sortedData.length * 0.25)];
                const median = sortedData[Math.floor(sortedData.length * 0.5)];
                const q3 = sortedData[Math.floor(sortedData.length * 0.75)];

                // 绘制四分位数线
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 2;

                // 中位数线（粗线）
                const medianY = padding + violinPadding + (1 - median) * violinHeight;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x - violinWidth / 6, medianY);
                ctx.lineTo(x + violinWidth / 6, medianY);
                ctx.stroke();

                // 四分位数线（细线）
                ctx.lineWidth = 1.5;
                const q1Y = padding + violinPadding + (1 - q1) * violinHeight;
                const q3Y = padding + violinPadding + (1 - q3) * violinHeight;

                ctx.beginPath();
                ctx.moveTo(x - violinWidth / 8, q1Y);
                ctx.lineTo(x + violinWidth / 8, q1Y);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x - violinWidth / 8, q3Y);
                ctx.lineTo(x + violinWidth / 8, q3Y);
                ctx.stroke();

                // 绘制中心线
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, q1Y);
                ctx.lineTo(x, q3Y);
                ctx.stroke();

                legendData.push(`Series ${String.fromCharCode(65 + i)}`); // SeriesA, SeriesB, SeriesC, ...
            }

            // 绘制X轴标签
            ctx.fillStyle = '#333333';
            ctx.font = '10px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = 0; i < groups; i++) {
                const x = padding + (i + 0.5) * chartWidth / groups;
                ctx.fillText(legendData[i], x, height - padding + 10);
            }

            // 绘制Y轴刻度和标签
            for (let i = 0; i <= 5; i++) {
                const y = padding + i * chartHeight / 5;
                const value = (1 - i / 5).toFixed(1);

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 标签
                ctx.fillStyle = '#666666';
                ctx.font = '9px "Times New Roman", serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(value, padding - 8, y);
            }

            // 小提琴图不需要图例，图例信息已在X轴标签中显示

            // 添加学术化标题
            drawChartTitle(ctx, width, '小提琴图 - 智核学术');
        }

        function drawScatterPlot(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 85;  // 优化边距：确保充足的标签空间
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清空画布并设置白色背景
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 动态调整组数和数据点数量，支持更多颜色
            const maxGroups = Math.min(colors.length, 16);
            const groups = Math.max(2, maxGroups);
            const pointsPerGroup = Math.max(20, Math.min(50, 300 / groups)); // 根据组数调整点数

            // 绘制学术化网格和坐标轴
            drawAcademicGrid(ctx, width, height, padding);
            drawAxisLabels(ctx, width, height, padding, 'Independent Variable (X)', 'Dependent Variable (Y)');

            // 生成科学化的散点数据
            const scatterData = [];
            const groupLabels = [
                'Control Group', 'Treatment A', 'Treatment B', 'Treatment C', 'Treatment D',
                'Condition E', 'Condition F', 'Condition G', 'Condition H', 'Condition I',
                'Sample J', 'Sample K'
            ];

            for (let g = 0; g < groups; g++) {
                const groupData = [];
                const color = colors[g % colors.length];

                // 为每个组生成不同的相关性模式
                const correlationType = g % 5;
                const baseX = 0.1 + (g / (groups - 1)) * 0.8; // 分布在X轴上
                const baseY = 0.3 + Math.random() * 0.4; // Y轴基准位置

                for (let i = 0; i < pointsPerGroup; i++) {
                    let x, y;

                    switch (correlationType) {
                        case 0: // 正相关
                            x = baseX + (Math.random() - 0.5) * 0.15;
                            y = baseY + 0.3 * (x - baseX) + (Math.random() - 0.5) * 0.1;
                            break;
                        case 1: // 负相关
                            x = baseX + (Math.random() - 0.5) * 0.15;
                            y = baseY - 0.3 * (x - baseX) + (Math.random() - 0.5) * 0.1;
                            break;
                        case 2: // 二次关系
                            x = baseX + (Math.random() - 0.5) * 0.2;
                            const dx = x - baseX;
                            y = baseY + 2 * dx * dx + (Math.random() - 0.5) * 0.08;
                            break;
                        case 3: // 聚类模式
                            const angle = Math.random() * 2 * Math.PI;
                            const radius = Math.random() * 0.08;
                            x = baseX + Math.cos(angle) * radius;
                            y = baseY + Math.sin(angle) * radius;
                            break;
                        case 4: // 随机分布
                            x = baseX + (Math.random() - 0.5) * 0.2;
                            y = 0.2 + Math.random() * 0.6;
                            break;
                    }

                    // 确保点在图表范围内
                    x = Math.min(0.95, Math.max(0.05, x));
                    y = Math.min(0.95, Math.max(0.05, y));

                    groupData.push({ x, y, color });
                }

                scatterData.push({
                    data: groupData,
                    color: color,
                    label: groupLabels[g % groupLabels.length]
                });
            }

            // 绘制散点
            const legendData = [];
            for (let g = 0; g < groups; g++) {
                const group = scatterData[g];
                const color = group.color;

                // 绘制数据点
                ctx.fillStyle = color + 'CC'; // 半透明
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;

                for (const point of group.data) {
                    const x = padding + point.x * chartWidth;
                    const y = height - padding - point.y * chartHeight;

                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();
                }

                // 计算并绘制趋势线（简单线性回归）
                if (group.data.length > 3) {
                    const n = group.data.length;
                    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;

                    for (const point of group.data) {
                        sumX += point.x;
                        sumY += point.y;
                        sumXY += point.x * point.y;
                        sumXX += point.x * point.x;
                    }

                    const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                    const intercept = (sumY - slope * sumX) / n;

                    // 绘制趋势线
                    if (!isNaN(slope) && !isNaN(intercept)) {
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([5, 5]);

                        const x1 = 0.05;
                        const x2 = 0.95;
                        const y1 = slope * x1 + intercept;
                        const y2 = slope * x2 + intercept;

                        if (y1 >= 0 && y1 <= 1 && y2 >= 0 && y2 <= 1) {
                            ctx.beginPath();
                            ctx.moveTo(padding + x1 * chartWidth, height - padding - y1 * chartHeight);
                            ctx.lineTo(padding + x2 * chartWidth, height - padding - y2 * chartHeight);
                            ctx.stroke();
                        }

                        ctx.setLineDash([]);
                    }
                }

                legendData.push(`Series ${String.fromCharCode(65 + g)}`); // SeriesA, SeriesB, SeriesC, ...
            }

        // 等高线图绘制函数
        function drawContourPlot(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 100;
            const chartWidth = width - 2 * padding;
            const chartHeight = height - 2 * padding;

            // 清空画布
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 根据配色数量动态调整等高线数量
            const contourLevels = Math.min(colors.length, 16);
            const resolution = 80; // 网格分辨率

            // 生成随机种子，确保每次数据不同
            const seed = Math.random() * 10;
            const offset1 = Math.random() * 2 - 1;
            const offset2 = Math.random() * 2 - 1;
            const frequency = 1 + Math.random() * 2;

            // 生成二维函数数据（模拟科学数据，每次都不同）
            const data = [];
            for (let i = 0; i <= resolution; i++) {
                data[i] = [];
                for (let j = 0; j <= resolution; j++) {
                    const x = (i / resolution) * 4 - 2; // -2 到 2
                    const y = (j / resolution) * 4 - 2; // -2 到 2

                    // 复杂的二维函数：高斯分布 + 波动（加入随机性）
                    const z = Math.exp(-((x - offset1) * (x - offset1) + (y - offset2) * (y - offset2)) / 2) *
                        Math.cos(frequency * Math.PI * Math.sqrt(x * x + y * y) + seed) +
                        0.3 * Math.exp(-((x - offset2) * (x - offset2) + (y - offset1) * (y - offset1)) / 0.5) +
                        0.2 * Math.sin(frequency * x + seed) * Math.cos(frequency * y + seed);
                    data[i][j] = z;
                }
            }

            // 找到数据的最小值和最大值
            let minZ = Infinity, maxZ = -Infinity;
            for (let i = 0; i <= resolution; i++) {
                for (let j = 0; j <= resolution; j++) {
                    minZ = Math.min(minZ, data[i][j]);
                    maxZ = Math.max(maxZ, data[i][j]);
                }
            }

            // 绘制专业网格系统
            drawAcademicGrid(ctx, width, height, padding);

            // 计算等高线级别
            const levels = [];
            for (let i = 0; i < contourLevels; i++) {
                levels.push(minZ + (maxZ - minZ) * i / (contourLevels - 1));
            }

            // 绘制等高线
            ctx.lineWidth = 1.5;
            for (let levelIndex = 0; levelIndex < levels.length; levelIndex++) {
                const level = levels[levelIndex];
                const color = colors[levelIndex % colors.length];
                ctx.strokeStyle = color;

                // 使用 marching squares 算法绘制等高线
                for (let i = 0; i < resolution; i++) {
                    for (let j = 0; j < resolution; j++) {
                        const x1 = padding + (i / resolution) * chartWidth;
                        const y1 = padding + (j / resolution) * chartHeight;
                        const x2 = padding + ((i + 1) / resolution) * chartWidth;
                        const y2 = padding + ((j + 1) / resolution) * chartHeight;

                        // 获取四个角的值
                        const v1 = data[i][j];
                        const v2 = data[i + 1] ? data[i + 1][j] : v1;
                        const v3 = data[i + 1] && data[i + 1][j + 1] ? data[i + 1][j + 1] : v1;
                        const v4 = data[i][j + 1] ? data[i][j + 1] : v1;

                        // 简化的等高线绘制
                        if ((v1 <= level && v2 > level) || (v1 > level && v2 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(x1 + (x2 - x1) * (level - v1) / (v2 - v1), y1);
                            ctx.lineTo(x1 + (x2 - x1) * (level - v1) / (v2 - v1), y1 + 2);
                            ctx.stroke();
                        }

                        if ((v2 <= level && v3 > level) || (v2 > level && v3 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(x2, y1 + (y2 - y1) * (level - v2) / (v3 - v2));
                            ctx.lineTo(x2 + 2, y1 + (y2 - y1) * (level - v2) / (v3 - v2));
                            ctx.stroke();
                        }

                        if ((v3 <= level && v4 > level) || (v3 > level && v4 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(x1 + (x2 - x1) * (level - v4) / (v3 - v4), y2);
                            ctx.lineTo(x1 + (x2 - x1) * (level - v4) / (v3 - v4), y2 + 2);
                            ctx.stroke();
                        }

                        if ((v4 <= level && v1 > level) || (v4 > level && v1 <= level)) {
                            ctx.beginPath();
                            ctx.moveTo(x1, y1 + (y2 - y1) * (level - v1) / (v4 - v1));
                            ctx.lineTo(x1 + 2, y1 + (y2 - y1) * (level - v1) / (v4 - v1));
                            ctx.stroke();
                        }
                    }
                }
            }

            // 绘制更精细的等高线（使用更复杂的算法）
            for (let levelIndex = 0; levelIndex < levels.length; levelIndex++) {
                const level = levels[levelIndex];
                const color = colors[levelIndex % colors.length];
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.2;

                // 绘制连续的等高线
                for (let i = 0; i < resolution - 1; i++) {
                    for (let j = 0; j < resolution - 1; j++) {
                        const points = [];

                        // 检查网格边界上的交点
                        const v00 = data[i][j];
                        const v10 = data[i + 1][j];
                        const v11 = data[i + 1][j + 1];
                        const v01 = data[i][j + 1];

                        // 左边界
                        if ((v00 <= level && v01 > level) || (v00 > level && v01 <= level)) {
                            const t = (level - v00) / (v01 - v00);
                            points.push({
                                x: padding + (i / resolution) * chartWidth,
                                y: padding + ((j + t) / resolution) * chartHeight
                            });
                        }

                        // 下边界
                        if ((v00 <= level && v10 > level) || (v00 > level && v10 <= level)) {
                            const t = (level - v00) / (v10 - v00);
                            points.push({
                                x: padding + ((i + t) / resolution) * chartWidth,
                                y: padding + (j / resolution) * chartHeight
                            });
                        }

                        // 右边界
                        if ((v10 <= level && v11 > level) || (v10 > level && v11 <= level)) {
                            const t = (level - v10) / (v11 - v10);
                            points.push({
                                x: padding + ((i + 1) / resolution) * chartWidth,
                                y: padding + ((j + t) / resolution) * chartHeight
                            });
                        }

                        // 上边界
                        if ((v01 <= level && v11 > level) || (v01 > level && v11 <= level)) {
                            const t = (level - v01) / (v11 - v01);
                            points.push({
                                x: padding + ((i + t) / resolution) * chartWidth,
                                y: padding + ((j + 1) / resolution) * chartHeight
                            });
                        }

                        // 连接交点
                        if (points.length >= 2) {
                            ctx.beginPath();
                            ctx.moveTo(points[0].x, points[0].y);
                            for (let k = 1; k < points.length; k++) {
                                ctx.lineTo(points[k].x, points[k].y);
                            }
                            ctx.stroke();
                        }
                    }
                }
            }

            // 绘制坐标轴标签
            drawAxisLabels(ctx, width, height, padding, 'Spatial Coordinate (X)', 'Spatial Coordinate (Y)');

            // 添加X轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = 0; i <= 10; i++) {
                const x = padding + i * chartWidth / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x, height - padding);
                ctx.lineTo(x, height - padding + 5);
                ctx.stroke();

                // 标签
                ctx.fillText(value, x, height - padding + 8);
            }

            // 添加Y轴刻度
            ctx.fillStyle = '#666666';
            ctx.font = '9px "Times New Roman", serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            for (let i = 0; i <= 10; i++) {
                const y = height - padding - i * chartHeight / 10;
                const value = (i * 10).toString();

                // 刻度线
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(padding - 5, y);
                ctx.lineTo(padding, y);
                ctx.stroke();

                // 标签
                ctx.fillText(value, padding - 8, y);
            }

            // 绘制颜色条（Color Bar）
            drawColorBar(ctx, width, height, colors, levels, minZ, maxZ);

            // 绘制图表标题
            drawChartTitle(ctx, width, '等高线图 - 智核学术');

            // 等高线图不需要图例，直接返回
        }

        // 添加下载色卡功能
        const downloadColorCardBtn = document.getElementById('downloadColorCard');
        if (downloadColorCardBtn) {
            downloadColorCardBtn.addEventListener('click', function () {
                try {
                    // 获取当前配色方案
                    const colors = currentPalette.length > 0 ? currentPalette : ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6'];
                    const colorCount = colors.length;

                    // 创建色卡画布
                    const colorCardCanvas = document.createElement('canvas');
                    const ctx = colorCardCanvas.getContext('2d');

                    // 根据颜色数量确定布局
                    let rows, cols, colorSize, spacing, margin;

                    if (colorCount <= 7) {
                        // ≤7个颜色：单行布局
                        rows = 1;
                        cols = colorCount;
                        colorSize = 100;
                        spacing = 20;
                        margin = 40;
                    } else if (colorCount >= 8 && colorCount <= 13) {
                        // 8-13个颜色：2行布局（均匀分布，奇数时第一行多一个）
                        rows = 2;
                        cols = Math.ceil(colorCount / 2);
                        colorSize = 90;
                        spacing = 15;
                        margin = 30;
                    } else if (colorCount === 15) {
                        // 15个颜色：3行，每行5个
                        rows = 3;
                        cols = 5;
                        colorSize = 80;
                        spacing = 15;
                        margin = 30;
                    } else if (colorCount === 16) {
                        // 16个颜色：4行，每行4个
                        rows = 4;
                        cols = 4;
                        colorSize = 80;
                        spacing = 15;
                        margin = 30;
                    } else {
                        // >16个颜色：自适应布局
                        rows = Math.ceil(Math.sqrt(colorCount));
                        cols = Math.ceil(colorCount / rows);
                        colorSize = Math.max(60, 800 / cols - 10);
                        spacing = 10;
                        margin = 20;
                    }

                    // 计算画布尺寸
                    const cardWidth = cols * (colorSize + spacing) - spacing + 2 * margin;
                    const cardHeight = rows * (colorSize + spacing + 30) - spacing + 2 * margin; // +30用于颜色代码

                    colorCardCanvas.width = cardWidth;
                    colorCardCanvas.height = cardHeight;

                    // 设置纯白色背景
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, cardWidth, cardHeight);

                    // 绘制颜色方块
                    let colorIndex = 0;
                    for (let row = 0; row < rows && colorIndex < colorCount; row++) {
                        // 计算当前行的颜色数量（处理奇数情况）
                        let colorsInThisRow = cols;
                        if (colorCount >= 8 && colorCount <= 13 && row === rows - 1) {
                            // 对于8-13个颜色，最后一行可能少于第一行
                            colorsInThisRow = colorCount - (row * cols);
                        } else if (colorIndex + cols > colorCount) {
                            colorsInThisRow = colorCount - colorIndex;
                        }

                        // 计算当前行的总宽度和起始位置（居中）
                        const rowWidth = colorsInThisRow * colorSize + (colorsInThisRow - 1) * spacing;
                        const startX = (cardWidth - rowWidth) / 2;
                        const y = margin + row * (colorSize + spacing + 30);

                        for (let col = 0; col < colorsInThisRow && colorIndex < colorCount; col++) {
                            const x = startX + col * (colorSize + spacing);
                            const color = colors[colorIndex];

                            // 绘制颜色方块（圆角矩形）
                            const radius = Math.max(5, colorSize / 12); // 根据大小调整圆角
                            ctx.fillStyle = color;
                            roundRect(ctx, x, y, colorSize, colorSize, radius);
                            ctx.fill();

                            // 添加颜色代码（下方居中）
                            ctx.fillStyle = '#333333';
                            ctx.font = `${Math.max(12, colorSize / 6)}px "Segoe UI", Arial, sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'top';
                            ctx.fillText(color.toUpperCase(), x + colorSize / 2, y + colorSize + 8);

                            colorIndex++;
                        }
                    }

                    // 下载色卡
                    const link = document.createElement('a');
                    link.download = `color-palette-${Date.now()}.png`;
                    link.href = colorCardCanvas.toDataURL('image/png');
                    link.click();

                    showToast('色卡已下载');
                } catch (error) {
                    console.error('下载色卡失败:', error);
                    showToast('下载色卡失败，请重试');
                }
            });
        }

        // 辅助函数：绘制圆角矩形
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // 辅助函数：动态加载gif.js库

                }

                console.log('loadGifJs: 开始加载gif.js库');

                    'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js',

                    'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js'
                ];

                let currentUrlIndex = 0;

                function tryLoadScript() {
                    if (currentUrlIndex >= cdnUrls.length) {
                        reject(new Error('所有gif.js CDN源都加载失败'));
                        return;
                    }

                    const script = document.createElement('script');
                    const cdnUrl = cdnUrls[currentUrlIndex];
                    console.log(`loadGifJs: 尝试加载CDN ${currentUrlIndex + 1}/${cdnUrls.length}: ${cdnUrl}`);

                    script.src = cdnUrl;

                    script.onload = () => {
                        console.log(`loadGifJs: CDN ${currentUrlIndex + 1} 加载完成，检查GIF对象:`, typeof window.GIF);
                        if (window.GIF) {
                            resolve();
                        } else {

                            tryLoadScript();
                        }
                    };

                    script.onerror = () => {
                        console.error(`loadGifJs: CDN ${currentUrlIndex + 1} 加载失败`);
                        currentUrlIndex++;
                        tryLoadScript();

        // 创建GIF动画函数
        async function createGIFAnimation(images, frameDelay = 1000) {
            try {
                console.log('createGIFAnimation: 开始创建GIF，参数:', { imagesCount: images.length, frameDelay });

                // 动态加载gif.js库
                await loadGifJs();

                const GIF = window.GIF;
                console.log('createGIFAnimation: GIF构造函数:', typeof GIF);

                const gif = new GIF({
                    quality: 10,
                    width: 1000,
                    height: 500,
                    repeat: 0, // 无限循环
                    workerScript: 'gif.worker.js'
                });

                console.log('createGIFAnimation: GIF对象创建成功');

                // 为每个图表创建帧
                console.log('createGIFAnimation: 开始处理帧，数量:', images.length);
                for (let i = 0; i < images.length; i++) {
                    const image = images[i];
                    console.log(`createGIFAnimation: 处理第${i + 1}帧:`, image.nameCN);

                    // 创建临时canvas来绘制带标签的图表
                    const frameCanvas = document.createElement('canvas');
                    frameCanvas.width = 1000;
                    frameCanvas.height = 500;
                    const frameCtx = frameCanvas.getContext('2d');

                    // 绘制白色背景
                    frameCtx.fillStyle = '#ffffff';
                    frameCtx.fillRect(0, 0, 1000, 500);

                    // 绘制图表图像
                    const img = new Image();
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = image.dataURL;
                    });

                    frameCtx.drawImage(img, 0, 0, 1000, 500);

                    // 不添加标题和底部提示，保持图表纯净

                    // 添加到GIF
                    gif.addFrame(frameCanvas, { delay: frameDelay });
                    console.log(`createGIFAnimation: 第${i + 1}帧添加完成`);
                }
                console.log('createGIFAnimation: 所有帧处理完成，开始渲染GIF');

                // 返回Promise，当GIF生成完成时resolve
                return new Promise((resolve, reject) => {
                    console.log('createGIFAnimation: 设置GIF事件监听器');

                    gif.on('finished', function (blob) {
                        console.log('createGIFAnimation: GIF渲染完成，大小:', blob.size);
                        resolve(blob);
                    });

                    gif.on('error', function (error) {
                        console.error('createGIFAnimation: GIF渲染失败:', error);
                        reject(error);
                    });

                    gif.on('progress', function (p) {
                        console.log('createGIFAnimation: GIF渲染进度:', Math.round(p * 100) + '%');
                    });

                    console.log('createGIFAnimation: 开始渲染GIF');
                    gif.render();
                });

            } catch (error) {
                console.error('创建GIF动画失败:', error);
                throw error;
            }
        }

        // 饼图绘制函数
        function drawPieChart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            // 清空画布
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 根据配色数量动态调整扇形数量
            const segments = Math.min(colors.length, 16); // 最多16个扇形
            const data = [];
            const labels = [];

            // 生成科学数据（模拟实验结果分布）
            let total = 0;
            for (let i = 0; i < segments; i++) {
                // 模拟不同类别的占比，使用更真实的分布
                const baseValue = 0.5 + 0.4 * Math.sin(i * Math.PI / segments);
                const randomFactor = 0.3 + 0.7 * Math.random();
                const value = baseValue * randomFactor;
                data.push(value);
                total += value;
                labels.push(`Series ${String.fromCharCode(65 + i)}`); // A, B, C, ...
            }

            // 标准化数据，确保总和为100%
            for (let i = 0; i < data.length; i++) {
                data[i] = data[i] / total;
            }

            // 根据扇形数量选择不同的绘制风格
            const isSimpleStyle = segments <= 8;
            const radius = isSimpleStyle ? Math.min(width, height) / 2 - 85 : Math.min(width, height) / 2 - 120;
            const padding = isSimpleStyle ? 85 : 120;

            // 绘制饼图扇形
            let currentAngle = -Math.PI / 2; // 从12点方向开始

            for (let i = 0; i < segments; i++) {
                const sliceAngle = data[i] * 2 * Math.PI;
                const color = colors[i % colors.length];

                // 绘制扇形
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
                ctx.closePath();
                ctx.fill();

                // 绘制扇形边框（学术风格）
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (isSimpleStyle) {
                    // 简单风格：在扇形内显示百分比
                    const labelAngle = currentAngle + sliceAngle / 2;
                    const labelRadius = radius * 0.7;
                    const labelX = centerX + Math.cos(labelAngle) * labelRadius;
                    const labelY = centerY + Math.sin(labelAngle) * labelRadius;

                    // 绘制百分比标签
                    const percentage = (data[i] * 100).toFixed(1);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px "Times New Roman", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // 添加文字阴影效果
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 2;
                    ctx.fillText(`${percentage}%`, labelX, labelY);
                    ctx.shadowBlur = 0;
                } else {
                    // 科研风格：使用线条指向的标签
                    const labelAngle = currentAngle + sliceAngle / 2;
                    const labelRadius = radius + 30;
                    const labelX = centerX + Math.cos(labelAngle) * labelRadius;
                    const labelY = centerY + Math.sin(labelAngle) * labelRadius;

                    // 绘制指向线条
                    const lineStartX = centerX + Math.cos(labelAngle) * (radius + 5);
                    const lineStartY = centerY + Math.sin(labelAngle) * (radius + 5);
                    const lineEndX = centerX + Math.cos(labelAngle) * (radius + 25);
                    const lineEndY = centerY + Math.sin(labelAngle) * (radius + 25);

                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(lineStartX, lineStartY);
                    ctx.lineTo(lineEndX, lineEndY);
                    ctx.stroke();

                    // 绘制水平延长线
                    const finalLabelX = labelX + (labelAngle > Math.PI / 2 && labelAngle < 3 * Math.PI / 2 ? -80 : 20);
                    ctx.beginPath();
                    ctx.moveTo(lineEndX, lineEndY);
                    ctx.lineTo(finalLabelX, lineEndY);
                    ctx.stroke();

                    // 绘制标签 - 增强可读性和防重叠
                    const percentage = (data[i] * 100).toFixed(1);
                    ctx.fillStyle = '#2c3e50';
                    ctx.font = 'bold 11px "Times New Roman", serif';
                    ctx.textAlign = labelAngle > Math.PI / 2 && labelAngle < 3 * Math.PI / 2 ? 'right' : 'left';
                    ctx.textBaseline = 'middle';

                    // 添加文字阴影增强可读性
                    ctx.shadowColor = 'rgba(255,255,255,0.8)';
                    ctx.shadowBlur = 2;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    // 确保标签不会重叠 - 调整Y位置
                    let adjustedY = lineEndY;
                    if (i > 0) {
                        // 计算前一个扇形的角度位置
                        let prevAngle = -Math.PI / 2; // 从12点方向开始
                        for (let j = 0; j < i - 1; j++) {
                            prevAngle += data[j] * 2 * Math.PI;
                        }
                        prevAngle += data[i - 1] * Math.PI; // 前一个扇形的中点
                        const prevY = centerY + (radius + 30) * Math.sin(prevAngle);
                        if (Math.abs(adjustedY - prevY) < 20) {
                            adjustedY = prevY + (adjustedY > prevY ? 20 : -20);
                        }
                    }

                    ctx.fillText(`${labels[i]}: ${percentage}%`, finalLabelX, adjustedY);

                    // 重置阴影
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                }

                currentAngle += sliceAngle;
            }

            if (isSimpleStyle) {
                // 简单风格：绘制右侧图例
                const legendX = width - 150;
                const legendY = 100;
                const legendItemHeight = 25;

                ctx.font = '12px "Times New Roman", serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                for (let i = 0; i < segments; i++) {
                    const y = legendY + i * legendItemHeight;
                    const color = colors[i % colors.length];

                    // 绘制图例色块
                    ctx.fillStyle = color;
                    ctx.fillRect(legendX, y - 8, 16, 16);
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(legendX, y - 8, 16, 16);

                    // 绘制图例文字
                    ctx.fillStyle = '#333333';
                    const percentage = (data[i] * 100).toFixed(1);
                    ctx.fillText(`${labels[i]} (${percentage}%)`, legendX + 25, y);
                }
            }

            // 添加图表标题
            drawChartTitle(ctx, width, '饼图 - 智核学术');
        }

        // ========== 高级科研图表函数 (Advanced Research Charts) ==========

        function drawFlowchart(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 80; // 增加边距

            // 颜色鲁棒性检查
            if (!colors || colors.length === 0) {
                colors = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#34495e', '#e67e22'];
            }

            // 清空画布并设置渐变背景
            ctx.clearRect(0, 0, width, height);
            const bgGradient = ctx.createLinearGradient(0, 0, width, height);
            bgGradient.addColorStop(0, 'rgba(240, 248, 255, 0.8)');
            bgGradient.addColorStop(1, 'rgba(230, 240, 250, 0.8)');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 动态配色适应：确保所有颜色都能被使用
            const colorCount = colors.length;
            const nodeColorMapping = (index) => colors[index % colorCount];
            const connectionColorMapping = (index) => colors[(index + Math.floor(colorCount / 2)) % colorCount];

            // 动态定义节点 - 根据颜色数量调整节点数量和分布
            let nodes = [];
            if (colorCount >= 10) {
                // 超丰富流程图 - 完整学术研究流程

                        ctx.stroke();

            // 辅助函数：调整颜色亮度
            function adjustBrightness(color, amount) {
                const hex = color.replace('#', '');
                const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount * 255));
                const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount * 255));
                const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount * 255));
                return `#${Math.round(r).toString(16).padStart(2, '0')}${Math.round(g).toString(16).padStart(2, '0')}${Math.round(b).toString(16).padStart(2, '0')}`;

        function drawRoadmap(ctx, width, height, colors) {

                phases = [

            // 绘制主时间轴（带渐变效果）- 根据布局调整
            let timelineY;
            if (colorCount >= 10) {
                // 多行布局时绘制两条时间轴
                const timelineY1 = height * 0.15;
                const timelineY2 = height * 0.55;

                // 第一条时间轴
                const gradient1 = ctx.createLinearGradient(padding, timelineY1, width - padding, timelineY1);
                for (let i = 0; i < 5; i++) {
                    gradient1.addColorStop(i / 4, phaseColorMapping(i));

                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(padding + 20, timelineY1);

                const gradient2 = ctx.createLinearGradient(padding, timelineY2, width - padding, timelineY2);

                if (colorCount >= 10) {
                    targetTimelineY = index < 5 ? height * 0.15 : height * 0.55;

                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.moveTo(x, targetTimelineY);
                ctx.lineTo(x, y - phaseHeight / 2 - 10);
                ctx.stroke();

                ctx.fillStyle = phaseColor;
                ctx.beginPath();
                ctx.arc(x, targetTimelineY, 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 预计算内容高度，避免后续重绘
                const maxItemsForHeight = colorCount >= 10 ? 2 : 3;
                const itemsForHeight = phase.items.slice(0, maxItemsForHeight);
                const estimatedContentHeight = 95 + (itemsForHeight.length * 15) + (phase.items.length > maxItemsForHeight ? 15 : 0) + 30;
                const finalPhaseHeight = Math.max(phaseHeight, estimatedContentHeight);

                // 阶段卡片阴影
                ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 4;
