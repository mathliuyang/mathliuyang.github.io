                cardGradient.addColorStop(1, adjustBrightness(phaseColor, -0.2));
                ctx.fillStyle = cardGradient;

                // 绘制圆角矩形 - 使用最终高度
                const radius = 12;
                ctx.beginPath();
                ctx.roundRect(x - phaseWidth / 2, y - finalPhaseHeight / 2, phaseWidth, finalPhaseHeight, radius);
                ctx.fill();

                // 卡片边框
                ctx.strokeStyle = adjustBrightness(phaseColor, -0.3);
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                ctx.textBaseline = 'middle';

                ctx.font = 'italic 11px "Times New Roman", serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText(phase.duration, x, y - finalPhaseHeight / 2 + 65);

                // 分隔线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x - phaseWidth / 2 + 15, y - finalPhaseHeight / 2 + 75);
                ctx.lineTo(x + phaseWidth / 2 - 15, y - finalPhaseHeight / 2 + 75);
                ctx.stroke();

                ctx.font = '10px "Times New Roman", serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';

                let currentItemY = y - finalPhaseHeight / 2 + 95;
                const maxTextWidth = phaseWidth - 35;
                const lineHeight = 12; // 减小行高以节省空间
                const itemSpacing = 3; // 减小项目间距
                const maxItemsToShow = colorCount >= 10 ? 2 : 3; // 根据卡片大小限制显示项目数

                // 限制显示的任务数量，避免溢出
                const itemsToShow = phase.items.slice(0, maxItemsToShow);

                itemsToShow.forEach((item, itemIndex) => {
                    // 项目符号
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(x - phaseWidth / 2 + 18, currentItemY, 2, 0, 2 * Math.PI);
                    ctx.fill();

                    // 智能文字换行处理 - 改进算法
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'left';

                    // 首先尝试单行显示
                    if (ctx.measureText(item).width <= maxTextWidth) {
                        ctx.fillText(item, x - phaseWidth / 2 + 25, currentItemY);
                        currentItemY += lineHeight + itemSpacing;
                    } else {
                        // 需要换行处理
                        const words = item.split(' ');
                        let lines = [];
                        let currentLine = '';

                        // 按单词分割并组合成行
                        words.forEach(word => {
                            const testLine = currentLine + (currentLine ? ' ' : '') + word;
                            const testWidth = ctx.measureText(testLine).width;

                            if (testWidth <= maxTextWidth) {
                                currentLine = testLine;
                            } else {
                                if (currentLine) {
                                    lines.push(currentLine);
                                    currentLine = word;
                                } else {
                                    // 单个单词太长，需要截断
                                    let truncatedWord = word;
                                    while (ctx.measureText(truncatedWord + '...').width > maxTextWidth && truncatedWord.length > 1) {
                                        truncatedWord = truncatedWord.slice(0, -1);
                                    }
                                    lines.push(truncatedWord + (truncatedWord.length < word.length ? '...' : ''));
                                }
                            }
                        });

                        if (currentLine) {
                            lines.push(currentLine);
                        }

                        // 限制最多显示2行，避免卡片溢出
                        const maxLines = 2;
                        const linesToShow = lines.slice(0, maxLines);
                        if (lines.length > maxLines) {
                            // 如果有更多行，在最后一行末尾添加省略号
                            const lastLine = linesToShow[maxLines - 1];
                            let truncatedLastLine = lastLine;
                            while (ctx.measureText(truncatedLastLine + '...').width > maxTextWidth && truncatedLastLine.length > 1) {
                                truncatedLastLine = truncatedLastLine.slice(0, -1);
                            }
                            linesToShow[maxLines - 1] = truncatedLastLine + '...';
                        }

                        // 绘制多行文字
                        linesToShow.forEach((line, lineIndex) => {
                            ctx.fillText(line, x - phaseWidth / 2 + 25, currentItemY + lineIndex * lineHeight);
                        });

                        // 更新下一个项目的Y位置
                        currentItemY += linesToShow.length * lineHeight + itemSpacing;
                    }
                });

                // 如果有更多任务未显示，添加省略提示
                if (phase.items.length > maxItemsToShow) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.font = 'italic 9px "Times New Roman", serif';
                    ctx.fillText(`+${phase.items.length - maxItemsToShow} more...`, x - phaseWidth / 2 + 25, currentItemY);
                    currentItemY += lineHeight + itemSpacing;
                }

                // 简化进度条位置计算 - 使用预计算的最终高度
                const progressBarHeight = 6;
                const progressBottomMargin = 12;
                const progressY = y + finalPhaseHeight / 2 - progressBottomMargin - progressBarHeight / 2;
                const progressWidth = phaseWidth - 30;
                const progress = (index + 1) / phases.length;

                // 进度条背景
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(x - progressWidth / 2, progressY - progressBarHeight / 2, progressWidth, progressBarHeight);

                // 进度条填充
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - progressWidth / 2, progressY - progressBarHeight / 2, progressWidth * progress, progressBarHeight);

                // 进度条边框，增强视觉效果
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x - progressWidth / 2, progressY - progressBarHeight / 2, progressWidth, progressBarHeight);
            });

            // 绘制里程碑连接线 - 改善多行布局的连接
            if (colorCount >= 10) {
                // 多行布局：只连接同一行的相邻阶段
                // 第一行连接
                for (let i = 0; i < 4; i++) {
                    const currentPhase = phases[i];
                    const nextPhase = phases[i + 1];

                    const x1 = currentPhase.x * (width - 2 * padding) + padding + 55;
                    const y1 = currentPhase.y * (height - 2 * padding) + padding;
                    const x2 = nextPhase.x * (width - 2 * padding) + padding - 55;
                    const y2 = nextPhase.y * (height - 2 * padding) + padding;

                    ctx.strokeStyle = connectionColorMapping(i);
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 3]);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    // 箭头
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    const arrowLength = 10;

                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle - Math.PI / 6), y2 - arrowLength * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle + Math.PI / 6), y2 - arrowLength * Math.sin(angle + Math.PI / 6));
                    ctx.stroke();
                }

                // 第二行连接
                for (let i = 5; i < 9; i++) {
                    const currentPhase = phases[i];
                    const nextPhase = phases[i + 1];

                    const x1 = currentPhase.x * (width - 2 * padding) + padding + 55;
                    const y1 = currentPhase.y * (height - 2 * padding) + padding;
                    const x2 = nextPhase.x * (width - 2 * padding) + padding - 55;
                    const y2 = nextPhase.y * (height - 2 * padding) + padding;

                    ctx.strokeStyle = connectionColorMapping(i);
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 3]);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    // 箭头
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    const arrowLength = 10;

                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle - Math.PI / 6), y2 - arrowLength * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle + Math.PI / 6), y2 - arrowLength * Math.sin(angle + Math.PI / 6));
                    ctx.stroke();
                }

                // 跨行连接（从第一行最后一个到第二行第一个）
                const phase4 = phases[4];
                const phase5 = phases[5];
                const x1 = phase4.x * (width - 2 * padding) + padding;
                const y1 = phase4.y * (height - 2 * padding) + padding + 70;
                const x2 = phase5.x * (width - 2 * padding) + padding;
                const y2 = phase5.y * (height - 2 * padding) + padding - 70;

                ctx.strokeStyle = connectionColorMapping(4);
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 4]);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // 跨行箭头
                const crossAngle = Math.atan2(y2 - y1, x2 - x1);
                const crossArrowLength = 15;

                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - crossArrowLength * Math.cos(crossAngle - Math.PI / 6), y2 - crossArrowLength * Math.sin(crossAngle - Math.PI / 6));
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - crossArrowLength * Math.cos(crossAngle + Math.PI / 6), y2 - crossArrowLength * Math.sin(crossAngle + Math.PI / 6));
                ctx.stroke();
            } else {
                // 单行布局：正常连接
                for (let i = 0; i < phases.length - 1; i++) {
                    const currentPhase = phases[i];
                    const nextPhase = phases[i + 1];

                    let cardWidth = colorCount >= 6 ? 120 : 140;
                    const x1 = currentPhase.x * (width - 2 * padding) + padding + cardWidth / 2;
                    const y1 = currentPhase.y * (height - 2 * padding) + padding;
                    const x2 = nextPhase.x * (width - 2 * padding) + padding - cardWidth / 2;
                    const y2 = nextPhase.y * (height - 2 * padding) + padding;

                    ctx.strokeStyle = connectionColorMapping(i);
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 4]);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    // 箭头
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    const arrowLength = 12;

                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle - Math.PI / 6), y2 - arrowLength * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - arrowLength * Math.cos(angle + Math.PI / 6), y2 - arrowLength * Math.sin(angle + Math.PI / 6));
                    ctx.stroke();
                }
            }

            // 辅助函数：调整颜色亮度
            function adjustBrightness(color, amount) {
                const hex = color.replace('#', '');
                const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount * 255));
                const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount * 255));
                const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount * 255));
                return `#${Math.round(r).toString(16).padStart(2, '0')}${Math.round(g).toString(16).padStart(2, '0')}${Math.round(b).toString(16).padStart(2, '0')}`;
            }

            // 添加图表标题
            drawChartTitle(ctx, width, '技术路线图 - 智核学术');
        }

        function drawMindMap(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const padding = 60; // 增加边距

            // 鲁棒性检查
            if (!colors || colors.length === 0) {
                colors = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
            }

            // 动态颜色映射函数
            const branchColorMapping = (index) => colors[index % colors.length];
            const subnodeColorMapping = (branchIndex, subnodeIndex) => {
                const colorIndex = (branchIndex * 3 + subnodeIndex + 1) % colors.length;
                return colors[colorIndex];
            };

            // 设置背景渐变
            const bgGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) / 2);
            bgGradient.addColorStop(0, '#ffffff');
            bgGradient.addColorStop(1, '#f8f9fa');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 辅助函数：调整颜色亮度
            function adjustBrightness(color, factor) {
                if (!color || typeof color !== 'string') return '#3498db';
                if (color.startsWith('#')) {
                    const hex = color.slice(1);
                    const num = parseInt(hex, 16);
                    const r = Math.min(255, Math.max(0, (num >> 16) + factor));
                    const g = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + factor));
                    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + factor));
                    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
                }
                return color;
            }

            // 动态生成分支数量和内容 - 非对称布局
            const numBranches = Math.max(2, Math.min(colors.length, 12)); // 支持更多分支
            const branchTopics = [
                'Quantitative\nMethods', 'Qualitative\nMethods', 'Mixed\nMethods', 'Data\nCollection',
                'Analysis\nTechniques', 'Research\nDesign', 'Ethics &\nValidation', 'Publication\n& Sharing',
                'Literature\nReview', 'Hypothesis\nFormation', 'Sampling\nMethods', 'Statistical\nModeling'
            ];
            const subnodeTopics = [
                ['Surveys', 'Experiments', 'Statistical\nAnalysis'],
                ['Interviews', 'Focus Groups', 'Case Studies'],
                ['Sequential', 'Concurrent', 'Transformative'],
                ['Primary Data', 'Secondary Data', 'Big Data'],
                ['Descriptive', 'Inferential', 'Predictive'],
                ['Experimental', 'Observational', 'Longitudinal'],
                ['IRB Approval', 'Validity', 'Reliability'],
                ['Peer Review', 'Open Access', 'Reproducibility'],
                ['Systematic', 'Meta-Analysis', 'Scoping'],
                ['Null/Alternative', 'Directional', 'Non-directional'],
                ['Random', 'Stratified', 'Convenience'],
                ['Regression', 'Classification', 'Clustering']
            ];

            // 中心主题 - 增大中心节点，充分利用空间
            const centerRadius = Math.min(width, height) * (colors.length > 8 ? 0.12 : 0.14);
            const centerNode = {
                text: 'Research\nMethodology',
                x: centerX,
                y: centerY,
                radius: centerRadius,
                color: colors[0] || '#3498db'
            };

            // 非对称分支布局 - 根据颜色数量调整，优化防重叠
            const mainBranches = [];

            // 定义非对称角度分布 - 改进算法避免重叠
            const getAsymmetricAngles = (count) => {
                const angles = [];
                if (count <= 4) {
                    // 少量分支：使用黄金角度分布
                    const goldenAngle = Math.PI * (3 - Math.sqrt(5)); // 黄金角度
                    for (let i = 0; i < count; i++) {
                        angles.push(i * goldenAngle + Math.PI * 0.1);
                    }
                } else if (count <= 6) {
                    // 中等分支：不规则分布
                    const baseAngles = [0, Math.PI * 0.45, Math.PI * 0.85, Math.PI * 1.25, Math.PI * 1.6, Math.PI * 1.9];
                    for (let i = 0; i < count; i++) {
                        angles.push(baseAngles[i] + (Math.random() - 0.5) * 0.2);
                    }
                } else if (count <= 8) {
                    // 较多分支：螺旋分布
                    for (let i = 0; i < count; i++) {
                        const spiralFactor = 1 + i * 0.1;
                        angles.push((i * 2 * Math.PI * spiralFactor) / count + Math.PI * 0.15);
                    }
                } else {
                    // 大量分支：多层螺旋布局，增加间距
                    const innerCount = Math.ceil(count * 0.5);
                    const outerCount = count - innerCount;

                    // 内层分支 - 更大间距
                    for (let i = 0; i < innerCount; i++) {
                        const baseAngle = (i * 2 * Math.PI) / innerCount;
                        const offset = (Math.random() - 0.5) * 0.3;
                        angles.push(baseAngle + offset);
                    }
                    // 外层分支 - 错位排列，增加随机性
                    for (let i = 0; i < outerCount; i++) {
                        const baseAngle = (i * 2 * Math.PI) / outerCount + Math.PI / outerCount;
                        const offset = (Math.random() - 0.5) * 0.4;
                        angles.push(baseAngle + offset);
                    }
                }
                return angles;
            };

            const branchAngles = getAsymmetricAngles(numBranches);

            for (let i = 0; i < numBranches; i++) {
                const angle = branchAngles[i] || (i * 2 * Math.PI) / numBranches;

                // 动态距离 - 防止超出边界，增加防重叠逻辑
                let baseDistance = Math.min(width, height) * 0.22;
                if (colors.length > 8) {
                    baseDistance = Math.min(width, height) * 0.16; // 进一步缩小距离
                } else if (colors.length > 6) {
                    baseDistance = Math.min(width, height) * 0.19; // 中等缩小
                }

                // 添加层级偏移，内外层不同距离
                const isInnerLayer = i < Math.ceil(numBranches * 0.5);
                const layerOffset = isInnerLayer ? 0 : Math.min(width, height) * 0.05;

                // 减少随机偏移，提高可预测性
                const randomOffset = (Math.random() - 0.5) * 0.15; // 减小随机性
                const distance = baseDistance + layerOffset + baseDistance * randomOffset;

                // 动态调整子节点数量，避免过度拥挤
                const subnodeCount = colors.length > 10 ?
                    Math.min(2, Math.max(1, Math.floor(colors.length / Math.max(6, numBranches)))) :
                    Math.min(3, Math.max(1, Math.floor(colors.length / Math.max(4, numBranches))));

                const branch = {
                    text: branchTopics[i] || `Branch ${i + 1}`,
                    angle: angle,
                    distance: distance,
                    color: branchColorMapping(i + 1),
                    subnodes: [],
                    isInnerLayer: isInnerLayer
                };

                // 为每个分支生成子节点 - 优化防重叠分布
                for (let j = 0; j < subnodeCount; j++) {
                    // 根据颜色数量调整子节点角度分布
                    const subnodeAngleSpread = colors.length > 10 ? 0.25 :
                        colors.length > 8 ? 0.3 : 0.4;
                    const subnodeAngle = (j - (subnodeCount - 1) / 2) * subnodeAngleSpread +
                        (Math.random() - 0.5) * 0.1; // 减小随机性

                    // 动态子节点距离
                    const subnodeDistance = Math.min(width, height) *
                        (colors.length > 10 ? 0.08 : colors.length > 8 ? 0.10 : 0.12);

                    branch.subnodes.push({
                        text: subnodeTopics[i] ? subnodeTopics[i][j] || `Sub ${j + 1}` : `Sub ${j + 1}`,
                        angle: subnodeAngle,
                        distance: subnodeDistance
                    });
                }

                mainBranches.push(branch);
            }

            // 绘制从中心到主分支的连接线 - 增强视觉效果
            mainBranches.forEach((branch, index) => {
                const branchX = centerX + Math.cos(branch.angle) * branch.distance;
                const branchY = centerY + Math.sin(branch.angle) * branch.distance;

                // 边界检查
                if (branchX < padding || branchX > width - padding || branchY < padding || branchY > height - padding) {
                    return; // 跳过超出边界的分支

                lineGradient.addColorStop(0, adjustBrightness(branch.color, 30));
                lineGradient.addColorStop(1, branch.color);

                ctx.lineWidth = Math.min(width, height) * (colors.length > 8 ? 0.006 : 0.008);

                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(branchX, branchY);
                ctx.stroke();

                // 重置阴影
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // 绘制子节点连接线 - 优化样式
                branch.subnodes.forEach(subnode => {
                    const subX = branchX + Math.cos(branch.angle + subnode.angle) * subnode.distance;
                    const subY = branchY + Math.sin(branch.angle + subnode.angle) * subnode.distance;

                    // 检查边界，防止节点超出画布
                    if (subX < padding || subX > width - padding || subY < padding || subY > height - padding) {
                        return; // 跳过超出边界的节点
                    }

                    ctx.strokeStyle = adjustBrightness(branch.color, -20);
                    ctx.lineWidth = Math.min(width, height) * (colors.length > 8 ? 0.003 : 0.004);
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.moveTo(branchX, branchY);
                    ctx.lineTo(subX, subY);
                    ctx.stroke();
                });
            });

            // 绘制中心节点 - 增强设计

            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.beginPath();
            ctx.arc(centerNode.x, centerNode.y, centerNode.radius, 0, 2 * Math.PI);

            ctx.strokeStyle = adjustBrightness(centerNode.color, -40);
            ctx.lineWidth = 3;
            ctx.shadowColor = 'transparent';
            ctx.stroke();

            // 绘制中心节点文本 - 增强可读性
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.min(width, height) * 0.02}px "Times New Roman", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 2;

            const centerLines = centerNode.text.split('\n');
            const lineHeight = Math.min(width, height) * 0.022;
            centerLines.forEach((line, lineIndex) => {
                const yOffset = (lineIndex - (centerLines.length - 1) / 2) * lineHeight;
                ctx.fillText(line, centerNode.x, centerNode.y + yOffset);
            });

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;

            // 绘制主分支节点 - 优化设计
            mainBranches.forEach((branch, index) => {
                const branchX = centerX + Math.cos(branch.angle) * branch.distance;
                const branchY = centerY + Math.sin(branch.angle) * branch.distance;

                // 边界检查
                if (branchX < padding || branchX > width - padding || branchY < padding || branchY > height - padding) {
                    return; // 跳过超出边界的分支
                }

                // 动态调整分支节点大小，增大圆圈充分利用空间
                const branchRadius = Math.min(width, height) *
                    (colors.length > 12 ? 0.05 :
                        colors.length > 10 ? 0.055 :
                            colors.length > 8 ? 0.06 : 0.08);

                // 主分支节点渐变
                const branchGradient = ctx.createRadialGradient(
                    branchX, branchY - branchRadius * 0.3, 0,
                    branchX, branchY, branchRadius
                );
                branchGradient.addColorStop(0, adjustBrightness(branch.color, 30));
                branchGradient.addColorStop(1, adjustBrightness(branch.color, -15));

                ctx.fillStyle = branchGradient;
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 6;

                ctx.fillStyle = '#ffffff';

                ctx.font = `bold ${branchFontSize}px "Times New Roman", serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 1;

                const branchLines = branch.text.split('\n');
                const branchLineHeight = branchFontSize * 1.1;

                // 检查文字是否会溢出圆圈，如果溢出则缩短文字
                branchLines.forEach((line, lineIndex) => {
                    const yOffset = (lineIndex - (branchLines.length - 1) / 2) * branchLineHeight;
