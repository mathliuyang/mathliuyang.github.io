                });

                ctx.shadowColor = 'transparent';

                // 绘制子节点 - 优化布局
                branch.subnodes.forEach((subnode, subIndex) => {
                    const subX = branchX + Math.cos(branch.angle + subnode.angle) * subnode.distance;
                    const subY = branchY + Math.sin(branch.angle + subnode.angle) * subnode.distance;

                    // 边界检查
                    if (subX < padding || subX > width - padding || subY < padding || subY > height - padding) {
                        return;
                    }

                    // 动态调整子节点大小，增大圆圈充分利用空间
                    const subRadius = Math.min(width, height) *
                        (colors.length > 12 ? 0.035 :
                            colors.length > 10 ? 0.04 :
                                colors.length > 8 ? 0.045 : 0.055);
                    const subColor = subnodeColorMapping(index, subIndex);

                    // 子节点渐变
                    const subGradient = ctx.createRadialGradient(
                        subX, subY - subRadius * 0.3, 0,
                        subX, subY, subRadius
                    );
                    subGradient.addColorStop(0, adjustBrightness(subColor, 25));
                    subGradient.addColorStop(1, adjustBrightness(subColor, -10));

                    ctx.fillStyle = subGradient;
                    ctx.shadowColor = 'rgba(0,0,0,0.2)';
                    ctx.shadowBlur = 4;

                    ctx.beginPath();
                    ctx.arc(subX, subY, subRadius, 0, 2 * Math.PI);
                    ctx.fill();

                    ctx.strokeStyle = adjustBrightness(subColor, -25);
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = 'transparent';
                    ctx.stroke();

                    // 绘制子节点文本 - 自适应字体大小，防止文字溢出
                    ctx.fillStyle = '#ffffff';
                    const fontSize = Math.min(width, height) * 0.012;
                    ctx.font = `bold ${fontSize}px "Times New Roman", serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 1;

                    const subLines = subnode.text.split('\n');
                    const subLineHeight = fontSize * 1.1;

                    // 检查子节点文字是否会溢出圆圈，如果溢出则缩短文字
                    subLines.forEach((line, lineIndex) => {
                        const yOffset = (lineIndex - (subLines.length - 1) / 2) * subLineHeight;

                        // 计算文字宽度，如果超出圆圈直径则截断
                        const maxWidth = subRadius * 1.8; // 允许文字稍微超出圆圈
                        let displayText = line;

                        if (ctx.measureText(displayText).width > maxWidth) {
                            while (ctx.measureText(displayText + '...').width > maxWidth && displayText.length > 0) {
                                displayText = displayText.slice(0, -1);
                            }
                            displayText += '...';
                        }

                        ctx.fillText(displayText, subX, subY + yOffset);
                    });

                    ctx.shadowColor = 'transparent';
                });
            });

            // 添加图表标题
            drawChartTitle(ctx, width, '思维导图 - 智核学术');
        }

        function drawNetworkDiagram(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 80;

            // 鲁棒性检查
            if (!colors || colors.length === 0) {
                colors = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];
            }

            // 辅助函数：调整颜色亮度
            function adjustBrightness(color, percent) {
                const num = parseInt(color.replace("#", ""), 16);
                const amt = Math.round(2.55 * percent);
                const R = (num >> 16) + amt;
                const G = (num >> 8 & 0x00FF) + amt;
                const B = (num & 0x0000FF) + amt;
                return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                    (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                    (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
            }

            // 设置渐变背景
            const bgGradient = ctx.createLinearGradient(0, 0, width, height);
            bgGradient.addColorStop(0, '#f8f9fa');
            bgGradient.addColorStop(1, '#e9ecef');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 动态生成网络节点 - 根据颜色数量调整
            const colorCount = colors.length;
            let nodes = [];
            let edges = [];

            // 基础节点标签库
            const nodeLabels = [
                'Data\nSource', 'Processing\nUnit', 'Analysis\nEngine', 'ML\nModel',
                'Validation\nModule', 'Output\nInterface', 'Feedback\nLoop', 'Storage\nSystem',
                'Security\nLayer', 'Cache\nSystem', 'Load\nBalancer', 'API\nGateway',
                'Monitor\nService', 'Backup\nSystem', 'Queue\nManager', 'Scheduler',
                'Auth\nService', 'Config\nManager', 'Log\nAggregator', 'Metrics\nCollector'
            ];

            const nodeTypes = [
                'input', 'process', 'analysis', 'model', 'validation', 'output',
                'feedback', 'storage', 'security', 'cache', 'balancer', 'gateway',
                'monitor', 'backup', 'queue', 'scheduler', 'auth', 'config', 'log', 'metrics'
            ];

            // 根据颜色数量确定节点数量 - 优化减少球体数量
            let numNodes;
            if (colorCount <= 6) {
                numNodes = Math.max(6, colorCount + 1); // 最少6个，最多7个
            } else if (colorCount <= 10) {
                numNodes = Math.min(10, colorCount + 2); // 8-12个
            } else if (colorCount <= 15) {
                numNodes = Math.min(14, colorCount + 1); // 11-16个
            } else {
                numNodes = Math.min(16, Math.floor(colorCount * 0.8)); // 大幅减少节点数量
            }

            // 生成节点位置 - 改进布局算法，增加防重叠逻辑
            for (let i = 0; i < numNodes; i++) {
                let x, y;

                if (numNodes <= 8) {
                    // 原始布局 - 增加间距
                    const positions = [
                        [0.15, 0.25], [0.4, 0.15], [0.65, 0.25], [0.85, 0.4],
                        [0.75, 0.65], [0.5, 0.75], [0.25, 0.65], [0.15, 0.45]
                    ];
                    [x, y] = positions[i] || [0.5, 0.5];
                } else if (numNodes <= 12) {
                    // 双层圆形布局 - 增加层间距离
                    const layer = i < 6 ? 0 : 1;
                    const angleStep = (2 * Math.PI) / (layer === 0 ? 6 : numNodes - 6);
                    const angle = angleStep * (layer === 0 ? i : i - 6);
                    const radius = layer === 0 ? 0.22 : 0.42; // 增加层间距离
                    x = 0.5 + radius * Math.cos(angle);
                    y = 0.5 + radius * Math.sin(angle);
                } else {
                    // 三层圆形布局 - 优化层间距离和角度偏移
                    const layer = i < 5 ? 0 : i < 10 ? 1 : 2;
                    const layerSizes = [5, 5, numNodes - 10];
                    const angleStep = (2 * Math.PI) / layerSizes[layer];
                    const layerIndex = layer === 0 ? i : layer === 1 ? i - 5 : i - 10;
                    // 添加角度偏移避免节点对齐
                    const angleOffset = layer * Math.PI / layerSizes[layer];
                    const angle = angleStep * layerIndex + angleOffset;
                    const radius = [0.18, 0.32, 0.46][layer]; // 优化层间距离
                    x = 0.5 + radius * Math.cos(angle);
                    y = 0.5 + radius * Math.sin(angle);
                }

                // 确保节点在边界内，增加边距
                x = Math.max(0.12, Math.min(0.88, x));
                y = Math.max(0.18, Math.min(0.82, y));

                // 动态调整节点大小，防止重叠
                const baseSize = numNodes > 12 ? 25 : numNodes > 8 ? 30 : 35;
                const size = baseSize + Math.random() * 10; // 减小随机范围
                const importance = 0.5 + Math.random() * 0.5; // 0.5-1.0

                nodes.push({
                    id: String.fromCharCode(65 + i), // A, B, C, ...
                    label: nodeLabels[i % nodeLabels.length],
                    x: x,
                    y: y,
                    size: size,
                    type: nodeTypes[i % nodeTypes.length],
                    importance: importance
                });
            }

            // 动态生成连接关系 - 优化连接数量，减少复杂度和交叉
            const connectionTypes = ['data', 'process', 'validate', 'train', 'feedback', 'output', 'adjust', 'store', 'retrieve', 'direct', 'secure', 'cache', 'balance', 'monitor', 'backup'];
            const flowTypes = ['high', 'medium', 'low'];

            // 确保每个节点至少有一个连接，但限制总连接数，优化连接策略减少交叉
            for (let i = 0; i < numNodes; i++) {
                const fromNode = nodes[i];

                // 根据节点数量动态调整连接数，避免过度复杂
                let maxConnections;
                if (numNodes <= 8) {
                    maxConnections = 1; // 减少连接数，避免交叉
                } else if (numNodes <= 12) {
                    maxConnections = 1; // 大幅减少连接数
                } else {
                    maxConnections = 1; // 大量节点时每个节点只有1个连接
                }

                const numConnections = Math.min(1, numNodes - 1);

                for (let j = 0; j < numConnections; j++) {
                    let toIndex;
                    let attempts = 0;
                    let bestDistance = Infinity;
                    let bestIndex = -1;

                    // 优先连接到距离适中的节点，避免长距离连接造成交叉
                    for (let k = 0; k < numNodes; k++) {
                        if (k !== i && !edges.some(e => e.from === fromNode.id && e.to === nodes[k].id)) {
                            const dx = fromNode.x - nodes[k].x;
                            const dy = fromNode.y - nodes[k].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            // 寻找距离适中的节点（不太近也不太远）
                            const idealDistance = 0.2; // 理想距离
                            const distanceScore = Math.abs(distance - idealDistance);

                            if (distanceScore < bestDistance) {
                                bestDistance = distanceScore;
                                bestIndex = k;
                            }
                        }
                    }

                    if (bestIndex !== -1) {
                        const toNode = nodes[bestIndex];
                        const weight = 0.3 + Math.random() * 0.7; // 0.3-1.0

                        edges.push({
                            from: fromNode.id,
                            to: toNode.id,
                            weight: weight,
                            type: connectionTypes[edges.length % connectionTypes.length],
                            flow: flowTypes[Math.floor(Math.random() * 3)]
                        });
                    }
                }
            }

            // 更严格地限制连接数量，根据节点数量动态调整
            const maxEdges = Math.min(edges.length, Math.floor(numNodes * 0.8)); // 进一步减少连接数
            edges = edges.slice(0, maxEdges);

            // 绘制连接线 - 优化样式
            edges.forEach((edge, index) => {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);

                if (fromNode && toNode) {
                    const fromX = fromNode.x * (width - 2 * padding) + padding;
                    const fromY = fromNode.y * (height - 2 * padding) + padding;
                    const toX = toNode.x * (width - 2 * padding) + padding;
                    const toY = toNode.y * (height - 2 * padding) + padding;

                    // 计算节点边缘的连接点
                    const dx = toX - fromX;
                    const dy = toY - fromY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const fromRadius = fromNode.size;
                    const toRadius = toNode.size;

                    const startX = fromX + (dx / distance) * fromRadius;
                    const startY = fromY + (dy / distance) * fromRadius;
                    const endX = toX - (dx / distance) * toRadius;
                    const endY = toY - (dy / distance) * toRadius;

                    // 根据权重和流量设置线条样式
                    const baseWidth = 2;
                    const lineWidth = baseWidth + edge.weight * 6;
                    const alpha = 0.4 + edge.weight * 0.6;
                    const edgeColor = colors[index % colors.length];

                    // 创建渐变连接线
                    const gradient = ctx.createLinearGradient(startX, startY, endX, endY);
                    gradient.addColorStop(0, edgeColor + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
                    gradient.addColorStop(1, adjustBrightness(edgeColor, -20) + Math.floor(alpha * 255).toString(16).padStart(2, '0'));

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';

                    // 绘制曲线连接 - 更自然的曲线
                    const midX = (startX + endX) / 2;
                    const midY = (startY + endY) / 2;
                    const controlOffset = Math.min(50, distance * 0.2);
                    const perpX = -dy / distance * controlOffset;
                    const perpY = dx / distance * controlOffset;
                    const controlX = midX + perpX * (index % 2 === 0 ? 1 : -1);
                    const controlY = midY + perpY * (index % 2 === 0 ? 1 : -1);

                    // 添加阴影效果
                    ctx.shadowColor = 'rgba(0,0,0,0.2)';
                    ctx.shadowBlur = 3;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.quadraticCurveTo(controlX, controlY, endX, endY);
                    ctx.stroke();

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;

                    // 绘制增强的箭头
                    const angle = Math.atan2(endY - controlY, endX - controlX);
                    const arrowLength = Math.min(20, lineWidth * 3);
                    const arrowAngle = Math.PI / 5;

                    ctx.fillStyle = edgeColor;
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(
                        endX - arrowLength * Math.cos(angle - arrowAngle),
                        endY - arrowLength * Math.sin(angle - arrowAngle)
                    );
                    ctx.lineTo(
                        endX - arrowLength * 0.6 * Math.cos(angle),
                        endY - arrowLength * 0.6 * Math.sin(angle)
                    );
                    ctx.lineTo(
                        endX - arrowLength * Math.cos(angle + arrowAngle),
                        endY - arrowLength * Math.sin(angle + arrowAngle)
                    );
                    ctx.closePath();
                    ctx.fill();

                    // 添加权重标签 - 优化显示
                    if (edge.weight > 0.6) {
                        ctx.fillStyle = '#2c3e50';
                        ctx.font = `bold ${Math.max(10, lineWidth)}px "Times New Roman", serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        const labelX = (startX + endX) / 2 + perpX * 0.3;
                        const labelY = (startY + endY) / 2 + perpY * 0.3;

                        // 白色背景圆形
                        const weightText = edge.weight.toFixed(1);
                        const textMetrics = ctx.measureText(weightText);
                        const bgRadius = Math.max(textMetrics.width / 2 + 3, 8);

                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.beginPath();
                        ctx.arc(labelX, labelY, bgRadius, 0, 2 * Math.PI);
                        ctx.fill();

                        ctx.strokeStyle = edgeColor;
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.fillStyle = '#2c3e50';
                        ctx.fillText(weightText, labelX, labelY);
                    }
                }
            });

            // 绘制节点 - 增强视觉效果
            nodes.forEach((node, index) => {
                const x = node.x * (width - 2 * padding) + padding;
                const y = node.y * (height - 2 * padding) + padding;
                const nodeSize = node.size * (0.8 + node.importance * 0.4);

                // 根据节点类型和重要性选择颜色
                const baseColor = colors[index % colors.length];
                const nodeColor = adjustBrightness(baseColor, node.importance * 20 - 10);

                // 绘制节点光晕效果
                const glowGradient = ctx.createRadialGradient(x, y, 0, x, y, nodeSize * 1.5);
                glowGradient.addColorStop(0, nodeColor + '40');
                glowGradient.addColorStop(1, nodeColor + '00');
                ctx.fillStyle = glowGradient;
                ctx.beginPath();
                ctx.arc(x, y, nodeSize * 1.5, 0, 2 * Math.PI);
                ctx.fill();

                // 绘制节点阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.beginPath();
                ctx.arc(x + 3, y + 3, nodeSize, 0, 2 * Math.PI);
                ctx.fill();

                // 绘制节点渐变
                const nodeGradient = ctx.createRadialGradient(
                    x - nodeSize * 0.3, y - nodeSize * 0.3, 0,
                    x, y, nodeSize
                );
                nodeGradient.addColorStop(0, adjustBrightness(nodeColor, 30));
                nodeGradient.addColorStop(0.7, nodeColor);
                nodeGradient.addColorStop(1, adjustBrightness(nodeColor, -20));

                ctx.fillStyle = nodeGradient;
                ctx.beginPath();
                ctx.arc(x, y, nodeSize, 0, 2 * Math.PI);
                ctx.fill();

                // 绘制节点边框
                ctx.strokeStyle = adjustBrightness(nodeColor, -40);
                ctx.lineWidth = 3;
                ctx.stroke();

                // 内部高光
                ctx.strokeStyle = adjustBrightness(nodeColor, 50);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x - nodeSize * 0.2, y - nodeSize * 0.2, nodeSize * 0.3, 0, 2 * Math.PI);
                ctx.stroke();

                // 绘制节点标签 - 增强可读性，防止文字溢出
                ctx.fillStyle = '#ffffff';
                const fontSize = Math.max(11, nodeSize * 0.25);
                ctx.font = `bold ${fontSize}px "Times New Roman", serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 2;

                const lines = node.label.split('\n');
                const lineHeight = fontSize * 1.1;

                // 检查文字是否会溢出圆圈，如果溢出则缩短文字
                lines.forEach((line, lineIndex) => {
                    const yOffset = (lineIndex - (lines.length - 1) / 2) * lineHeight;

                    // 计算文字宽度，如果超出圆圈直径则截断
                    const maxWidth = nodeSize * 1.6; // 允许文字稍微超出圆圈
                    let displayText = line;

                    if (ctx.measureText(displayText).width > maxWidth) {
                        while (ctx.measureText(displayText + '...').width > maxWidth && displayText.length > 0) {
                            displayText = displayText.slice(0, -1);
                        }
                        displayText += '...';
                    }

                    ctx.fillText(displayText, x, y + yOffset);
                });

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // 绘制节点ID - 优化位置
                ctx.fillStyle = adjustBrightness(nodeColor, -60);
                ctx.font = `bold ${Math.max(8, nodeSize * 0.2)}px "Times New Roman", serif`;
                ctx.fillText(node.id, x + nodeSize * 0.6, y - nodeSize * 0.6);
            });

            // 添加增强的图例 - 调整位置到左下角避免遮挡节点
            const legendX = 20;
            const legendY = height - 160;
            const legendWidth = 200;
            const legendHeight = 140;

            // 图例背景渐变
            const legendGradient = ctx.createLinearGradient(legendX, legendY, legendX, legendY + legendHeight);
            legendGradient.addColorStop(0, 'rgba(248,249,250,0.95)');
            legendGradient.addColorStop(1, 'rgba(233,236,239,0.95)');
            ctx.fillStyle = legendGradient;
            ctx.fillRect(legendX - 10, legendY - 10, legendWidth, legendHeight);

            ctx.strokeStyle = '#dee2e6';
            ctx.lineWidth = 2;
            ctx.strokeRect(legendX - 10, legendY - 10, legendWidth, legendHeight);

            // 图例标题
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 14px "Times New Roman", serif';
            ctx.textAlign = 'left';
            ctx.fillText('Network Analysis', legendX, legendY);

            // 图例内容
            ctx.font = '11px "Times New Roman", serif';
            const legendItems = [
                '• Node Size: Processing Capacity',
                '• Node Glow: Importance Level',
                '• Edge Width: Connection Strength',
                '• Edge Curve: Data Flow Path',
                '• Numbers: Weight Values (>0.6)',
                '• Colors: Component Types'
            ];

            legendItems.forEach((item, index) => {
                ctx.fillText(item, legendX, legendY + 25 + index * 16);
            });

            // 添加图表标题
            drawChartTitle(ctx, width, '网络图 - 智核学术');
        }

        function drawTimeline(ctx, canvas, colors) {
            const width = canvas.width;
            const height = canvas.height;

            // 鲁棒性检查：确保颜色数组有效
            if (!colors || !Array.isArray(colors) || colors.length === 0) {
                colors = ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2', '#374151', '#ea580c'];
            }

            // Nature期刊高级风格配色方案
            const natureStyle = {
                primary: '#1a202c',      // 更深的主色调
                secondary: '#4a5568',    // 优雅的次要色
                accent: '#3182ce',       // 科学蓝
                background: '#ffffff',   // 纯白背景
                grid: '#e2e8f0',        // 精细网格
                timeline: '#2d3748',     // 时间轴主线
                cardBg: '#f7fafc',      // 卡片背景
                shadow: 'rgba(0, 0, 0, 0.08)'
            };

            // 清空画布，使用Nature风格纯白背景
            ctx.fillStyle = natureStyle.background;
            ctx.fillRect(0, 0, width, height);

            // 计算优化的边距和布局 - 确保不超出边框
            const margin = Math.min(width, height) * 0.08; // 增加边距
            const contentWidth = width - 2 * margin;
            const contentHeight = height - 2 * margin;

            // 统一标题样式 - 预留足够空间
            const titleAreaHeight = 120; // 增加标题区域高度
            drawChartTitle(ctx, width, '时间轴图 - 智核学术');

            // 根据颜色数量决定时间轴布局策略 - Nature期刊级别优化
            const colorCount = colors.length;
            let timelineCount, eventsPerTimeline;

            // 更智能的布局策略，考虑视觉平衡和可读性
            if (colorCount <= 3) {
                // 单条时间轴，最佳视觉效果
                timelineCount = 1;
                eventsPerTimeline = colorCount;
            } else if (colorCount <= 6) {
                // 双条时间轴，保持良好间距
                timelineCount = 2;
                eventsPerTimeline = Math.ceil(colorCount / 2);
            } else if (colorCount <= 12) {
                // 三条时间轴，平衡密度和可读性
                timelineCount = 3;
                eventsPerTimeline = Math.ceil(colorCount / 3);
            } else if (colorCount <= 20) {
                // 四条时间轴，处理中等数量
                timelineCount = 4;
                eventsPerTimeline = Math.ceil(colorCount / 4);
            } else {
                // 五条时间轴，处理大量配色
                timelineCount = 5;
                eventsPerTimeline = Math.ceil(colorCount / 5);
            }

            // 计算时间轴布局参数 - Nature风格精确控制
            const sideMargin = Math.max(100, width * 0.08); // 更宽的侧边距
            const timelineStartX = margin + sideMargin;
            const timelineEndX = width - margin - sideMargin;
            const timelineLength = timelineEndX - timelineStartX;

            // 动态计算可用高度，预留更多空间防止超出边框
            const availableTimelineHeight = contentHeight - titleAreaHeight - 140; // 增加底部边距

            // 根据时间轴数量计算最优间距 - 防止遮挡和超出边框
            const cardHeight = timelineCount >= 5 ? 40 : (timelineCount >= 4 ? 50 : (timelineCount >= 3 ? 60 : (timelineCount >= 2 ? 70 : 80))); // 适当减小卡片高度
            const cardOffset = cardHeight + 20; // 卡片到时间轴的距离
            const minTimelineSpacing = cardOffset * 2 + 25; // 确保上下卡片不重叠，适当减小间距

            // 计算实际间距，确保不会遮挡
            let actualTimelineSpacing;
            if (timelineCount === 1) {
                actualTimelineSpacing = 0;
            } else {
                const idealSpacing = availableTimelineHeight / (timelineCount + 1);
                actualTimelineSpacing = Math.max(minTimelineSpacing, idealSpacing);

                // 如果间距过大，适当缩小但保持最小值
                if (actualTimelineSpacing > 200) {
                    actualTimelineSpacing = Math.min(200, Math.max(minTimelineSpacing, idealSpacing * 0.8));
                }
            }

            // 计算第一条时间轴的Y坐标，确保居中
            const totalUsedHeight = (timelineCount - 1) * actualTimelineSpacing;
            const firstTimelineY = margin + titleAreaHeight + (availableTimelineHeight - totalUsedHeight) / 2;

            // 动态生成事件数据
            const eventTemplates = [
                { title: 'Research Initiation', desc: 'Problem identification\nand hypothesis formation', phase: 'Planning' },
                { title: 'Literature Analysis', desc: 'Comprehensive review\nof existing knowledge', phase: 'Foundation' },
                { title: 'Experimental Design', desc: 'Methodology development\nand protocol establishment', phase: 'Preparation' },
                { title: 'Data Collection', desc: 'Systematic evidence\ngathering and validation', phase: 'Execution' },
                { title: 'Results Analysis', desc: 'Statistical processing\nand pattern recognition', phase: 'Analysis' },
                { title: 'Peer Review', desc: 'Expert evaluation\nand feedback integration', phase: 'Validation' },
                { title: 'Publication', desc: 'Knowledge dissemination\nand community sharing', phase: 'Completion' },
                { title: 'Follow-up Studies', desc: 'Extended research\nand replication efforts', phase: 'Extension' },
                { title: 'Clinical Trials', desc: 'Real-world testing\nand validation', phase: 'Application' },
                { title: 'Implementation', desc: 'Practical deployment\nand scaling', phase: 'Deployment' },
                { title: 'Impact Assessment', desc: 'Long-term evaluation\nand measurement', phase: 'Evaluation' },
                { title: 'Innovation Cycle', desc: 'Next generation\nresearch planning', phase: 'Innovation' }
            ];

            // 绘制多条时间轴
            let eventIndex = 0;
            for (let timelineIdx = 0; timelineIdx < timelineCount; timelineIdx++) {
                const timelineY = firstTimelineY + timelineIdx * actualTimelineSpacing;

                // 计算当前时间轴的事件数量
                const remainingEvents = colorCount - eventIndex;
                const currentTimelineEvents = Math.min(eventsPerTimeline, remainingEvents);

                if (currentTimelineEvents <= 0) break;

                // 绘制时间轴线 - 渐变效果
                const gradient = ctx.createLinearGradient(timelineStartX, 0, timelineEndX, 0);
                gradient.addColorStop(0, natureStyle.accent);
                gradient.addColorStop(0.5, natureStyle.timeline);
                gradient.addColorStop(1, natureStyle.accent);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(timelineStartX, timelineY);
                ctx.lineTo(timelineEndX, timelineY);
                ctx.stroke();

                // 计算事件间距
                const eventSpacing = currentTimelineEvents > 1 ? timelineLength / (currentTimelineEvents + 1) : timelineLength / 2;

                // 绘制当前时间轴的事件
                for (let i = 0; i < currentTimelineEvents; i++) {
                    const eventX = timelineStartX + (i + 1) * eventSpacing;
                    const eventColor = colors[eventIndex % colors.length];
                    const eventData = eventTemplates[eventIndex % eventTemplates.length];

                    // 交替上下布局，但为多时间轴优化间距 - 鲁棒性改进
                    const isTop = (eventIndex % 2 === 0);

                    // 根据时间轴数量动态调整卡片偏移和大小 - Nature期刊标准
                    let cardWidth;
                    if (timelineCount >= 5) {
                        cardWidth = Math.max(120, Math.min(160, timelineLength / (eventsPerTimeline + 1) * 0.7));
                    } else if (timelineCount === 4) {
                        cardWidth = Math.max(140, Math.min(180, timelineLength / (eventsPerTimeline + 1) * 0.75));
                    } else if (timelineCount === 3) {
                        cardWidth = Math.max(160, Math.min(200, timelineLength / (eventsPerTimeline + 1) * 0.8));
                    } else if (timelineCount === 2) {
                        cardWidth = Math.max(180, Math.min(220, timelineLength / (eventsPerTimeline + 1) * 0.85));
                    } else {
                        cardWidth = Math.max(200, Math.min(250, timelineLength / (eventsPerTimeline + 1) * 0.9));
                    }

                    // 确保卡片不会重叠 - 智能间距调整
                    const maxCardWidth = (eventSpacing * 0.9);
                    cardWidth = Math.min(cardWidth, maxCardWidth);

                    const cardY = isTop ? timelineY - cardOffset : timelineY + 40;

                    // 绘制连接线
                    ctx.strokeStyle = adjustBrightness(eventColor, 0.7);
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 3]);
                    ctx.beginPath();
                    ctx.moveTo(eventX, timelineY);
                    ctx.lineTo(eventX, cardY + (isTop ? (cardOffset - 20) : -20));
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 绘制时间轴节点
                    // 外圈光晕效果
                    const glowGradient = ctx.createRadialGradient(eventX, timelineY, 0, eventX, timelineY, 12);
                    glowGradient.addColorStop(0, adjustBrightness(eventColor, 1.2));
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = glowGradient;
                    ctx.beginPath();
                    ctx.arc(eventX, timelineY, 12, 0, 2 * Math.PI);
                    ctx.fill();

                    // 主节点
                    ctx.fillStyle = eventColor;
                    ctx.beginPath();
                    ctx.arc(eventX, timelineY, 8, 0, 2 * Math.PI);
                    ctx.fill();

                    // 节点内圈
                    ctx.fillStyle = natureStyle.background;
                    ctx.beginPath();
                    ctx.arc(eventX, timelineY, 5, 0, 2 * Math.PI);
                    ctx.fill();

                    // 绘制事件卡片 - Nature期刊级别视觉设计
                    const cardX = eventX - cardWidth / 2;

                    // 智能边界检测和调整 - 防止卡片超出画布
                    const minCardX = timelineStartX - cardWidth / 2 + 10;
                    const maxCardX = timelineEndX - cardWidth / 2 - 10;
                    const adjustedCardX = Math.max(minCardX, Math.min(maxCardX, cardX));

                    // 高质量阴影效果 - 多层阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
                    ctx.fillRect(adjustedCardX + 4, cardY + 4, cardWidth, cardHeight);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.fillRect(adjustedCardX + 2, cardY + 2, cardWidth, cardHeight);

                    // 卡片背景 - Nature期刊风格渐变
                    const cardGradient = ctx.createLinearGradient(adjustedCardX, cardY, adjustedCardX, cardY + cardHeight);
                    cardGradient.addColorStop(0, '#ffffff');
                    cardGradient.addColorStop(0.3, '#fefefe');
                    cardGradient.addColorStop(0.7, '#fcfcfc');
                    cardGradient.addColorStop(1, '#f8f9fa');
                    ctx.fillStyle = cardGradient;
                    ctx.fillRect(adjustedCardX, cardY, cardWidth, cardHeight);

                    // 卡片左侧彩色指示条 - 更宽更醒目
                    const indicatorWidth = Math.max(4, cardWidth * 0.025);
                    ctx.fillStyle = eventColor;
                    ctx.fillRect(adjustedCardX, cardY, indicatorWidth, cardHeight);

                    // 卡片边框 - 精细边框设计
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.06)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(adjustedCardX, cardY, cardWidth, cardHeight);

                    // 内部高光边框
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(adjustedCardX + 0.5, cardY + 0.5, cardWidth - 1, cardHeight - 1);

                    // 文本内容 - Nature期刊级别排版
                    const textPadding = indicatorWidth + 8;
                    const availableTextWidth = cardWidth - textPadding - 8;

                    // 动态字体大小 - 基于卡片尺寸和内容密度
                    const baseFontSize = Math.max(8, Math.min(12, cardWidth / 15));
                    const titleFontSize = Math.max(10, Math.min(16, cardWidth / 12));
                    const phaseFontSize = Math.max(7, Math.min(10, cardWidth / 18));

                    // 阶段标签 - 优雅的小标签设计
                    ctx.fillStyle = adjustBrightness(eventColor, 0.85);
                    ctx.font = `600 ${phaseFontSize}px "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    const phaseY = cardY + 6;
                    ctx.fillText(eventData.phase.toUpperCase(), adjustedCardX + textPadding, phaseY);

                    // 事件标题 - 主要内容，加粗显示
                    ctx.fillStyle = '#1a202c';
                    ctx.font = `700 ${titleFontSize}px "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                    const titleText = truncateText(ctx, eventData.title, availableTextWidth);
                    const titleY = phaseY + phaseFontSize + 4;
                    ctx.fillText(titleText, adjustedCardX + textPadding, titleY);

                    // 智能描述显示 - 根据可用空间调整
                    const remainingHeight = cardHeight - (titleY - cardY) - titleFontSize - 8;
                    if (remainingHeight > baseFontSize + 4) {
                        ctx.fillStyle = '#4a5568';
                        ctx.font = `400 ${baseFontSize}px "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;

                        const descLines = eventData.desc.split('\n');
                        const lineHeight = baseFontSize + 2;
                        const maxLines = Math.floor(remainingHeight / lineHeight);

                        if (maxLines >= 1) {
                            const descY = titleY + titleFontSize + 4;
                            descLines.slice(0, maxLines).forEach((line, idx) => {
                                if (descY + idx * lineHeight + baseFontSize <= cardY + cardHeight - 4) {
                                    const lineText = truncateText(ctx, line.trim(), availableTextWidth);
                                    ctx.fillText(lineText, adjustedCardX + textPadding, descY + idx * lineHeight);
                                }
                            });
                        }
                    }

                    // 年份标签 - 优化居中显示
                    const year = 2020 + eventIndex;
                    const yearBoxWidth = 36;
                    const yearBoxHeight = 18;
                    const yearBoxX = eventX - yearBoxWidth / 2;
                    const yearBoxY = timelineY + 15;

                    // 年份背景
                    ctx.fillStyle = natureStyle.background;
                    ctx.fillRect(yearBoxX, yearBoxY, yearBoxWidth, yearBoxHeight);

                    // 年份边框
                    ctx.strokeStyle = eventColor;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(yearBoxX, yearBoxY, yearBoxWidth, yearBoxHeight);

                    // 年份文字 - 确保居中
                    ctx.fillStyle = eventColor;
                    ctx.font = 'bold 10px "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(year.toString(), eventX, yearBoxY + yearBoxHeight / 2);

                    eventIndex++;
                }
            }

            // 文本截断函数
            function truncateText(ctx, text, maxWidth) {
                if (ctx.measureText(text).width <= maxWidth) {
                    return text;
                }

                let truncated = text;
                while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                    truncated = truncated.slice(0, -1);
                }
                return truncated + '...';
            }

            // 亮度调整辅助函数
            function adjustBrightness(color, factor) {
                const hex = color.replace('#', '');
                const r = Math.min(255, Math.max(0, parseInt(hex.substr(0, 2), 16) * factor));
                const g = Math.min(255, Math.max(0, parseInt(hex.substr(2, 2), 16) * factor));
                const b = Math.min(255, Math.max(0, parseInt(hex.substr(4, 2), 16) * factor));
                return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
            }

            // 现代化图例和说明
            const legendY = height - margin - 25;
            ctx.fillStyle = natureStyle.secondary;
            ctx.font = '11px "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';


            // 添加现代化的装饰边框
            ctx.strokeStyle = natureStyle.grid;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(margin / 2, margin / 2, width - margin, height - margin);
            ctx.setLineDash([]);
        }
        // 辅助函数：绘制箭头
        function drawArrow(ctx, fromX, fromY, toX, toY, color) {
            const headLength = 15;
            const headAngle = Math.PI / 6;
            const angle = Math.atan2(toY - fromY, toX - fromX);

            // 调整起点和终点，避免箭头与节点重叠
            const adjustedFromX = fromX + Math.cos(angle) * 60;
            const adjustedFromY = fromY + Math.sin(angle) * 30;
            const adjustedToX = toX - Math.cos(angle) * 60;
            const adjustedToY = toY - Math.sin(angle) * 30;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            // 绘制箭头主体
            ctx.beginPath();
            ctx.moveTo(adjustedFromX, adjustedFromY);
            ctx.lineTo(adjustedToX, adjustedToY);
            ctx.stroke();

            // 绘制箭头头部
            ctx.beginPath();
            ctx.moveTo(adjustedToX, adjustedToY);
            ctx.lineTo(
                adjustedToX - headLength * Math.cos(angle - headAngle),
                adjustedToY - headLength * Math.sin(angle - headAngle)
            );
            ctx.moveTo(adjustedToX, adjustedToY);
            ctx.lineTo(
                adjustedToX - headLength * Math.cos(angle + headAngle),
                adjustedToY - headLength * Math.sin(angle + headAngle)
            );
            ctx.stroke();
        }

        // 拐弯箭头绘制函数 - 避免遮挡
        function drawCurvedArrow(ctx, fromX, fromY, toX, toY, color) {
            const headLength = 15;
            const headAngle = Math.PI / 6;

            // 调整起点和终点，避免箭头与节点重叠
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const adjustedFromX = fromX + Math.cos(angle) * 60;
            const adjustedFromY = fromY + Math.sin(angle) * 30;
            const adjustedToX = toX - Math.cos(angle) * 60;
            const adjustedToY = toY - Math.sin(angle) * 30;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            // 计算控制点，创建弯曲路径
            const dx = adjustedToX - adjustedFromX;
            const dy = adjustedToY - adjustedFromY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 根据距离和方向调整弯曲程度
            let controlOffset = Math.min(distance * 0.3, 80);

            // 如果是垂直或水平线，增加弯曲
            if (Math.abs(dx) < 50 || Math.abs(dy) < 50) {
                controlOffset = Math.max(controlOffset, 60);
            }

            // 计算控制点位置
            const midX = (adjustedFromX + adjustedToX) / 2;
            const midY = (adjustedFromY + adjustedToY) / 2;

            // 垂直于连线方向的偏移
            const perpAngle = angle + Math.PI / 2;
            const controlX = midX + Math.cos(perpAngle) * controlOffset;
            const controlY = midY + Math.sin(perpAngle) * controlOffset;

            // 绘制二次贝塞尔曲线
            ctx.beginPath();
            ctx.moveTo(adjustedFromX, adjustedFromY);
            ctx.quadraticCurveTo(controlX, controlY, adjustedToX, adjustedToY);
            ctx.stroke();

            // 计算箭头头部的角度（基于曲线终点的切线方向）
            const finalAngle = Math.atan2(adjustedToY - controlY, adjustedToX - controlX);

            // 绘制箭头头部
            ctx.beginPath();
            ctx.moveTo(adjustedToX, adjustedToY);
            ctx.lineTo(
                adjustedToX - headLength * Math.cos(finalAngle - headAngle),
                adjustedToY - headLength * Math.sin(finalAngle - headAngle)
            );
            ctx.moveTo(adjustedToX, adjustedToY);
            ctx.lineTo(
                adjustedToX - headLength * Math.cos(finalAngle + headAngle),
                adjustedToY - headLength * Math.sin(finalAngle + headAngle)
            );
            ctx.stroke();
        }

        // 组织架构图绘制函数 - Nature风格优化版本
        function drawOrganizationalChart(ctx, width, height, colors) {
            // 确保颜色数组的健壮性
            if (!colors || colors.length === 0) {
                colors = ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed',
                    '#0891b2', '#374151', '#ea580c'];
            }

            // Nature期刊风格配色
            const natureStyle = {
                background: '#ffffff',
                primary: '#1f2937',
                secondary: '#6b7280',
                accent: '#3b82f6',
                border: '#e5e7eb',
                shadow: 'rgba(0, 0, 0, 0.1)'
            };

            // 清空画布并设置纯白背景
            ctx.fillStyle = natureStyle.background;
            ctx.fillRect(0, 0, width, height);

            // 计算安全边距，确保内容不溢出
            const margin = Math.min(width, height) * 0.06;
            const availableWidth = width - 2 * margin;
            const availableHeight = height - 2 * margin - 120; // 为标题预留空间

            // 根据颜色数量动态生成组织架构数据
            function generateOrgData(colorCount) {
                const departments = [
                    'AI Research', 'Data Science', 'Engineering', 'Product', 'Marketing',
                    'Operations', 'Finance', 'HR', 'Legal', 'Strategy', 'Innovation', 'Quality'
                ];

                const titles = [
                    'Director', 'Manager', 'Lead', 'Senior', 'Principal', 'Chief',
                    'Head', 'VP', 'Specialist', 'Coordinator', 'Analyst', 'Expert'
                ];

                const names = [
                    'Dr. Zhang', 'Dr. Li', 'Dr. Wang', 'Dr. Chen', 'Dr. Liu', 'Dr. Wu',
                    'Dr. Zhao', 'Dr. Sun', 'Dr. Ma', 'Dr. Xu', 'Dr. Zhou', 'Dr. Yang'
                ];

                // 根据颜色数量决定层级结构
                let maxLevels, nodesPerLevel;

                if (colorCount <= 4) {
                    maxLevels = 3;
                    nodesPerLevel = [1, Math.min(3, colorCount - 1), Math.max(0, colorCount - 4)];
                } else if (colorCount <= 8) {
                    maxLevels = 3;
                    nodesPerLevel = [1, Math.min(4, Math.ceil((colorCount - 1) / 2)), colorCount - 1 - Math.min(4, Math.ceil((colorCount - 1) / 2))];
                } else if (colorCount <= 12) {
                    maxLevels = 4;
                    nodesPerLevel = [1, 3, Math.min(5, colorCount - 4), Math.max(0, colorCount - 9)];
                } else {
                    maxLevels = 4;
                    nodesPerLevel = [1, 4, Math.min(6, Math.ceil((colorCount - 5) / 2)), colorCount - 5 - Math.min(6, Math.ceil((colorCount - 5) / 2))];
                }

                // 构建组织架构树
                const orgData = {
                    name: 'Research Institute',
                    title: 'CEO: Prof. Zhang',
                    level: 0,
                    children: []
                };

                let nodeIndex = 1; // 跳过根节点

                // 生成第一级节点
                for (let i = 0; i < nodesPerLevel[1] && nodeIndex < colorCount; i++) {
                    const dept = departments[i % departments.length];
                    const title = titles[i % titles.length];
                    const name = names[i % names.length];

                    const firstLevelNode = {
                        name: dept,
                        title: `${title}: ${name}`,
                        level: 1,
                        children: []
                    };

                    // 为每个第一级节点添加子节点
                    if (maxLevels > 2 && nodesPerLevel[2] > 0) {
                        const childrenCount = Math.ceil(nodesPerLevel[2] / nodesPerLevel[1]);
                        for (let j = 0; j < childrenCount && nodeIndex < colorCount - 1; j++) {
                            nodeIndex++;
                            if (nodeIndex >= colorCount) break;

                            const childDept = departments[(nodeIndex + 5) % departments.length];
                            const childTitle = titles[(nodeIndex + 3) % titles.length];
                            const childName = names[(nodeIndex + 2) % names.length];

                            const secondLevelNode = {
                                name: childDept + ' Team',
                                title: `${childTitle}: ${childName}`,
                                level: 2,
                                children: []
                            };

                            // 添加第三级节点（如果需要）
                            if (maxLevels > 3 && nodesPerLevel[3] > 0) {
                                const grandChildrenCount = Math.ceil(nodesPerLevel[3] / nodesPerLevel[2]);
                                for (let k = 0; k < grandChildrenCount && nodeIndex < colorCount - 1; k++) {
                                    nodeIndex++;
                                    if (nodeIndex >= colorCount) break;

                                    const grandChildDept = departments[(nodeIndex + 7) % departments.length];
                                    const grandChildTitle = titles[(nodeIndex + 4) % titles.length];
                                    const grandChildName = names[(nodeIndex + 6) % names.length];

                                    secondLevelNode.children.push({
                                        name: grandChildDept + ' Unit',
                                        title: `${grandChildTitle}: ${grandChildName}`,
                                        level: 3
                                    });
                                }
                            }

                            firstLevelNode.children.push(secondLevelNode);
                        }
                    }

                    orgData.children.push(firstLevelNode);
                    nodeIndex++;
                }

                return orgData;
            }

            const orgData = generateOrgData(colors.length);

            // 智能布局算法 - 防止重叠和溢出
            const nodeWidth = Math.max(120, Math.min(180, availableWidth / Math.max(6, Math.ceil(Math.sqrt(colors.length)))));
            const nodeHeight = 50;

            // 动态计算层级间距
            const maxLevel = Math.max(...getAllNodes(orgData).map(n => n.level));
            const levelHeight = Math.max(80, Math.min(140, availableHeight / (maxLevel + 1.5)));

            // 获取所有节点的扁平列表
            function getAllNodes(node) {
                let nodes = [node];
                if (node.children) {
                    node.children.forEach(child => {
                        nodes = nodes.concat(getAllNodes(child));
                    });
                }
                return nodes;
            }

            // 计算每一层的节点数量
            const levelCounts = {};
            getAllNodes(orgData).forEach(node => {
                levelCounts[node.level] = (levelCounts[node.level] || 0) + 1;
            });

            // 计算所有节点的位置
            const nodePositions = [];
            const levelCounters = {}; // 跟踪每层已放置的节点数

            function calculatePositions(node, level, parentX, parentIndex) {
                if (!levelCounters[level]) levelCounters[level] = 0;

                const nodesInLevel = levelCounts[level];
                const currentIndex = levelCounters[level];

                let y = margin + 100 + level * levelHeight;
                let x;

                if (level === 0) {
                    // 根节点居中
                    x = width / 2;
                } else {
                    // 智能分布算法
                    if (nodesInLevel === 1) {
                        x = width / 2;
                    } else if (nodesInLevel <= 6) {
                        // 少量节点时均匀分布
                        const spacing = Math.min(availableWidth / (nodesInLevel + 1), nodeWidth * 1.8);
                        const totalWidth = (nodesInLevel - 1) * spacing;
                        const startX = (width - totalWidth) / 2;
                        x = startX + currentIndex * spacing;
                    } else {
                        // 多节点时采用多行布局
                        const nodesPerRow = Math.ceil(Math.sqrt(nodesInLevel));
                        const currentRow = Math.floor(currentIndex / nodesPerRow);
                        const indexInRow = currentIndex % nodesPerRow;
                        const nodesInCurrentRow = Math.min(nodesPerRow, nodesInLevel - currentRow * nodesPerRow);

                        const rowSpacing = Math.min(availableWidth / (nodesInCurrentRow + 1), nodeWidth * 1.6);
                        const totalRowWidth = (nodesInCurrentRow - 1) * rowSpacing;
                        const rowStartX = (width - totalRowWidth) / 2;

                        x = rowStartX + indexInRow * rowSpacing;

                        // 调整Y位置以适应多行
                        const additionalRowOffset = currentRow * (nodeHeight + 20);
                        y += additionalRowOffset;
                    }
                }

                // 确保节点在画布范围内
                x = Math.max(margin + nodeWidth / 2 + 5,
                    Math.min(width - margin - nodeWidth / 2 - 5, x));

                const position = {
                    node,
                    x,
                    y: y,
                    level,
                    parentX: level > 0 ? parentX : null,
                    index: currentIndex
                };
                nodePositions.push(position);
                levelCounters[level]++;

                if (node.children) {
                    node.children.forEach((child, index) => {
                        calculatePositions(child, level + 1, x, index);
                    });
                }
            }

            calculatePositions(orgData, 0, 0, 0);

            // 绘制连接线 - 优化的连接算法
            ctx.strokeStyle = natureStyle.secondary;
            ctx.lineWidth = 1.5;

            nodePositions.forEach(pos => {
                if (pos.parentX !== null) {
                    const parentPos = nodePositions.find(p =>
                        p.level === pos.level - 1 && Math.abs(p.x - pos.parentX) < 50
                    );

                    if (parentPos) {
                        // 智能连接线绘制
                        const startY = parentPos.y + nodeHeight / 2;
                        const endY = pos.y - nodeHeight / 2;
                        const midY = (startY + endY) / 2;

                        ctx.beginPath();
                        ctx.moveTo(parentPos.x, startY);
                        ctx.lineTo(parentPos.x, midY);
                        ctx.lineTo(pos.x, midY);
                        ctx.lineTo(pos.x, endY);
                        ctx.stroke();

                        // 添加连接点
                        ctx.fillStyle = natureStyle.accent;
                        ctx.beginPath();
                        ctx.arc(parentPos.x, midY, 2, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(pos.x, midY, 2, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            });

            // 绘制节点 - Nature期刊风格
            nodePositions.forEach((pos, index) => {
                const x = pos.x - nodeWidth / 2;
                const y = pos.y - nodeHeight / 2;
                const color = colors[index % colors.length];

                // 节点阴影 - 更精细
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(x + 2, y + 2, nodeWidth, nodeHeight);

                // 节点背景 - 使用渐变
                const gradient = ctx.createLinearGradient(x, y, x, y + nodeHeight);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, adjustBrightness(color, 0.85));
                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, nodeWidth, nodeHeight);

                // 节点边框 - Nature风格细边框
                ctx.strokeStyle = adjustBrightness(color, 0.7);
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x, y, nodeWidth, nodeHeight);

                // 内部高光
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 1, y + 1, nodeWidth - 2, nodeHeight - 2);

                // 文本处理 - 优化可读性
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 部门名称 - 加粗
                ctx.font = 'bold 10px "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
                const nameText = truncateText(ctx, pos.node.name, nodeWidth - 8);
                ctx.fillText(nameText, pos.x, pos.y - 7);

                // 负责人姓名 - 常规字体
                ctx.font = '8px "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
                const titleText = truncateText(ctx, pos.node.title, nodeWidth - 8);
                ctx.fillText(titleText, pos.x, pos.y + 7);
            });

            // 文本截断函数 - 防止溢出
            function truncateText(ctx, text, maxWidth) {
                if (ctx.measureText(text).width <= maxWidth) {
                    return text;
                }

                let truncated = text;
                while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                    truncated = truncated.slice(0, -1);
                }
                return truncated + '...';
            }

            // 亮度调整函数
            function adjustBrightness(color, factor) {
                const hex = color.replace('#', '');
                const r = Math.min(255, Math.max(0, parseInt(hex.substr(0, 2), 16) * factor));
                const g = Math.min(255, Math.max(0, parseInt(hex.substr(2, 2), 16) * factor));
                const b = Math.min(255, Math.max(0, parseInt(hex.substr(4, 2), 16) * factor));
                return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
            }

            // 统一标题样式
            drawChartTitle(ctx, width, '组织架构图 - 智核学术');

            // 图例说明
            const legendY = height - margin + 15;
            ctx.fillStyle = natureStyle.secondary;
            ctx.font = '10px "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
            ctx.textAlign = 'center';

        } window.applyPresetPalette = applyPresetPalette;

        // 取色器相关功能

        function handleMouseMove(event, img) {
            if (!colorPickerMode || !magnifier || !colorPickerCanvas) return;

            // 如果没有传入img参数，使用事件目标
            if (!img) {
                img = event.target;
                if (!img || (img.tagName !== 'IMG' && !img.closest('img'))) return;
                if (img.tagName !== 'IMG') {
                    img = img.closest('img');
                }
            }

            const rect = img.getBoundingClientRect();

            // 更新canvas以匹配当前图片
            if (colorPickerCanvas.width !== img.naturalWidth ||
                colorPickerCanvas.height !== img.naturalHeight) {
                colorPickerCanvas.width = img.naturalWidth;
                colorPickerCanvas.height = img.naturalHeight;
                colorPickerCtx.drawImage(img, 0, 0);
            }

            // 计算鼠标在图片中的位置
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            // 计算图片的实际显示区域
            const displayWidth = rect.width;
            const displayHeight = rect.height;
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;

            const displayAspect = displayWidth / displayHeight;
            const naturalAspect = naturalWidth / naturalHeight;

            let actualDisplayWidth, actualDisplayHeight, offsetX, offsetY;

            if (displayAspect > naturalAspect) {
                actualDisplayHeight = displayHeight;
                actualDisplayWidth = displayHeight * naturalAspect;
                offsetX = (displayWidth - actualDisplayWidth) / 2;
                offsetY = 0;
            } else {
                actualDisplayWidth = displayWidth;
                actualDisplayHeight = displayWidth / naturalAspect;
                offsetX = 0;
                offsetY = (displayHeight - actualDisplayHeight) / 2;
            }

            // 检查鼠标是否在图片区域内
            const relativeX = mouseX - offsetX;
            const relativeY = mouseY - offsetY;

            // 获取取色器指示器
            let colorPicker = document.getElementById('colorPickerIndicator');
            if (!colorPicker) {
                colorPicker = createColorPicker();
            }

            if (relativeX < 0 || relativeX > actualDisplayWidth ||
                relativeY < 0 || relativeY > actualDisplayHeight) {
                // 鼠标在图片外，立即隐藏所有元素
                hideMagnifier();
                // 立即隐藏取色器指示器
                if (colorPicker) {
                    colorPicker.style.display = 'none';
                }
                return;
            }

            // 转换为原始图片坐标
            const scaleX = naturalWidth / actualDisplayWidth;
            const scaleY = naturalHeight / actualDisplayHeight;

            const sourceX = Math.floor(relativeX * scaleX);
            const sourceY = Math.floor(relativeY * scaleY);

            // 获取当前位置的颜色
            try {
                const imageData = colorPickerCtx.getImageData(sourceX, sourceY, 1, 1);
                const pixel = imageData.data;
                const r = pixel[0];
                const g = pixel[1];
                const b = pixel[2];
                currentColor = rgbToHex(r, g, b);

                // 更新取色器指示器位置和颜色
                colorPicker.style.left = `${event.clientX}px`;
                colorPicker.style.top = `${event.clientY}px`;
                colorPicker.style.background = currentColor;
                colorPicker.style.display = 'block';
                colorPicker.style.transform = 'translate(-50%, -50%) scale(1)';

                // 更新颜色预览
                updateColorPreview(currentColor);

                // 绘制放大镜内容
                drawMagnifier(sourceX, sourceY, naturalWidth, naturalHeight);

                // 显示放大镜和颜色预览
                showMagnifier(event.clientX, event.clientY);
            } catch (error) {
                console.error('取色失败:', error);
            }
        }

        function showMagnifier(x, y) {
            if (!magnifier || !colorPreview) return;

            // 获取取色器指示器
            let colorPicker = document.getElementById('colorPickerIndicator');
            if (!colorPicker) {

            // 添加动画效果 - 使用setTimeout确保display先改变

        function hideMagnifier() {
            if (!magnifier || !colorPreview) return;

            // 获取取色器指示器
            const colorPicker = document.getElementById('colorPickerIndicator');

            // 立即隐藏所有元素，不使用动画

        function updateColorPreview(color) {

        function drawMagnifier(centerX, centerY, imgWidth, imgHeight) {
            if (!magnifierCtx || !colorPickerCanvas) return;

            const magnifierSize = 120; // 与createMagnifier中设置的尺寸一致
            const zoomLevel = 5; // 放大倍数
            const sourceSize = magnifierSize / zoomLevel;

            // 清空放大镜
            magnifierCtx.clearRect(0, 0, magnifierSize, magnifierSize);

            // 绘制圆形裁剪区域
            magnifierCtx.save();
            magnifierCtx.beginPath();
            magnifierCtx.arc(magnifierSize / 2, magnifierSize / 2, magnifierSize / 2, 0, 2 * Math.PI);
            magnifierCtx.clip();

            // 计算源区域
            const sourceX = Math.max(0, centerX - sourceSize / 2);
            const sourceY = Math.max(0, centerY - sourceSize / 2);
            const sourceWidth = Math.min(sourceSize, imgWidth - sourceX);
            const sourceHeight = Math.min(sourceSize, imgHeight - sourceY);

            // 绘制放大的图像
            magnifierCtx.drawImage(
                colorPickerCanvas,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, magnifierSize, magnifierSize
            );

            // 绘制中心十字线
            magnifierCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            magnifierCtx.lineWidth = 1;
            magnifierCtx.beginPath();
            magnifierCtx.moveTo(magnifierSize / 2, 0);
            magnifierCtx.lineTo(magnifierSize / 2, magnifierSize);
            magnifierCtx.moveTo(0, magnifierSize / 2);
            magnifierCtx.lineTo(magnifierSize, magnifierSize / 2);
            magnifierCtx.stroke();

            // 绘制中心点
            magnifierCtx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            magnifierCtx.beginPath();
            magnifierCtx.arc(magnifierSize / 2, magnifierSize / 2, 3, 0, 2 * Math.PI);
            magnifierCtx.fill();

            magnifierCtx.restore();
        }

        function handleImageClick(event, img) {
            if (colorPickerMode && colorPickerCanvas) {
                // 如果没有传入img参数，使用事件目标
                if (!img) {
                    img = event.target;
                    if (!img || (img.tagName !== 'IMG' && !img.closest('img'))) return;
                    if (img.tagName !== 'IMG') {
                        img = img.closest('img');
                    }
                }

                // 取色器模式
                const rect = img.getBoundingClientRect();

                // 更新canvas以匹配当前图片
                if (colorPickerCanvas.width !== img.naturalWidth ||
                    colorPickerCanvas.height !== img.naturalHeight) {
                    colorPickerCanvas.width = img.naturalWidth;
                    colorPickerCanvas.height = img.naturalHeight;
                    colorPickerCtx.drawImage(img, 0, 0);
                }

                // 更精确的坐标计算，考虑图片的实际显示尺寸和原始尺寸的比例
                const displayWidth = rect.width;
                const displayHeight = rect.height;
                const naturalWidth = img.naturalWidth;
                const naturalHeight = img.naturalHeight;

                // 计算图片在容器中的实际显示区域（考虑object-fit等样式）
                const displayAspect = displayWidth / displayHeight;
                const naturalAspect = naturalWidth / naturalHeight;

                let actualDisplayWidth, actualDisplayHeight, offsetX, offsetY;

                if (displayAspect > naturalAspect) {
                    // 图片按高度缩放，左右有空白
                    actualDisplayHeight = displayHeight;
                    actualDisplayWidth = displayHeight * naturalAspect;
                    offsetX = (displayWidth - actualDisplayWidth) / 2;
                    offsetY = 0;
                } else {
                    // 图片按宽度缩放，上下有空白
                    actualDisplayWidth = displayWidth;
                    actualDisplayHeight = displayWidth / naturalAspect;
                    offsetX = 0;
                    offsetY = (displayHeight - actualDisplayHeight) / 2;
                }

                // 计算点击位置相对于实际图片显示区域的坐标
                const clickX = event.clientX - rect.left - offsetX;
                const clickY = event.clientY - rect.top - offsetY;

                // 确保点击在图片区域内
                if (clickX < 0 || clickX > actualDisplayWidth || clickY < 0 || clickY > actualDisplayHeight) {
                    showToast('请点击图片区域');
                    return;
                }

                // 转换为原始图片坐标
                const scaleX = naturalWidth / actualDisplayWidth;
                const scaleY = naturalHeight / actualDisplayHeight;

                const centerX = Math.floor(clickX * scaleX);
                const centerY = Math.floor(clickY * scaleY);

                try {
                    // 使用当前已获取的颜色值
                    const hex = currentColor;

                    // 添加到待选区
                    addToColorSelection(hex);
                    showToast(`已选取颜色：${hex}`);

                    // 在点击位置显示临时指示器
                    showColorPickIndicator(event.clientX, event.clientY, hex);
                } catch (error) {
                    console.error('取色失败:', error);
                    showToast('取色失败，请重试');
                }
            }
            // 非取色器模式下不做任何处理，保持原有行为
        }

        function enableColorPicker(img) {
            // 为单个图片启用取色器功能
            if (!img) return;

            // 确保取色器指示器存在
            let colorPicker = document.getElementById('colorPickerIndicator');
            if (!colorPicker) {
                colorPicker = createColorPicker();
            }

            // 移除旧的事件监听器，防止重复绑定
            img.removeEventListener('click', img.colorPickerHandler);
            img.removeEventListener('mousemove', img.colorPickerMoveHandler);
            img.removeEventListener('mouseleave', img.colorPickerLeaveHandler);

            // 创建新的事件处理函数
            img.colorPickerHandler = (e) => handleImageClick(e, img);
            img.colorPickerMoveHandler = (e) => handleMouseMove(e, img);
            img.colorPickerLeaveHandler = () => hideMagnifier();

            // 添加事件监听器
            img.addEventListener('click', img.colorPickerHandler);
            img.addEventListener('mousemove', img.colorPickerMoveHandler);
            img.addEventListener('mouseleave', img.colorPickerLeaveHandler);

            // 设置图片样式，确保鼠标事件正常触发
            img.style.cursor = 'none';
            img.style.userSelect = 'none';
            img.draggable = false;
        }

        function showColorPickIndicator(x, y, color) {
            const indicator = document.createElement('div');
