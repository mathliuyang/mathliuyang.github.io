<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000000;
        }

        :root {
            --bg: #000000;
            --bg-secondary: #0A0A0A;
            --text: #ffffff;
            --text-dim: #9ca3af;
            --accent: #00FF88;
            --border: #1A1A1A;
            --card-bg: #0A0A0A;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00FF88;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li {
            list-style: none;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a.active {
            color: var(--accent) !important;
        }

        .nav-links.active {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* 移动端触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            .nav-links a:active {
                color: var(--text);
            }
        }

        .back-btn {
            display: inline-block;
            margin: 2rem 0;
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 4rem 4rem;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            color: var(--accent);
        }

        .header p {
            color: var(--text-dim);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .panel {
            border: 1px solid var(--border);
            padding: 2rem;
            background: var(--card-bg);
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .color-picker-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .color-input-wrapper {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .color-input {
            width: 50px;
            height: 40px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--bg-secondary);
        }

        .color-text {
            flex: 1;
            padding: 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
        }

        .generate-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: var(--bg);
            border: 1px solid var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        .generate-btn:hover {
            background: transparent;
            color: var(--accent);
        }

        .qr-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        #qrcode {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        #qrcode canvas {
            max-width: 100%;
            height: auto !important;
        }

        .empty-qr {
            color: var(--text-dim);
            text-align: center;
            padding: 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .logo {
                font-size: 0.9rem;
                text-align: center;
                margin-bottom: 0.5rem;
            }

            .nav-right {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .nav-links {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .container {
                padding: 100px 2rem 2rem;
            }

            .color-picker-group {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <nav id="nav">
        <div class="logo" onclick="location.href='../index.html'"><span style="color:#fff">AICore</span><span style="color:#00FF88">Scholar</span></div>
        <div class="nav-right">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">首页</a></li>
                <li><a href="./pinns-research.html">AI4PDEs 论文</a></li>
                <li><a href="./prompt-generator.html">智核提示词</a></li>

    <!-- <div style="margin-bottom: 4rem;"></div> -->

    <div class="container">
        <div class="header">
            <h1>二维码生成器</h1>
            <p>快速生成自定义二维码</p>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2 class="panel-title">配置</h2>

                <div class="form-group">
                    <label class="form-label">内容</label>
                    <textarea class="form-textarea" id="qrContent" placeholder="输入文本、URL或其他内容..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">颜色配置</label>
                    <div class="color-picker-group">
                        <div>
                            <div class="form-label" style="margin-bottom: 0.5rem;">前景色</div>
                            <div class="color-input-wrapper">
                                <input type="color" class="color-input" id="fgColor" value="#000000">
                                <input type="text" class="color-text" id="fgText" value="#000000" readonly>
                            </div>
                        </div>
                        <div>
                            <div class="form-label" style="margin-bottom: 0.5rem;">背景色</div>
                            <div class="color-input-wrapper">
                                <input type="color" class="color-input" id="bgColor" value="#ffffff">
                                <input type="text" class="color-text" id="bgText" value="#ffffff" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">尺寸</label>
                    <input type="number" class="form-input" id="qrSize" value="300" min="100" max="1000" step="50">
                </div>

                <button class="generate-btn" id="generateBtn">生成二维码</button>
            </div>

            <div class="panel">
                <h2 class="panel-title">预览</h2>
                <div class="qr-display">
                    <div id="qrcode">
                        <div class="empty-qr">
                            <div class="empty-icon">📱</div>
                            <p>输入内容后点击生成</p>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn" id="downloadBtn" disabled>下载PNG</button>
                        <button class="action-btn" id="copyBtn" disabled>复制图片</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // ==========================================
        // Particle System (Three.js)
        // ==========================================
        const initParticles = () => {
            const container = document.getElementById('particle-canvas');
            const scene = new THREE.Scene();
            scene.background = null;
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.z = 45;
            
            const renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);

            const spacing = 0.45;
            const width = 280;
            const height = 140;
            const cols = Math.floor(width / spacing);
            const rows = Math.floor(height / spacing);
            const particleCount = cols * rows;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const randoms = new Float32Array(particleCount);

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const idx = (i * rows + j);
                    positions[idx * 3] = (i - cols / 2) * spacing;
                    positions[idx * 3 + 1] = (j - rows / 2) * spacing;
                    positions[idx * 3 + 2] = 0.0;
                    randoms[idx] = Math.random();
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 },
                    uMousePos: { value: new THREE.Vector2(-999, -999) },
                    uMouseForce: { value: 0.0 },
                    uPixelRatio: { value: pixelRatio }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec2 uMousePos;
                    uniform float uMouseForce;
                    uniform float uPixelRatio;
                    attribute float aRandom;
                    varying vec3 vColor;
                    varying float vAlpha;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                    float snoise(vec3 v) {
                        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                        vec3 i  = floor(v + dot(v, C.yyy));
                        vec3 x0 = v - i + dot(i, C.xxx);
                        vec3 g = step(x0.yzx, x0.xyz);
                        vec3 l = 1.0 - g;
                        vec3 i1 = min(g.xyz, l.zxy);
                        vec3 i2 = max(g.xyz, l.zxy);
                        vec3 x1 = x0 - i1 + C.xxx;
                        vec3 x2 = x0 - i2 + C.yyy;
                        vec3 x3 = x0 - D.yyy;
                        i = mod289(i);
                        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                        float n_ = 0.142857142857;
                        vec3 ns = n_ * D.wyz - D.xzx;
                        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                        vec4 x_ = floor(j * ns.z);
                        vec4 y_ = floor(j - 7.0 * x_);
                        vec4 x = x_ *ns.x + ns.yyyy;
                        vec4 y = y_ *ns.x + ns.yyyy;
                        vec4 h = 1.0 - abs(x) - abs(y);
                        vec4 b0 = vec4(x.xy, y.xy);
                        vec4 b1 = vec4(x.zw, y.zw);
                        vec4 s0 = floor(b0)*2.0 + 1.0;
                        vec4 s1 = floor(b1)*2.0 + 1.0;
                        vec4 sh = -step(h, vec4(0.0));
                        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                        vec3 p0 = vec3(a0.xy,h.x);
                        vec3 p1 = vec3(a0.zw,h.y);
                        vec3 p2 = vec3(a1.xy,h.z);
                        vec3 p3 = vec3(a1.zw,h.w);
                        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                        m = m * m;
                        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                    }

                    void main() {
                        vec3 pos = position;
                        float waveSpeed = 0.15;
                        float waveFreq = 0.008;
                        float waveX = pos.x * waveFreq - uTime * waveSpeed;
                        float waveY = pos.y * waveFreq * 0.5;

                        float mainWave = sin(waveX + snoise(vec3(waveY, 0.0, uTime * 0.02)) * 2.0);
                        float subWave = sin(waveX * 2.5 + uTime * 0.3) * 0.5 + 0.5;
                        float verticalWave = sin(pos.y * 0.01 + uTime * 0.2) * 0.3;
                        float combinedWave = mainWave * 0.6 + subWave * 0.3 + verticalWave * 0.1;

                        float noise = snoise(vec3(pos.x * 0.005, pos.y * 0.005, uTime * 0.03));
                        combinedWave += noise * 0.2;

                        float travelWave = sin(waveX * 3.0 + noise * 2.0);
                        float visibilityThreshold = 0.2 + travelWave * 0.3;
                        float particlePhase = sin(waveX * 5.0 + pos.y * 0.01 + uTime * 0.5 + aRandom * 3.14);
                        float isVisible = step(visibilityThreshold, particlePhase);

                        float dist = distance(pos.xy, uMousePos);
                        float glowForce = exp(-(dist * dist) / 80.0) * uMouseForce;
                        glowForce *= 0.8 + 0.2 * sin(uTime * 4.0 - dist * 0.1);

                        float colorPhase = sin(waveX + uTime * 0.1);
                        float isGreen = step(0.0, colorPhase + (aRandom - 0.5) * 0.6);

                        vec3 cGray = vec3(0.2, 0.2, 0.22);
                        vec3 cDarkGreen = vec3(0.0, 0.5, 0.28);
                        vec3 cBrightGreen = vec3(0.0, 0.75, 0.42);

                        vec3 baseColor = mix(cGray, cDarkGreen, isGreen);
                        float waveFront = smoothstep(0.3, 0.7, particlePhase - visibilityThreshold);
                        baseColor = mix(baseColor, cBrightGreen, waveFront * 0.4);

                        vec3 cHighlight = vec3(0.0, 0.9, 0.5);
                        vColor = mix(baseColor, cHighlight, glowForce * 0.6);

                        float fadeInOut = sin(waveX * 2.0 + uTime * 0.3) * 0.5 + 0.5;
                        float baseAlpha = 0.4 + fadeInOut * 0.4;
                        float breathe = 0.7 + 0.3 * sin(uTime * 3.0 + aRandom * 6.28);

                        vAlpha = isVisible * baseAlpha * breathe;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = uPixelRatio * 4.0 * (45.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vAlpha;
                    void main() {
                        if (vAlpha < 0.05) discard;
                        gl_FragColor = vec4(vColor, vAlpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: false
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

            const targetWorldMouse = new THREE.Vector3(0, 0, 0);
            const currentWorldMouse = new THREE.Vector3(0, 0, 0);

            let targetForce = 0.0;
            let currentForce = 0.0;
            let interactionTimeout;
            let isFirstMove = true;

            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(targetPlane, targetWorldMouse);

                if (isFirstMove) {
                    currentWorldMouse.copy(targetWorldMouse);
                    isFirstMove = false;
                }
                targetForce = 1.0;
                clearTimeout(interactionTimeout);
                interactionTimeout = setTimeout(() => {
                    targetForce = 0.0;
                }, 500);
            });

            window.addEventListener('mouseout', () => {
                targetForce = 0.0;
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                currentWorldMouse.lerp(targetWorldMouse, 0.15);
                currentForce += (targetForce - currentForce) * 0.05;
                material.uniforms.uTime.value = clock.getElapsedTime();
                material.uniforms.uMousePos.value.set(currentWorldMouse.x, currentWorldMouse.y);
                material.uniforms.uMouseForce.value = currentForce;
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // Initialize particles
        initParticles();

        // Navbar scroll effect
        const navbar = document.querySelector('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Color pickers
        const fgColor = document.getElementById('fgColor');
        const bgColor = document.getElementById('bgColor');
        const fgText = document.getElementById('fgText');
        const bgText = document.getElementById('bgText');

        fgColor.addEventListener('input', (e) => {
            fgText.value = e.target.value;
        });

        bgColor.addEventListener('input', (e) => {
            bgText.value = e.target.value;
        });

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        if (mobileMenuBtn && navLinks) {
            mobileMenuBtn.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                mobileMenuBtn.classList.toggle('active');
            });

            // Close menu when clicking on a link
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }

        // QR Code generation
        let qrcode = null;

        document.getElementById('generateBtn').addEventListener('click', generateQR);

        function generateQR() {
            const content = document.getElementById('qrContent').value.trim();

            if (!content) {
                alert('请输入内容');
                return;
            }

            const size = parseInt(document.getElementById('qrSize').value);
            const fg = fgColor.value;
            const bg = bgColor.value;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            qrcode = new QRCode(qrContainer, {
                text: content,
                width: size,
                height: size,
                colorDark: fg,
                colorLight: bg,
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('copyBtn').disabled = false;
        }

        // Download
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL();
                link.click();
            }
        });

        // Copy to clipboard
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                try {
                    canvas.toBlob(async (blob) => {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        alert('二维码已复制到剪贴板');
                    });
                } catch (err) {
                    alert('复制失败，请使用下载功能');
                }
            }
        });

        // Enter key to generate
        document.getElementById('qrContent').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });
    </script>
</body>

</html>
