<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Master - 沉浸式终端训练</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Ubuntu+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        .font-win {
            font-family: 'Consolas', 'Microsoft YaHei', sans-serif;
        }

        .font-mac {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        }

        .font-linux {
            font-family: 'Ubuntu', 'Ubuntu Mono', sans-serif;
        }

        .mono-win {
            font-family: 'Consolas', monospace;
        }

        .mono-mac {
            font-family: 'JetBrains Mono', 'Menlo', monospace;
        }

        .mono-linux {
            font-family: 'Ubuntu Mono', 'Fira Code', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .animate-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }

        @keyframes slide-in-left {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-slide-in {
            animation: slide-in-left 0.3s ease-out forwards;
        }

        .glass-mac {
            background: rgba(40, 40, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-win {
            background: rgba(32, 32, 32, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Navigation styles to match other tools */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #666666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #ffffff;
        }

        .theme-btn:hover {
            border-color: #ffffff;
            transform: scale(1.1);
        }

        /* Responsive navigation */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 2rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 h-screen flex flex-col">

    <nav>
        <div class="logo" onclick="location.href='../index.html'">图灵的猫 X 智核学术</div>
        <div class="nav-right">

    <div id="app" class="flex-1 flex flex-col h-full relative overflow-hidden" style="padding-top: 80px;"></div>

    <script>
        // --- 图标资源 (SVG) ---
        const ICONS = {
            // 修复：Windows 11 风格田字格图标
            winLogo: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4V4zm0 9h7v7H4v-7zm9-9h7v7h-7V4zm0 9h7v7h-7v-7z"/></svg>`,
            appleLogo: `<svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 52.3-11.4 69.5-34.3z"/></svg>`,
            linuxLogo: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.47 12.7c-.13-.37-1.61-2.19-3.41-1.87-1.16.19-2.47 1.34-2.84 2.16-.38.81.44 2.78.34 3.03-.09.25-1.06 1-2.59.84-1.53-.16-1.34-1.19-1.34-1.59 0-.41-.53-1.25-1-1.81-.47-.56-1.63-1.72-2.25-1.06-.62.65.66 3.37.66 4.31 0 .94-1.69 1.47-1.25 4.69.26 1.92 2.44 1.59 2.44 1.59s1.37-2.62 4.4-1.25c3.03 1.37 3.38 2.62 5.09 1.13 1.72-1.5 1.53-2.62 2.19-6.44.66-3.81-.31-3.37-.44-3.73M5.15 15.68c-.29-.68-.82-2.63.47-4.13 1.28-1.5 3.47-1.59 4.37-1.09.91.5 1.47 1.16 1.28.16-.19-1.22-.84-4.81 2.31-7.13 3.16-2.31 5.91-.72 6.13 1.09.22 1.81-1.56 5.34-2.22 6.5-.66 1.16.03 1.97.03 1.97s1.44-1.09 2.53-.25c1.09.84 1.81 3.97 1.03 5.44-.78 1.47-2.03.78-2.03.78s.72 2.84-2.22 3.06c-2.94.22-1.94-3.12-1.94-3.12s-1.84 3.47-5.59 2.34c-3.75-1.12-1.97-4.22-1.97-4.22s-2.09.22-2.18-1.4z"/></svg>`,
            folder: `<svg viewBox="0 0 24 24" fill="currentColor" class="text-yellow-400"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>`,
            file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
            server: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`,
            chevronRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`
        };

        // --- 智能自动补全系统 ---
        const AutoComplete = {
            // 获取所有可用命令
            getAllCommands() {
                const os = state.os;
                const commands = new Set();

                // 基础命令
                Object.keys(os.commands).forEach(cmd => {
                    commands.add(cmd);
                    // 添加命令映射（如 dir -> ls）
                    if (typeof os.commands[cmd] === 'string') {
                        commands.add(os.commands[cmd]);
                    }
                });

                // 通用命令
                const universalCommands = [
                    'git', 'make', 'gcc', 'g++', 'gdb', 'valgrind', 'strace', 'ltrace',
                    'htop', 'vim', 'nano', 'emacs', 'less', 'more', 'head', 'tail',
                    'tar', 'gzip', 'gunzip', 'zip', 'unzip', 'curl', 'wget',
                    'docker', 'kubectl', 'npm', 'yarn', 'pnpm', 'pip', 'pip3',
                    'node', 'python', 'python3', 'ruby', 'go', 'rust', 'cargo',
                    'terraform', 'ansible', 'vagrant', 'packer'
                ];
                universalCommands.forEach(cmd => commands.add(cmd));

                return Array.from(commands).sort();
            },

            // 获取文件类型图标
            getFileIcon(filename, isDir = false) {
                if (isDir) return '📁';

                const ext = filename.split('.').pop().toLowerCase();
                const fileIcons = {
                    'js': '📄', 'ts': '📘', 'jsx': '⚛️', 'tsx': '⚛️', 'py': '🐍', 'java': '☕',
                    'cpp': '⚙️', 'c': '⚙️', 'h': '📋', 'hpp': '📋', 'cs': '🔷', 'php': '🐘',
                    'rb': '💎', 'go': '🐹', 'rs': '🦀', 'swift': '🦉', 'kt': '🟣', 'scala': '🔴',
                    'json': '📋', 'xml': '📋', 'yaml': '📋', 'yml': '📋', 'toml': '📋', 'ini': '📋',
                    'conf': '⚙️', 'config': '⚙️', 'env': '🔐', 'properties': '⚙️',
                    'md': '📝', 'txt': '📝', 'pdf': '📕', 'doc': '📘', 'docx': '📘', 'ppt': '📗',
                    'html': '🌐', 'css': '🎨', 'scss': '🎨', 'sass': '🎨', 'less': '🎨',
                    'csv': '📊', 'xls': '📊', 'xlsx': '📊', 'sql': '🗄️', 'db': '🗄️',
                    'zip': '📦', 'tar': '📦', 'gz': '📦', 'bz2': '📦', 'xz': '📦', '7z': '📦', 'rar': '📦',
                    'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'svg': '🖼️', 'ico': '🖼️',
                    'sh': '🐚', 'bash': '🐚', 'zsh': '🐚', 'fish': '🐚', 'ps1': '🔵',
                    'gitignore': '🚫', 'dockerfile': '🐳', 'makefile': '🔨'
                };

                return fileIcons[ext] || '📄';
            },

            // 获取文件和目录补全
            getFileCompletions(partial) {
                const completions = [];

                // 解析路径 - 支持相对路径和绝对路径
                const pathParts = partial.split(/[/\\]/).filter(p => p);
                const filePart = pathParts.length > 0 ? pathParts[pathParts.length - 1] : '';
                const dirPath = pathParts.slice(0, -1);

                // 确定要搜索的目录
                let searchDir = state.currNode;
                let isAbsolute = false;

                // 处理绝对路径
                if (partial.startsWith('/') || partial.startsWith('\\')) {
                    isAbsolute = true;
                    searchDir = state.fs;
                    dirPath.shift(); // 移除空的第一部分
                }

                // 导航到目标目录
                if (dirPath.length > 0) {
                    const targetPath = isAbsolute ? dirPath : resolvePath(state.path, dirPath.join('/'), '/');
                    searchDir = getNode(state.fs, targetPath);
                }

                if (!searchDir || !searchDir.children) return completions;

                const items = Object.keys(searchDir.children);
                const isHidden = filePart.startsWith('.') || filePart === '';

                // 特殊处理：如果输入的是路径分隔符，显示目录内容
                if (partial.endsWith('/') || partial.endsWith('\\')) {
                    items.forEach(item => {
                        const shouldShow = isHidden || !item.startsWith('.');
                        if (shouldShow) {
                            const node = searchDir.children[item];
                            const suffix = node.type === 'dir' ? '/' : '';
                            completions.push(item + suffix);
                        }
                    });
                } else {
                    // 正常文件名补全
                    items.forEach(item => {
                        const shouldShow = isHidden || !item.startsWith('.');
                        if (shouldShow && item.startsWith(filePart)) {
                            const node = searchDir.children[item];
                            const suffix = node.type === 'dir' ? '/' : '';

                            // 构建完整路径
                            let fullPath = item + suffix;
                            if (dirPath.length > 0) {
                                const separator = partial.includes('\\') ? '\\' : '/';
                                fullPath = dirPath.join(separator) + separator + fullPath;
                            }

                            completions.push(fullPath);
                        }
                    });
                }

                // 添加父目录导航选项
                if (filePart === '' || '..'.startsWith(filePart)) {
                    completions.push('..');
                }

                return completions.sort();
            },

            // 获取Git命令补全
            getGitCompletions(partial, subcommand) {
                const gitCommands = [
                    'init', 'clone', 'add', 'commit', 'push', 'pull', 'fetch',
                    'status', 'log', 'branch', 'checkout', 'merge', 'rebase',
                    'reset', 'revert', 'diff', 'show', 'tag', 'stash',
                    'remote', 'config', 'help', 'version'
                ];

                const gitOptions = {
                    'add': ['-A', '--all', '-u', '--update', '-p', '--patch'],
                    'commit': ['-m', '--message', '-a', '--all', '--amend'],
                    'push': ['--force', '--tags', '--set-upstream', '-u'],
                    'pull': ['--rebase', '--no-rebase', '--all'],
                    'branch': ['-a', '--all', '-r', '--remote', '-d', '--delete'],
                    'checkout': ['-b', '--branch', '-B', '--force'],
                    'log': ['--oneline', '--graph', '--all', '--pretty', '-n'],
                    'diff': ['--cached', '--staged', '--name-only', '--stat'],
                    'status': ['--short', '--branch', '--porcelain'],
                    'merge': ['--no-ff', '--squash', '--abort'],
                    'rebase': ['--interactive', '--continue', '--abort', '--skip']
                };

                if (!subcommand) {
                    return gitCommands.filter(cmd => cmd.startsWith(partial));
                } else if (gitOptions[subcommand]) {
                    return gitOptions[subcommand].filter(opt => opt.startsWith(partial));
                }

                return [];
            },

            // 获取包管理器命令补全
            getPackageCompletions(manager, partial, subcommand) {
                const packageCommands = {
                    'brew': ['install', 'uninstall', 'update', 'upgrade', 'search', 'info', 'list', 'cleanup'],
                    'apt': ['update', 'upgrade', 'install', 'remove', 'search', 'show', 'list', 'autoremove'],
                    'apt-get': ['update', 'upgrade', 'install', 'remove', 'purge', 'autoremove', 'clean'],
                    'snap': ['install', 'remove', 'refresh', 'list', 'info', 'search', 'classic'],
                    'choco': ['install', 'uninstall', 'upgrade', 'search', 'list', 'info', 'outdated'],
                    'scoop': ['install', 'uninstall', 'update', 'search', 'list', 'info', 'status'],
                    'winget': ['install', 'uninstall', 'upgrade', 'search', 'show', 'list', 'export'],
                    'npm': ['install', 'uninstall', 'update', 'search', 'list', 'info', 'outdated', 'audit'],
                    'yarn': ['add', 'remove', 'upgrade', 'search', 'list', 'info', 'outdated'],
                    'pip': ['install', 'uninstall', 'list', 'show', 'search', 'freeze', 'check']
                };

                const managerCommands = packageCommands[manager] || [];
                if (!subcommand) {
                    return managerCommands.filter(cmd => cmd.startsWith(partial));
                }

                // 常用选项
                const commonOptions = ['--help', '--version', '--verbose', '--quiet'];
                return commonOptions.filter(opt => opt.startsWith(partial));
            },

            // 获取命令参数补全
            getCommandArgs(command, partial) {
                const commandArgs = {
                    'ls': ['-la', '-l', '-a', '-h', '--help'],
                    'dir': ['/w', '/p', '/s', '/b'],
                    'cat': ['-n', '-b', '-s', '-E'],
                    'type': [],
                    'rm': ['-rf', '-r', '-f', '-i'],
                    'del': ['/p', '/f', '/s', '/q'],
                    'cp': ['-r', '-f', '-i', '-v'],
                    'copy': [],
                    'mv': ['-f', '-i', '-n', '-v'],
                    'move': [],
                    'grep': ['-i', '-v', '-n', '-r', '-l'],
                    'findstr': ['/i', '/v', '/n', '/r', '/l'],
                    'tar': ['-xvf', '-cvf', '-xzvf', '-czvf'],
                    'curl': ['-O', '-L', '-s', '-v'],
                    'wget': ['-O', '-q', '-c', '-r'],
                    'docker': ['run', 'ps', 'images', 'build', 'exec', 'logs'],
                    'kubectl': ['get', 'describe', 'logs', 'exec', 'apply', 'delete'],
                    'npm': ['install', 'run', 'test', 'build', 'start'],
                    'yarn': ['add', 'remove', 'run', 'build', 'start'],
                    'pip': ['install', 'uninstall', 'list', 'show', 'freeze']
                };

                const args = commandArgs[command] || [];
                return args.filter(arg => arg.startsWith(partial));
            },

            // 智能补全分析
            analyzeContext(input) {
                const parts = input.trim().split(/\s+/);
                if (parts.length === 0) return { context: 'command', partial: '', command: null };

                const command = parts[0];
                const lastPart = parts[parts.length - 1] || '';

                // Git 命令上下文
                if (command === 'git' && parts.length > 1) {
                    const gitSubcommand = parts[1];
                    if (parts.length === 2) {
                        return { context: 'git', partial: lastPart, command: null, subcommand: null };
                    } else if (parts.length > 2) {
                        return { context: 'git-flag', partial: lastPart, command: 'git', subcommand: gitSubcommand };
                    }
                }

                // 包管理器上下文
                const packageManagers = ['brew', 'apt', 'apt-get', 'snap', 'choco', 'scoop', 'winget', 'npm', 'yarn', 'pip'];
                if (packageManagers.includes(command) && parts.length > 1) {
                    const subcommand = parts[1];
                    if (parts.length === 2) {
                        return { context: 'package', partial: lastPart, command: command, subcommand: null };
                    } else {
                        return { context: 'package-flag', partial: lastPart, command: command, subcommand: subcommand };
                    }
                }

                // 文件路径补全（检测特定命令）
                const fileCommands = [
                    // 查看文件内容
                    'cat', 'type', 'less', 'more', 'head', 'tail', 'vim', 'nano', 'emacs', 'code', 'subl',
                    // 文件操作
                    'rm', 'del', 'cp', 'copy', 'mv', 'move', 'rename', 'touch', 'mkdir', 'rmdir', 'rd',
                    // 搜索和过滤
                    'grep', 'findstr', 'find', 'awk', 'sed', 'sort', 'uniq', 'wc',
                    // 压缩和归档
                    'tar', 'zip', 'unzip', 'gzip', 'gunzip', 'bzip2', 'bunzip2', 'xz', 'unxz',
                    // 下载工具
                    'curl', 'wget', 'aria2c',
                    // 版本控制
                    'git', 'svn', 'hg',
                    // 系统工具
                    'chmod', 'chown', 'chgrp', 'lsattr', 'chattr',
                    // 开发工具
                    'node', 'python', 'python3', 'ruby', 'perl', 'php', 'go', 'rustc', 'gcc', 'g++', 'make',
                    // 其他
                    'file', 'which', 'whereis', 'locate', 'updatedb'
                ];

                if (fileCommands.includes(command) && parts.length > 1) {
                    // 检查最后一个参数是否像文件路径（不是选项）
                    if (lastPart && !lastPart.startsWith('-') && !lastPart.startsWith('--')) {
                        return { context: 'file', partial: lastPart, command: command };
                    }
                }

                // 特殊处理：cd 命令也支持路径补全
                if (command === 'cd' && parts.length > 1) {
                    return { context: 'file', partial: lastPart, command: command };
                }

                // 命令参数补全
                if (parts.length > 1) {
                    return { context: 'flag', partial: lastPart, command: command };
                }

                // 默认命令补全
                return { context: 'command', partial: lastPart, command: null };
            },

            // 获取补全建议
            getCompletions(input) {
                const { context, partial, command, subcommand } = this.analyzeContext(input);
                let completions = [];

                switch (context) {
                    case 'command':
                        completions = this.getAllCommands();
                        break;
                    case 'git':
                        completions = this.getGitCompletions(partial);
                        break;
                    case 'git-flag':
                        completions = this.getGitCompletions(partial, subcommand);
                        break;
                    case 'package':
                        completions = this.getPackageCompletions(command, partial);
                        break;
                    case 'package-flag':
                        completions = this.getPackageCompletions(command, partial, subcommand);
                        break;
                    case 'file':
                        completions = this.getFileCompletions(partial);
                        break;
                    case 'flag':
                        completions = this.getCommandArgs(command, partial);
                        break;
                    default:
                        completions = [];
                }

                // 过滤和排序
                return completions
                    .filter(item => item.toLowerCase().startsWith(partial.toLowerCase()))
                    .sort((a, b) => {
                        // 优先显示完全匹配前缀的
                        const aStarts = a.toLowerCase().startsWith(partial.toLowerCase());
                        const bStarts = b.toLowerCase().startsWith(partial.toLowerCase());
                        if (aStarts && !bStarts) return -1;
                        if (!aStarts && bStarts) return 1;
                        return a.localeCompare(b);
                    });
            },

            // 应用补全 - 修复字符重复问题
            applyCompletion(input, completion) {
                // 处理空输入
                if (!input || input.trim() === '') {
                    return completion;
                }

                // 保留原始输入的尾部空格
                const trailingSpace = input.endsWith(' ') ? ' ' : '';
                const parts = input.trim().split(/\s+/);

                if (parts.length === 0) {
                    return completion + trailingSpace;
                }

                const lastPart = parts[parts.length - 1];

                // 防止重复补全：检查补全是否已经存在于输入中
                if (lastPart === completion) {
                    return input; // 避免重复
                }

                // 计算基础输入（移除最后一个部分）
                const lastPartStart = input.lastIndexOf(lastPart);
                const baseInput = input.slice(0, lastPartStart);

                // 智能处理空格
                const needsSpace = !completion.startsWith('-') &&
                    parts.length > 1 &&
                    !trailingSpace &&
                    !completion.endsWith('/'); // 目录补全不需要额外空格

                return baseInput + completion + (needsSpace ? ' ' : '') + trailingSpace;
            }

            let curr = root;
            for (const p of pathArr) {
                if (curr?.children?.[p]) curr = curr.children[p];
                else return null;
            }
            return curr;
        }

        function resolvePath(currPath, targetStr, separator) {
            if (!targetStr) return currPath;
            if (targetStr.startsWith(separator)) return targetStr.split(separator).filter(p => p);
            let parts = targetStr.split(/[/\\]/).filter(p => p);
            let newPath = [...currPath];
            for (const p of parts) {
                if (p === '.') continue;
                if (p === '..') { if (newPath.length > 0) newPath.pop(); }
                else newPath.push(p);
            }
            return newPath;
        }

        function generateTree(node, prefix = '') {
            let output = '';
            const keys = Object.keys(node.children || {}).sort();
            keys.forEach((k, i) => {
                const isLast = i === keys.length - 1;
                const connector = isLast ? '└── ' : '├── ';
                const item = node.children[k];
                output += `${prefix}${connector}${k}${item.type === 'dir' ? '/' : ''}\n`;
                if (item.type === 'dir') {
                    output += generateTree(item, prefix + (isLast ? '    ' : '│   '));
                }
            });
            return output || '(empty)';
        }

                                <div class="w-16 h-16 mb-6 ${os.iconColor || 'text-white'} group-hover:scale-110 transition-transform">

                                <p class="text-gray-500 text-sm font-mono mb-4">Prompt: ${os.id === 'linux' ? '$' : os.id === 'macos' ? '%' : '>'}</p>
                                <div class="text-xs text-gray-400 flex flex-wrap gap-2">

        }

        function renderGame() {

            const style = os.style;

            if (style.windowControls === 'mac') {
                controls = `<div class="flex gap-2"><div class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></div><div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></div><div class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></div></div>`;

            } else {

            app.innerHTML = `
                <div class="flex h-full ${style.bg} ${style.fontUI} overflow-hidden">

                        <div class="h-12 flex items-center px-4 border-b border-white/5 bg-white/5">

                                ${ICONS.home} <span class="uppercase tracking-widest font-bold">Home</span>
                            </button>
                        </div>

                        <!-- 任务区域 (局部更新容器) -->
                        <div id="task-section" class="p-4 border-b border-white/5">
                            <!-- JS 填充内容 -->
                        </div>

                        <div class="flex-1 overflow-y-auto p-2">
                            <div class="text-[10px] uppercase text-gray-500 font-bold px-2 mb-2 tracking-wider">
                                ${state.isRemote ? 'Remote Server' : 'Local Disk'}
                            </div>
                            <div id="file-list" class="space-y-0.5"></div>
                        </div>
                    </div>

                    <!-- 右侧终端 -->
                    <div class="flex-1 flex flex-col relative z-10 min-w-0">
                        <div class="${style.header} flex items-center justify-between px-3 select-none">
                            ${style.windowControls === 'mac' ? controls : '<div class="w-10"></div>'}
                            <div class="text-xs font-medium opacity-80 flex items-center gap-2">
                                <div class="w-3 h-3">${os.id === 'windows' ? ICONS.winLogo : os.id === 'macos' ? ICONS.appleLogo : ICONS.linuxLogo}</div>
                                ${state.isRemote ? 'ssh root@server' : os.id === 'windows' ? 'Administrator: Command Prompt' : 'Terminal'}
                            </div>
                            ${style.windowControls === 'win' ? controls : '<div class="w-10"></div>'}
                        </div>

                        <div id="terminal" class="flex-1 ${style.term} ${style.fontMono} p-4 overflow-y-auto text-sm cursor-text" onclick="document.getElementById('input').focus()">
                            <div id="output" class="mb-2"></div>
                            
                            <div class="flex">
                                <span class="mr-2 whitespace-nowrap" id="prompt-span"></span>
                                <div class="relative flex-1">
                                    <input id="input" type="text" class="w-full bg-transparent border-none outline-none text-transparent caret-transparent absolute top-0 left-0" autocomplete="off" spellcheck="false" onkeydown="handleInput(event)" oninput="renderInput()">
                                    <div id="input-render" class="absolute top-0 left-0 pointer-events-none break-all whitespace-pre-wrap"></div>
                                    <span id="cursor" class="absolute top-0 w-0.5 h-5 bg-gray-300 opacity-90 animate-blink pointer-events-none"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 初始化内容
            renderTaskSection();
            updateUI();

            if (state.history.length === 0) {
                const welcome = os.id === 'windows' ? 'Microsoft Windows [Version 10.0.22631.3296]\n(c) Microsoft Corporation. All rights reserved.'
                    : os.id === 'macos' ? `Last login: ${new Date().toDateString()} on ttys000`
                        : `Welcome to Ubuntu 24.04 LTS (GNU/Linux 5.15.0-91-generic x86_64)`;
                appendLog(welcome, 'text-gray-500');

        }

        // --- 独立的任务渲染函数 (局部更新核心) ---
        function renderTaskSection() {
            const container = document.getElementById('task-section');
            if (!container) return;

            const scenario = scenarios.find(s => s.id === state.scenarioId);
            const level = scenario ? scenario.levels[state.levelIndex] : null;
            const os = state.os;
            const style = os.style;

            if (!scenario) {
                container.innerHTML = `
                    <div class="text-center p-4 border border-dashed border-gray-600 rounded-lg animate-fade-in">
                        <div class="text-xs text-gray-400 mb-2">自由模式</div>
                        <div class="flex flex-wrap gap-2 justify-center">
                            ${scenarios.map(s => `<button onclick="setScenario('${s.id}')" class="text-xs bg-white/10 hover:bg-white/20 px-2 py-1 rounded text-white transition-colors">${s.title}</button>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="bg-white/5 border border-white/10 rounded-lg p-4 animate-slide-in relative overflow-hidden group">
                        ${state.levelIndex >= scenario.levels.length ? `
                            <div class="text-center text-green-400 animate-fade-in">
                                <div class="text-xl font-bold mb-1">🎉 任务完成</div>
                                <button onclick="setScenario(null)" class="text-xs underline hover:text-white">返回</button>
                            </div>
                        ` : `
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] bg-blue-500/20 text-blue-300 px-1.5 py-0.5 rounded uppercase font-bold tracking-wider">L${state.levelIndex + 1}</span>
                                <span class="text-xs text-gray-400">${level.title}</span>
                            </div>
                            <div class="text-sm text-gray-200 mb-3 font-medium leading-relaxed">${level.desc(os)}</div>
                            <div class="bg-black/30 p-2 rounded text-xs font-mono text-gray-400 border border-white/5 flex gap-2">
                                <span class="${style.accent}">$</span> ${typeof level.task === 'function' ? level.task(os) : level.task}
                            </div>
                        `}
                    </div>
                `;
            }
        }

        function selectOS(id) {
            state.osId = id;
            state.fs = deepClone(fsData[id]);
            state.path = [...state.os.home];
            state.scenarioId = null;
            state.levelIndex = 0;
            state.history = [];
            state.view = 'game';
            state.repl = null;
            render();
        }

        function setScenario(id) {
            state.scenarioId = id;
            state.levelIndex = 0;
            // 切换场景时重置渲染
            renderGame();
        }

        function updateUI() {
            const os = state.os;

            let promptStr;
            if (state.repl === 'node') promptStr = `<span class="text-green-500">></span>`;
            else if (state.repl === 'python') promptStr = `<span class="text-blue-500">>>></span>`;
            else promptStr = state.isRemote
                ? `<span class="text-green-400">root@server</span>:<span class="text-blue-400">/${state.remotePath.slice(1).join('/')}</span>#`
                : os.prompt(state.path);

            document.getElementById('prompt-span').innerHTML = promptStr;

            const listEl = document.getElementById('file-list');
            if (listEl) {
                const node = state.currNode;
                const children = Object.keys(node.children || {}).sort();

                const pathStr = (state.isRemote ? '/' : '') + state.path.join(os.sep);

                let html = `
                    <div class="px-2 py-1 mb-2 flex items-center gap-1 text-[10px] text-gray-500 border-b border-white/5">
                         ${ICONS.folder.replace('class="text-yellow-400"', 'class="w-3 h-3 text-gray-500"')}
                         <span class="truncate">${pathStr}</span>
                    </div>
                `;

                if (state.path.length > (state.isRemote ? 1 : os.home.length)) {
                    html += `
                        <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-white/10 text-xs text-gray-400 select-none">
                            <div class="w-4 flex justify-center">⤴</div>
                            <span>..</span>
                        </div>
                     `;
                }

                if (children.length === 0) {
                    html += `<div class="px-8 py-4 text-xs text-gray-600 italic">Empty Folder</div>`;
                } else {
                    html += children.map(name => {
                        const item = node.children[name];
                        const isDir = item.type === 'dir';
                        const icon = isDir ? ICONS.folder : ICONS.file;
                        const meta = isDir ? 'Folder' : (item.size || '1KB');

                        return `
                            <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-white/10 group cursor-default transition-colors">
                                <div class="w-4 h-4 flex-shrink-0 ${isDir ? '' : 'opacity-70'}">${icon}</div>
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-gray-300 truncate group-hover:text-white font-medium">${name}</div>
                                </div>
                                <div class="text-[10px] text-gray-600 group-hover:text-gray-500 tabular-nums">${meta}</div>
                            </div>
                        `;
                    }).join('');
                }
                listEl.innerHTML = html;
            }
        }

        function handleInput(e) {
            const input = e.target;

            // Tab 键补全 - 支持连续切换
            if (e.key === 'Tab') {
                e.preventDefault();
                playKeySound(); // 按键音效
                addTerminalEffect(); // 视觉反馈

                const currentInput = input.value;

                // 如果补全菜单已激活，切换到下一个建议
                if (state.completion.isActive && state.completion.suggestions.length > 0) {
                    navigateCompletions(e.shiftKey ? -1 : 1); // Shift+Tab 向上切换
                    return;
                }

                // 获取新的补全建议
                const completions = AutoComplete.getCompletions(currentInput);

                if (completions.length === 0) {
                    // 没有补全建议 - 添加轻微震动效果表示无结果
                    input.style.transform = 'translateX(2px)';
                    setTimeout(() => {
                        input.style.transform = 'translateX(0)';
                    }, 100);
                    return;
                } else if (completions.length === 1) {
                    // 只有一个补全建议，直接应用
                    const completed = AutoComplete.applyCompletion(currentInput, completions[0]);
                    input.value = completed;
                    renderInput();
                    hideCompletions();
                } else {
                    // 多个补全建议，显示补全列表并选择第一个
                    showCompletions(completions, currentInput);
                    state.completion.selectedIndex = 0;
                    highlightCompletionItem();
                }
                return;
            }

            // 方向键导航补全列表
            if (state.completion.isActive) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateCompletions(1);
                    return;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateCompletions(-1);
                    return;
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    applySelectedCompletion();
                    return;
                } else if (e.key === 'Escape') {
                    hideCompletions();
                    return;
                }
            }

            // 其他键隐藏补全列表
            if (e.key !== 'Tab' && state.completion.isActive) {
                hideCompletions();
            }

            // 历史命令导航 (只有在没有补全菜单时才启用)
            if (!state.completion.isActive) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory(1);
                    return;
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory(-1);
                    return;
                }
            }

            // Ctrl 组合键处理
            if (e.ctrlKey) {
                switch (e.key) {
                    case 'c':
                        e.preventDefault();
                        // Ctrl+C 中断当前操作 - 使用更强烈的音效
                        try {
                            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            const oscillator = audioContext.createOscillator();
                            const gainNode = audioContext.createGain();

                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);

                            oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                            oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.15);

                            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.15);
                        } catch (e) {
                            // 静默处理音频错误
                        }

                        // 视觉反馈 - 屏幕闪烁效果
                        const terminal = document.getElementById('terminal');
                        terminal.style.backgroundColor = 'rgba(255, 100, 100, 0.1)';
                        setTimeout(() => {
                            terminal.style.backgroundColor = '';
                        }, 150);

                        if (input.value || state.repl) {
                            appendLog('^C', 'text-gray-400');
                            input.value = '';
                            renderInput();
                            if (state.repl) {
                                state.repl = null;
                                appendLog('REPL interrupted', 'text-yellow-400');
                            }
                        } else {
                            appendLog('^C', 'text-gray-400');
                        }
                        return;

                    case 'd':
                        e.preventDefault();
                        // Ctrl+D 退出 (EOF)
                        if (!input.value) {
                            appendLog('logout', 'text-gray-400');
                            appendLog('[Process completed]', 'text-gray-500');
                            // 模拟退出，可以在这里添加重新启动逻辑
                            setTimeout(() => {
                                document.getElementById('output').innerHTML = '';
                                const os = state.os;
                                const welcome = os.id === 'windows' ? 'Microsoft Windows [Version 10.0.22631.3296]\n(c) Microsoft Corporation. All rights reserved.'
                                    : os.id === 'macos' ? `Last login: ${new Date().toDateString()} on ttys000`
                                        : `Welcome to Ubuntu 24.04 LTS (GNU/Linux 5.15.0-91-generic x86_64)`;
                                appendLog(welcome, 'text-gray-500');
                            }, 1500);
                        }
                        return;

                    case 'l':
                        e.preventDefault();
                        // Ctrl+L 清屏
                        document.getElementById('output').innerHTML = '';
                        return;

                    case 'a':
                        e.preventDefault();
                        // Ctrl+A 移动到行首
                        input.setSelectionRange(0, 0);
                        return;

                    case 'e':
                        e.preventDefault();
                        // Ctrl+E 移动到行尾
                        input.setSelectionRange(input.value.length, input.value.length);
                        return;

                    case 'u':
                        e.preventDefault();
                        // Ctrl+U 清除到行首
                        input.value = input.value.substring(input.selectionStart);
                        renderInput();
                        return;

                    case 'k':
                        e.preventDefault();
                        // Ctrl+K 清除到行尾
                        input.value = input.value.substring(0, input.selectionStart);
                        renderInput();
                        return;

                    case 'w':
                        e.preventDefault();
                        // Ctrl+W 删除前一个单词
                        const beforeCursor = input.value.substring(0, input.selectionStart);
                        const afterCursor = input.value.substring(input.selectionStart);
                        const words = beforeCursor.trim().split(/\s+/);
                        if (words.length > 0) {
                            words.pop();
                            const newBefore = words.join(' ') + (words.length > 0 ? ' ' : '');
                            input.value = newBefore + afterCursor;
                            input.setSelectionRange(newBefore.length, newBefore.length);
                            renderInput();
                        }
                        return;
                }
            }

            // 原有的 Enter 处理
            if (e.key === 'Enter') {
                e.preventDefault();
                playKeySound(); // 按键音效
                addTerminalEffect(); // 视觉反馈

                const cmd = e.target.value;
                if (cmd.trim()) {
                    // 将非空命令添加到历史记录
                    state.inputHistory.unshift(cmd);
                    // 限制历史记录数量
                    if (state.inputHistory.length > 100) {
                        state.inputHistory.pop();
                    }
                }
                // 重置历史索引
                state.historyIdx = -1;

                // 显示执行的命令
                const prompt = getPrompt();
                appendLog(prompt + cmd, 'text-gray-300');

                // Allow empty enters
                execute(cmd);
                e.target.value = '';
                renderInput();
                hideCompletions();
            }
        }

        // 获取当前提示符
        function getPrompt() {
            const os = state.os;
            const path = state.path.join(os.sep);
            const fullPath = (os.id === 'windows' ? 'C:\\' : '/') + path;

            if (os.id === 'windows') {
                return `C:\\${path}> `;
            } else if (os.id === 'macos') {
                const user = 'guest';
                const host = 'MacBook';
                const shortPath = state.path.length > 0 ? state.path[state.path.length - 1] : '~';
                return `${user}@${host}:${shortPath}$ `;
            } else {
                const user = 'guest';
                const host = 'ubuntu';
                const shortPath = state.path.length > 0 ? state.path[state.path.length - 1] : '~';
                return `${user}@${host}:${shortPath}$ `;
            }
        }

        // 历史命令导航函数
        function navigateHistory(direction) {
            const input = document.getElementById('input');

            if (state.inputHistory.length === 0) return;

            // 向上导航 (更早的历史命令)
            if (direction > 0) {
                if (state.historyIdx < state.inputHistory.length - 1) {
                    state.historyIdx++;
                    input.value = state.inputHistory[state.historyIdx];
                    renderInput();
                }
            }
            // 向下导航 (更新的历史命令)
            else if (direction < 0) {
                if (state.historyIdx > 0) {
                    state.historyIdx--;
                    input.value = state.inputHistory[state.historyIdx];
                    renderInput();
                } else if (state.historyIdx === 0) {
                    // 回到当前输入
                    state.historyIdx = -1;
                    input.value = '';
                    renderInput();
                }
            }
        }

        function renderInput() {
            const input = document.getElementById('input');
            const renderer = document.getElementById('input-render');
            const cursor = document.getElementById('cursor');
            renderer.textContent = input.value;
            const chWidth = 8.4;
            const width = input.value.length * chWidth;
            cursor.style.transform = `translateX(${width}px)`;

            // 输入时更新补全建议
            if (state.completion.isActive && input.value !== state.completion.lastInput) {
                updateCompletions(input.value);
            }
        }

        // --- 补全UI功能 ---
        function showCompletions(completions, currentInput) {
            state.completion.suggestions = completions;
            state.completion.selectedIndex = 0;
            state.completion.isActive = true;
            state.completion.lastInput = currentInput;

            const terminal = document.getElementById('terminal');
            let completionDiv = document.getElementById('completion-menu');

            // 移除旧的补全菜单
            if (completionDiv) {
                completionDiv.remove();
            }

            // 创建新的补全菜单
            completionDiv = document.createElement('div');
            completionDiv.id = 'completion-menu';
            completionDiv.className = 'absolute z-50 bg-gray-900 border border-gray-700 rounded-lg shadow-xl max-h-64 overflow-y-auto backdrop-blur-sm';
            completionDiv.style.cssText = 'top: 100%; left: 0; min-width: 250px; margin-top: 8px; font-family: inherit;';

            // 计算位置（在输入行下方）
            const inputLine = document.querySelector('#terminal > div.flex');
            if (inputLine) {
                const rect = inputLine.getBoundingClientRect();
                const terminalRect = terminal.getBoundingClientRect();
                completionDiv.style.top = (rect.bottom - terminalRect.top) + 'px';
                completionDiv.style.left = (rect.left - terminalRect.left) + 'px';
            }

            // 渲染补全项
            renderCompletionItems(completionDiv, completions);

            terminal.appendChild(completionDiv);
        }

        function renderCompletionItems(container, completions) {
            container.innerHTML = '';
            completions.forEach((completion, index) => {
                const item = document.createElement('div');
                item.className = 'px-3 py-2 text-sm cursor-pointer hover:bg-blue-600 transition-colors duration-150 flex items-center';

                // 添加图标和文本
                const icon = document.createElement('span');
                icon.className = 'mr-2 opacity-70';
                icon.textContent = this.getFileIcon ? this.getFileIcon(completion) : '📄';

                const text = document.createElement('span');
                text.textContent = completion;

                item.appendChild(icon);
                item.appendChild(text);

                if (index === state.completion.selectedIndex) {
                    item.classList.add('bg-blue-600', 'text-white');
                    item.classList.remove('hover:bg-blue-600');
                }

                item.addEventListener('click', () => {
                    applyCompletion(completion);
                });

                item.addEventListener('mouseenter', () => {
                    state.completion.selectedIndex = index;
                    highlightCompletionItem();
                });

                container.appendChild(item);
            });
        }

        function navigateCompletions(direction) {
            const maxIndex = state.completion.suggestions.length - 1;
            state.completion.selectedIndex += direction;

            if (state.completion.selectedIndex < 0) {
                state.completion.selectedIndex = maxIndex;
            } else if (state.completion.selectedIndex > maxIndex) {
                state.completion.selectedIndex = 0;
            }

            highlightCompletionItem();
        }

        function highlightCompletionItem() {
            const items = document.querySelectorAll('#completion-menu > div');
            items.forEach((item, index) => {
                if (index === state.completion.selectedIndex) {
                    item.classList.add('bg-blue-600');
                } else {
                    item.classList.remove('bg-blue-600');
                }
            });
        }

        function applySelectedCompletion() {
            if (state.completion.suggestions.length > 0) {
                const selected = state.completion.suggestions[state.completion.selectedIndex];
                applyCompletion(selected);
            }
        }

        function applyCompletion(completion) {
            const input = document.getElementById('input');
            const currentInput = input.value;
            const completed = AutoComplete.applyCompletion(currentInput, completion);

            input.value = completed;
            renderInput();

            // 延迟隐藏补全菜单，允许用户继续Tab切换
            setTimeout(() => {
                hideCompletions();
            }, 500);

            // 重新触发补全以显示下一个可能的补全
            setTimeout(() => {
                const newCompletions = AutoComplete.getCompletions(input.value);
                if (newCompletions.length > 0) {
                    showCompletions(newCompletions, input.value);
                }
            }, 100);
        }

        function updateCompletions(currentInput) {
            const completions = AutoComplete.getCompletions(currentInput);

            if (completions.length === 0) {
                hideCompletions();
            } else {
                showCompletions(completions, currentInput);
            }
        }

        function hideCompletions() {
            state.completion.isActive = false;
            state.completion.suggestions = [];
            state.completion.selectedIndex = 0;

            const completionDiv = document.getElementById('completion-menu');
            if (completionDiv) {
                completionDiv.remove();
            }
        }

        async function execute(rawCmd) {
            const args = rawCmd.trim().split(/\s+/);
            const cmd = args[0].toLowerCase();
            const params = args.slice(1);
            const os = state.os;

            // Handle REPL Mode
            if (state.repl) {
                const promptStr = state.repl === 'node' ? `>` : `>>>`;
                appendLog(`${promptStr} ${rawCmd}`, state.repl === 'node' ? 'text-green-500' : 'text-blue-500');

                if (['exit', 'quit', '.exit', 'exit()'].includes(rawCmd.trim())) {
                    state.repl = null;
                    appendLog(state.repl === 'python' ? '' : '(To exit, press Ctrl+C again or .exit)', 'text-gray-500');
                } else if (rawCmd.trim()) {
                    try {
                        if (rawCmd.startsWith('print') || rawCmd.startsWith('console.log')) {
                            const match = rawCmd.match(/["'](.+)["']/);
                            if (match) appendLog(match[1]);
                        } else if (['1+1', '2+2'].includes(rawCmd.replace(/\s/g, ''))) {
                            appendLog(eval(rawCmd));
                        } else {
                            appendLog(state.repl === 'node' ? 'undefined' : '');
                        }
                    } catch {
                        appendLog('Error', 'text-red-400');
                    }
                }
                updateUI();
                return;
            }

            // Normal Shell Mode
            const promptStr = state.isRemote ? `root@server#` : (os.id === 'windows' ? `${state.path.join('\\')}>` : `${os.id === 'macos' ? '%' : '$'}`);
            appendLog(`${promptStr} ${rawCmd}`, 'text-white font-bold');

            // 修复：使用 trim 后的命令进行校验
            state.lastCmd = rawCmd.trim();

            if (!rawCmd.trim()) return;

            let output = '';

            // Check cross-platform command mismatch hints
            if (!state.isRemote) {
                if (os.id === 'windows' && ['ls', 'clear', 'rm', 'cp', 'mv'].includes(cmd))
                    output = `'${cmd}' is not recognized. Did you mean '${os.commands[cmd] || 'dir'}'?`;
                else if (os.id !== 'windows' && ['dir', 'cls', 'del', 'copy', 'move'].includes(cmd))
                    output = `command not found: ${cmd}. Try '${os.commands[cmd] || 'ls'}'`;
            }

            if (!output) {
                switch (cmd) {
                    case 'cls': case 'clear':
                        document.getElementById('output').innerHTML = '';
                        return;
                    case 'dir': case 'ls': case 'll':
                        const list = Object.keys(state.currNode.children || {});
                        if (os.id === 'windows' && !state.isRemote && cmd === 'dir') {
                            output = list.map(k => {
                                const type = state.currNode.children[k].type === 'dir' ? '<DIR>' : '     ';

                            }).join('\n') || 'File Not Found';

                            output = list.join('  ');
                        }
                        break;
                    case 'cd':
                        if (!params[0]) { /* go home */ } else {
                            const newPath = resolvePath(state.path, params[0], os.sep);
                            if (getNode(state.fs, newPath)?.type === 'dir') state.path = newPath;

                    case 'mkdir':

                    case 'touch': case 'echo':

                        if (fName) state.currNode.children[fName] = { type: 'file', size: '0KB', content: args.slice(1).join(' ').split('>')[0].trim() };
                        break;
                    case 'rm': case 'del':

                        else output = 'File not found';
                        break;
                    case 'mv': case 'move':

                            const content = state.currNode.children[params[0]];
                            delete state.currNode.children[params[0]];
                            state.currNode.children[params[1]] = content;
                        } else output = 'File not found';

                    case 'cp': case 'copy':

                            state.currNode.children[params[1]] = deepClone(state.currNode.children[params[0]]);
                        } else output = 'File not found';
                        break;
                    case 'cat': case 'type':

                        break;

                        output = generateTree(state.currNode);

                        output = (state.isRemote ? '/' : '') + state.path.join(os.sep);

                    case 'strace':
                        if (!params[0]) output = "strace: must have PROG [ARGS] or -p PID";
                        else output = `execve("${params[0]}", ["${params[0]}"], [/* 50 vars */]) = 0\nbrk(NULL)                               = 0x55c3a1b2c000\narch_prctl(0x3001 /* ARCH_??? */, 0x7ffeefbff7f0) = -1 EINVAL (Invalid argument)\nmmap(NULL, 8192, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0) = 0x7f8c3b2a0000`;
                        break;

                    case 'ltrace':
                        if (!params[0]) output = "ltrace: cannot execute `': No such file or directory";
                        else output = `__libc_start_main(0x400526, 1, 0x7ffeefbff7f8, 0x400540 <unfinished ...>\n+++ exited (status 0) +++`;
                        break;

                    case 'xcodebuild':
                        if (!params[0]) output = "Usage: xcodebuild [-project <projectname>] [-scheme <schemeName>]...";
                        else if (params[0] === '-version') output = `Xcode 15.0\nBuild version 15A240d`;
                        else output = `=== BUILD TARGET MyApp OF PROJECT MyApp WITH CONFIGURATION Debug ===\nCheck dependencies\nWrite auxiliary files\nCompile Swift source files\nLink MyApp\nGenerateDSYMFile MyApp.app.dSYM\nTouch MyApp.app\n** BUILD SUCCEEDED **`;
                        break;

                    case 'codesign':
                        if (!params[0]) output = "Usage: codesign -s identity [-fv*] [-o flags] [-r reqs] [-i ident] path ...";
                        else output = `signed app: ${params.join(' ')}`;
                        break;

                    case 'powershell':
                        output = `Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.\n\nPS C:\\Users\\Guest> `;
                        break;

                    case 'pwsh':
                        output = `PowerShell 7.4.0\nCopyright (c) Microsoft Corporation.\n\nhttps://aka.ms/powershell\nType 'help' to get help.\n\nPS C:\\Users\\Guest> `;
                        break;

                    // 增强echo命令
                    case 'echo':
                        output = args.slice(1).join(' ') || '';
                        break;

                    default:
                        // 允许特定 OS 命令通过 (ipconfig, ifconfig 等)
                        if (cmd === os.commands.ip) {
                            output = os.id === 'windows' ? 'IPv4 Address. . . . . . . . . . . : 192.168.1.5' : 'eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\ninet 192.168.1.5';
                        } else if (cmd === os.commands.ping) {
                            const target = params[0] || 'localhost';
                            output = `PING ${target} (93.184.216.34): 56 data bytes\n64 bytes from 93.184.216.34: icmp_seq=0 ttl=56 time=11.632 ms\n64 bytes from 93.184.216.34: icmp_seq=1 ttl=56 time=12.134 ms\n64 bytes from 93.184.216.34: icmp_seq=2 ttl=56 time=11.987 ms\n64 bytes from 93.184.216.34: icmp_seq=3 ttl=56 time=12.001 ms\n\n--- ${target} ping statistics ---\n4 packets transmitted, 4 packets received, 0.0% packet loss\nround-trip min/avg/max/stddev = 11.632/11.939/12.134/0.189 ms`;
                        } else if (cmd === os.commands.tree) {
                            output = `.\n├── README.md\n├── src\n│   ├── main.js\n│   └── utils.js\n├── package.json\n└── node_modules\n    └── (dependencies)`;
                        } else if (cmd === os.commands.ver) {
                            output = os.id === 'windows' ? 'Microsoft Windows [Version 10.0.22631.3296]' : 'Ubuntu 24.04 LTS';
                        } else if (cmd === os.commands.whoami) {
                            output = os.id === 'windows' ? 'desktop-abc123\\guest' : 'guest';
                        } else if (cmd === os.commands.date) {
                            output = new Date().toString();
                        } else if (cmd === os.commands.grep) {
                            if (!params[0]) output = 'grep: missing operand';
                            else output = `Found pattern '${params[0]}' in multiple files`;
                        } else if (cmd === os.commands.man) {
                            if (!params[0]) output = 'What manual page do you want?';
                            else output = `${params[0]}(1)                   User Commands                  ${params[0]}(1)\n\nNAME\n       ${params[0]} - command description\n\nSYNOPSIS\n       ${params[0]} [OPTION]... [FILE]...\n\nDESCRIPTION\n       This is a simulated manual page for ${params[0]}.\n\nOPTIONS\n       --help     display this help and exit\n       --version  output version information and exit`;
                        } else if (cmd === 'cls' && os.id === 'windows') {
                            document.getElementById('output').innerHTML = '';
                            output = '';
                        } else if (cmd === 'clear' && os.id !== 'windows') {
                            document.getElementById('output').innerHTML = '';
                            output = '';
                        } else {
                            output = `command not found: ${cmd}`;
                        }
                }
            }

            if (output) appendLog(output, 'text-gray-400');
            updateUI();

            // 修复：局部更新机制
            if (state.scenarioId) {
                const s = scenarios.find(i => i.id === state.scenarioId);
                const l = s.levels[state.levelIndex];
                if (l && l.validate(state)) {
                    // 1. 终端提示成功
                    appendLog(`✓ Task Completed: ${l.title}`, 'text-green-400 font-bold');

                    // 2. 更新数据
                    state.levelIndex++;

                    // 3. 检查是否通关整个场景
                    if (state.levelIndex >= s.levels.length) {
                        appendLog(`🎉 Scenario Complete!`, 'text-yellow-400 font-bold');
                    }

                    // 4. 只刷新侧边栏任务区域，保留终端历史
                    renderTaskSection();
                }
            }
        }

        function appendLog(text, className = 'text-gray-300') {
            const out = document.getElementById('output');
            const div = document.createElement('div');
            div.className = `whitespace-pre-wrap mb-1 ${className}`;
            div.textContent = text;
            out.appendChild(div);
            document.getElementById('terminal').scrollTop = document.getElementById('terminal').scrollHeight;
        }

        // 添加音效反馈功能
        function playKeySound() {
            // 创建简单的按键音效
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                // 如果音频API不支持，静默处理
            }
        }

        // 添加视觉反馈效果
        function addTerminalEffect() {
            const terminal = document.getElementById('terminal');
            terminal.style.filter = 'brightness(1.1)';
            setTimeout(() => {
                terminal.style.filter = 'brightness(1)';
            }, 50);
        }

        // 启动
        render();

        // 主题切换功能
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');

        // 设置初始主题
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (currentTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '◑';
            themeIcon.style.color = '#000000';
        } else {
            themeIcon.textContent = '◐';
            themeIcon.style.color = '#ffffff';
        }

        // 主题切换事件
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            themeIcon.textContent = newTheme === 'dark' ? '◐' : '◑';
            themeIcon.style.color = newTheme === 'dark' ? '#ffffff' : '#000000';
        });

    </script>
</body>
