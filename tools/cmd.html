<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Master - 沉浸式终端训练</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Ubuntu+Mono:wght@400;700&display=swap');

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        /* Windows 11 字体系统 - 现代化无衬线 */
        .font-win {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* macOS 字体系统 - 优雅简洁 */
        .font-mac {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* Linux 字体系统 - 技术感等宽 */
        .font-linux {
            font-family: 'Ubuntu', 'Ubuntu Sans', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* 等宽字体优化 */
        .mono-win {
            font-family: 'Cascadia Code', 'Consolas', 'Microsoft YaHei', monospace;
            font-weight: 450;
            font-feature-settings: 'liga' 1, 'calt' 1;
        }

        .mono-mac {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-weight: 400;
            font-feature-settings: 'liga' 1, 'calt' 1;
        }

        .mono-linux {
            font-family: 'Ubuntu Mono', 'Fira Code', 'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace;
            font-weight: 400;
            font-feature-settings: 'liga' 1, 'calt' 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .animate-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }

        @keyframes slide-in-left {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-slide-in {
            animation: slide-in-left 0.3s ease-out forwards;
        }

        /* 学习界面增强动画 */
        @keyframes pulse-success {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .animate-pulse-success {
            animation: pulse-success 0.6s ease-in-out;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .shimmer-effect {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* 进度条动画 */
        @keyframes progress-glow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
            }

            50% {
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            }
        }

        .progress-glow {
            animation: progress-glow 2s ease-in-out infinite;
        }

        /* 操作系统特定主题配色 */

        /* Windows 11 主题 - 现代化蓝调 */
        .theme-win {
            --primary-color: #0078d4;
            --secondary-color: #106ebe;
            --accent-color: #40e0d0;
            --success-color: #0b6a0b;
            --warning-color: #ff8c00;
            --error-color: #d13438;
            --info-color: #0078d4;
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 120, 212, 0.3);
            /* RGB值用于高级动画 */
            --primary-rgb: 0, 120, 212;
            --accent-rgb: 64, 224, 208;
            --success-rgb: 11, 106, 11;
            --warning-rgb: 255, 140, 0;
            --error-rgb: 209, 52, 56;
        }

        /* macOS 主题 - 优雅简洁 */
        .theme-mac {
            --primary-color: #0a84ff;
            --secondary-color: #0066cc;
            --accent-color: #32d74b;
            --success-color: #30d158;
            --warning-color: #ff9f0a;
            --error-color: #ff453a;
            --info-color: #0a84ff;
            --bg-primary: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-tertiary: #3a3a3c;
            --text-primary: #f2f2f7;
            --text-secondary: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-color: rgba(10, 132, 255, 0.25);
            /* RGB值用于高级动画 */
            --primary-rgb: 10, 132, 255;
            --accent-rgb: 50, 215, 75;
            --success-rgb: 48, 209, 88;
            --warning-rgb: 255, 159, 10;
            --error-rgb: 255, 69, 58;
        }

        /* Linux 主题 - 技术感橙色 */
        .theme-linux {
            --primary-color: #ff6600;
            --secondary-color: #e55a00;
            --accent-color: #4fc3f7;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --error-color: #f44336;
            --info-color: #2196f3;
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(255, 102, 0, 0.3);
            /* RGB值用于高级动画 */
            --primary-rgb: 255, 102, 0;
            --accent-rgb: 79, 195, 247;
            --success-rgb: 76, 175, 80;
            --warning-rgb: 255, 152, 0;
            --error-rgb: 244, 67, 54;
        }

        /* 操作系统特定按钮样式 */
        .btn-win {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px var(--shadow-color);
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-win::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-win:hover::before {
            left: 100%;
        }

        .btn-win:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .btn-mac {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 12px var(--shadow-color);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-mac::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .btn-mac:hover::before {
            left: 100%;
        }

        .btn-mac:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .btn-linux {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 10px var(--shadow-color);
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        .btn-linux::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.4s ease;
        }

        .btn-linux:hover::before {
            left: 100%;
        }

        .btn-linux:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        /* 增强玻璃态效果 */
        .glass-enhanced {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .glass-win-enhanced {
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            background: linear-gradient(135deg, rgba(30, 30, 46, 0.7), rgba(37, 37, 38, 0.6));
            border: 1px solid rgba(0, 120, 212, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .glass-mac-enhanced {
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            background: linear-gradient(135deg, rgba(28, 28, 30, 0.75), rgba(44, 44, 46, 0.65));
            border: 1px solid rgba(10, 132, 255, 0.1);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .glass-linux-enhanced {
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8), rgba(45, 45, 45, 0.7));
            border: 1px solid rgba(255, 102, 0, 0.2);
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        /* 高级排版优化 */
        .typography-enhanced {
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1, "pnum" 1, "tnum" 0, "onum" 1, "lnum" 0, "dlig" 1;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-win-enhanced {
            font-family: 'Segoe UI Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 450;
            letter-spacing: -0.01em;
            line-height: 1.45;
        }

        .font-mac-enhanced {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.47;
        }

        .font-linux-enhanced {
            font-family: 'Ubuntu', 'Inter', 'Fira Sans', 'Droid Sans', Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1.5;
        }

        /* 成就通知动画 */
        @keyframes slide-in-left {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .animate-slide-in-left {
            animation: slide-in-left 0.5s ease-out forwards;
        }

        @keyframes fade-out {
            0% {
                opacity: 1;
                transform: translateX(0);
            }

            100% {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .animate-fade-out {
            animation: fade-out 0.5s ease-out forwards;
        }

        @keyframes bounce {

            0%,
            20%,
            53%,
            80%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            40%,
            43% {
                transform: translate3d(0, -8px, 0);
            }

            70% {
                transform: translate3d(0, -4px, 0);
            }

            90% {
                transform: translate3d(0, -2px, 0);
            }
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        /* Windows 11 深色主题 - 现代化设计 */
        .glass-win {
            background: rgba(32, 32, 32, 0.95);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        /* macOS 深色主题 - 优雅简洁 */
        .glass-mac {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        /* Linux 深色主题 - 技术感设计 */
        .glass-linux {
            background: rgba(28, 28, 28, 0.9);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        /* 高级微交互动画 */
        .micro-interaction {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(0);
        }

        .micro-interaction:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.1);
        }

        .micro-interaction:active {
            transform: translateY(0) scale(0.98);
            filter: brightness(0.95);
        }

        /* 脉冲动画效果 */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0.7);
            }

            50% {
                box-shadow: 0 0 20px 10px rgba(var(--primary-rgb), 0);
            }
        }

        .pulse-animation {
            animation: pulse-glow 2s infinite;
        }

        /* 波纹扩散效果 */
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }

        .ripple-effect::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple-effect:active::after {
            width: 300px;
            height: 300px;
        }

        /* 磁性悬浮效果 */
        .magnetic-hover {
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .magnetic-hover::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: radial-gradient(circle at center, rgba(var(--primary-rgb), 0.1) 0%, transparent 70%);
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .magnetic-hover:hover::before {
            opacity: 1;
        }

        .magnetic-hover:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(var(--primary-rgb), 0.25);
        }

        /* 导航栏优化 - 玻璃态效果 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .logo:hover {
            color: var(--primary-color, #0078d4);
            transform: scale(1.02);
        }

        .nav-right {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .nav-links a.active {
            color: var(--primary-color, #0078d4);
            font-weight: 600;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-color, #0078d4);
            border-radius: 1px;
            animation: fade-in 0.3s ease-out;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #ffffff;
            font-size: 1.2rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .theme-btn:hover {
            border-color: var(--primary-color, #ffffff);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 4px 20px var(--shadow-color, rgba(255, 255, 255, 0.2));
        }

        /* Responsive navigation */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 2rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // --- 图标资源 (SVG) ---
        const ICONS = {
            // 修复：Windows 11 风格田字格图标

                const pathParts = partial.split(/[/\\]/).filter(p => p);

                    dirPath.shift(); // 移除空的第一部分

                // 导航到目标目录
                if (dirPath.length > 0) {
                    const targetPath = isAbsolute ? dirPath : resolvePath(state.path, dirPath.join('/'), '/');
                    searchDir = getNode(state.fs, targetPath);

                if (!searchDir || !searchDir.children) return completions;

                const items = Object.keys(searchDir.children);
                const isHidden = filePart.startsWith('.') || filePart === '';

                // 特殊处理：如果输入的是路径分隔符，显示目录内容
                if (partial.endsWith('/') || partial.endsWith('\\')) {
                    items.forEach(item => {
                        const shouldShow = isHidden || !item.startsWith('.');
                        if (shouldShow) {
                            const node = searchDir.children[item];
                            const suffix = node.type === 'dir' ? '/' : '';
                            completions.push(item + suffix);
                        }
                    });
                } else {
                    // 正常文件名补全
                    items.forEach(item => {
                        const shouldShow = isHidden || !item.startsWith('.');
                        if (shouldShow && item.startsWith(filePart)) {
                            const node = searchDir.children[item];
                            const suffix = node.type === 'dir' ? '/' : '';

                            // 构建完整路径
                            let fullPath = item + suffix;
                            if (dirPath.length > 0) {
                                const separator = partial.includes('\\') ? '\\' : '/';

                            }

                            completions.push(fullPath);

                    completions.push('..');

                };

            analyzeContext(input) {
                const parts = input.trim().split(/\s+/);
                if (parts.length === 0) return { context: 'command', partial: '', command: null };

                const command = parts[0];
                const lastPart = parts[parts.length - 1] || '';

                // Git 命令上下文
                if (command === 'git' && parts.length > 1) {
                    const gitSubcommand = parts[1];
                    if (parts.length === 2) {
                        return { context: 'git', partial: lastPart, command: null, subcommand: null };
                    } else if (parts.length > 2) {
                        return { context: 'git-flag', partial: lastPart, command: 'git', subcommand: gitSubcommand };
                    }
                }

                // 包管理器上下文
                const packageManagers = ['brew', 'apt', 'apt-get', 'snap', 'choco', 'scoop', 'winget', 'npm', 'yarn', 'pip'];
                if (packageManagers.includes(command) && parts.length > 1) {
                    const subcommand = parts[1];
                    if (parts.length === 2) {
                        return { context: 'package', partial: lastPart, command: command, subcommand: null };
                    } else {
                        return { context: 'package-flag', partial: lastPart, command: command, subcommand: subcommand };
                    }
                }

                // 文件路径补全（检测特定命令）
                const fileCommands = [
                    // 查看文件内容
                    'cat', 'type', 'less', 'more', 'head', 'tail', 'vim', 'nano', 'emacs', 'code', 'subl',

                if (fileCommands.includes(command) && parts.length > 1) {
                    // 检查最后一个参数是否像文件路径（不是选项）
                    if (lastPart && !lastPart.startsWith('-') && !lastPart.startsWith('--')) {

                }

                }

                        const bStarts = b.toLowerCase().startsWith(partial.toLowerCase());
                        if (aStarts && !bStarts) return -1;
                        if (!aStarts && bStarts) return 1;
                        return a.localeCompare(b);

                // 处理空输入
                if (!input || input.trim() === '') {
                    return completion;
                }

                // 保留原始输入的尾部空格
                const trailingSpace = input.endsWith(' ') ? ' ' : '';
                const parts = input.trim().split(/\s+/);

                if (parts.length === 0) {
                    return completion + trailingSpace;
                }

                const lastPart = parts[parts.length - 1];

                // 防止重复补全：检查补全是否已经存在于输入中
                if (lastPart === completion) {
                    return input; // 避免重复
                }

                // 计算基础输入（移除最后一个部分）
                const lastPartStart = input.lastIndexOf(lastPart);
                const baseInput = input.slice(0, lastPartStart);

                // 智能处理空格
                const needsSpace = !completion.startsWith('-') &&
                    parts.length > 1 &&
                    !trailingSpace &&
                    !completion.endsWith('/'); // 目录补全不需要额外空格

                return baseInput + completion + (needsSpace ? ' ' : '') + trailingSpace;
            }

        // --- 核心工具 ---
        function getNode(root, pathArr) {
            let curr = root;
            for (const p of pathArr) {
                if (curr?.children?.[p]) curr = curr.children[p];
                else return null;
            }
            return curr;
        }

        function resolvePath(currPath, targetStr, separator) {
            if (!targetStr) return currPath;
            if (targetStr.startsWith(separator)) return targetStr.split(separator).filter(p => p);
            let parts = targetStr.split(/[/\\]/).filter(p => p);
            let newPath = [...currPath];
            for (const p of parts) {
                if (p === '.') continue;
                if (p === '..') { if (newPath.length > 0) newPath.pop(); }
                else newPath.push(p);
            }
            return newPath;
        }

        function generateTree(node, prefix = '') {
            let output = '';
            const keys = Object.keys(node.children || {}).sort();
            keys.forEach((k, i) => {
                const isLast = i === keys.length - 1;
                const connector = isLast ? '└── ' : '├── ';
                const item = node.children[k];
                output += `${prefix}${connector}${k}${item.type === 'dir' ? '/' : ''}\n`;
                if (item.type === 'dir') {
                    output += generateTree(item, prefix + (isLast ? '    ' : '│   '));
                }
            });
            return output || '(empty)';
        }

                                <!-- 命令预览区域 -->

        function selectOS(id) {
            state.osId = id;
            state.fs = deepClone(fsData[id]);
            state.path = [...state.os.home];
            state.scenarioId = null;
            state.levelIndex = 0;
            state.history = [];
            state.view = 'game';
            state.repl = null;
            render();
        }

        function setScenario(id) {
            state.scenarioId = id;
            state.levelIndex = 0;
            // 切换场景时重置渲染
            renderGame();
        }

        function updateUI() {
            const os = state.os;

            let promptStr;
            if (state.repl === 'node') promptStr = `<span class="text-green-500">></span>`;
            else if (state.repl === 'python') promptStr = `<span class="text-blue-500">>>></span>`;
            else promptStr = state.isRemote
                ? `<span class="text-green-400">root@server</span>:<span class="text-blue-400">/${state.remotePath.slice(1).join('/')}</span>#`
                : os.prompt(state.path);

            document.getElementById('prompt-span').innerHTML = promptStr;

            const listEl = document.getElementById('file-list');
            if (listEl) {
                const node = state.currNode;
                const children = Object.keys(node.children || {}).sort();

                const pathStr = (state.isRemote ? '/' : '') + state.path.join(os.sep);

                let html = `
                    <div class="px-2 py-1 mb-2 flex items-center gap-1 text-[10px] text-gray-500 border-b border-white/5">
                         ${ICONS.folder.replace('class="text-yellow-400"', 'class="w-3 h-3 text-gray-500"')}
                         <span class="truncate">${pathStr}</span>
                    </div>
                `;

                if (state.path.length > (state.isRemote ? 1 : os.home.length)) {
                    html += `
                        <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-white/10 text-xs text-gray-400 select-none">
                            <div class="w-4 flex justify-center">⤴</div>
                            <span>..</span>
                        </div>
                     `;
                }

                if (children.length === 0) {
                    html += `<div class="px-8 py-4 text-xs text-gray-600 italic">Empty Folder</div>`;
                } else {
                    html += children.map(name => {
                        const item = node.children[name];
                        const isDir = item.type === 'dir';
                        const icon = isDir ? ICONS.folder : ICONS.file;
                        const meta = isDir ? 'Folder' : (item.size || '1KB');

                        return `
                            <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-white/10 group cursor-default transition-colors">
                                <div class="w-4 h-4 flex-shrink-0 ${isDir ? '' : 'opacity-70'}">${icon}</div>
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-gray-300 truncate group-hover:text-white font-medium">${name}</div>
                                </div>
                                <div class="text-[10px] text-gray-600 group-hover:text-gray-500 tabular-nums">${meta}</div>
                            </div>
                        `;
                    }).join('');
                }
                listEl.innerHTML = html;
            }
        }

        function handleInput(e) {
            const input = e.target;

            // Tab 键补全 - 支持连续切换
            if (e.key === 'Tab') {
                e.preventDefault();
                playKeySound(); // 按键音效
                addTerminalEffect(); // 视觉反馈

                const currentInput = input.value;

                // 如果补全菜单已激活，切换到下一个建议
                if (state.completion.isActive && state.completion.suggestions.length > 0) {
                    navigateCompletions(e.shiftKey ? -1 : 1); // Shift+Tab 向上切换
                    return;
                }

                // 获取新的补全建议
                const completions = AutoComplete.getCompletions(currentInput);

                if (completions.length === 0) {
                    // 没有补全建议 - 添加轻微震动效果表示无结果
                    input.style.transform = 'translateX(2px)';
                    setTimeout(() => {
                        input.style.transform = 'translateX(0)';
                    }, 100);
                    return;
                } else if (completions.length === 1) {
                    // 只有一个补全建议，直接应用
                    const completed = AutoComplete.applyCompletion(currentInput, completions[0]);
                    input.value = completed;
                    renderInput();
                    hideCompletions();
                } else {
                    // 多个补全建议，显示补全列表并选择第一个
                    showCompletions(completions, currentInput);
                    state.completion.selectedIndex = 0;
                    highlightCompletionItem();
                }
                return;
            }

            // 方向键导航补全列表
            if (state.completion.isActive) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateCompletions(1);
                    return;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateCompletions(-1);
                    return;
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    applySelectedCompletion();
                    return;
                } else if (e.key === 'Escape') {
                    hideCompletions();
                    return;
                }
            }

            // 其他键隐藏补全列表
            if (e.key !== 'Tab' && state.completion.isActive) {
                hideCompletions();
            }

            // 历史命令导航 (只有在没有补全菜单时才启用)
            if (!state.completion.isActive) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory(1);
                    return;
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory(-1);
                    return;
                }
            }

            // Ctrl 组合键处理
            if (e.ctrlKey) {
                switch (e.key) {
                    case 'c':
                        e.preventDefault();
                        // Ctrl+C 中断当前操作 - 使用更强烈的音效
                        try {
                            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            const oscillator = audioContext.createOscillator();
                            const gainNode = audioContext.createGain();

                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);

                            oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                            oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.15);

                            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.15);
                        } catch (e) {
                            // 静默处理音频错误
                        }

                        // 视觉反馈 - 屏幕闪烁效果
                        const terminal = document.getElementById('terminal');
                        terminal.style.backgroundColor = 'rgba(255, 100, 100, 0.1)';
                        setTimeout(() => {
                            terminal.style.backgroundColor = '';
                        }, 150);

                        if (input.value || state.repl) {
                            appendLog('^C', 'text-gray-400');
                            input.value = '';
                            renderInput();
                            if (state.repl) {
                                state.repl = null;
                                appendLog('REPL interrupted', 'text-yellow-400');
                            }
                        } else {
                            appendLog('^C', 'text-gray-400');
                        }
                        return;

                    case 'd':
                        e.preventDefault();
                        // Ctrl+D 退出 (EOF)
                        if (!input.value) {
                            appendLog('logout', 'text-gray-400');
                            appendLog('[Process completed]', 'text-gray-500');
                            // 模拟退出，可以在这里添加重新启动逻辑
                            setTimeout(() => {
                                document.getElementById('output').innerHTML = '';
                                const os = state.os;
                                const welcome = os.id === 'windows' ? 'Microsoft Windows [Version 10.0.22631.3296]\n(c) Microsoft Corporation. All rights reserved.'
                                    : os.id === 'macos' ? `Last login: ${new Date().toDateString()} on ttys000`
                                        : `Welcome to Ubuntu 24.04 LTS (GNU/Linux 5.15.0-91-generic x86_64)`;
                                appendLog(welcome, 'text-gray-500');
                            }, 1500);
                        }
                        return;

                    case 'l':
                        e.preventDefault();
                        // Ctrl+L 清屏
                        document.getElementById('output').innerHTML = '';
                        return;

                    case 'a':
                        e.preventDefault();
                        // Ctrl+A 移动到行首
                        input.setSelectionRange(0, 0);
                        return;

                    case 'e':
                        e.preventDefault();
                        // Ctrl+E 移动到行尾
                        input.setSelectionRange(input.value.length, input.value.length);
                        return;

                    case 'u':
                        e.preventDefault();
                        // Ctrl+U 清除到行首
                        input.value = input.value.substring(input.selectionStart);
                        renderInput();
                        return;

                    case 'k':
                        e.preventDefault();
                        // Ctrl+K 清除到行尾
                        input.value = input.value.substring(0, input.selectionStart);
                        renderInput();
                        return;

                    case 'w':
                        e.preventDefault();
                        // Ctrl+W 删除前一个单词
                        const beforeCursor = input.value.substring(0, input.selectionStart);
                        const afterCursor = input.value.substring(input.selectionStart);
                        const words = beforeCursor.trim().split(/\s+/);
                        if (words.length > 0) {
                            words.pop();
                            const newBefore = words.join(' ') + (words.length > 0 ? ' ' : '');
                            input.value = newBefore + afterCursor;
                            input.setSelectionRange(newBefore.length, newBefore.length);
                            renderInput();
                        }
                        return;
                }
            }

            // 原有的 Enter 处理
            if (e.key === 'Enter') {
                e.preventDefault();
                playKeySound(); // 按键音效
                addTerminalEffect(); // 视觉反馈

                const cmd = e.target.value;
                if (cmd.trim()) {
                    // 将非空命令添加到历史记录
                    state.inputHistory.unshift(cmd);
                    // 限制历史记录数量
                    if (state.inputHistory.length > 100) {
                        state.inputHistory.pop();
                    }
                }
                // 重置历史索引
                state.historyIdx = -1;

                // 显示执行的命令
                const prompt = getPrompt();
                appendLog(prompt + cmd, 'text-gray-300');

                // Allow empty enters
                execute(cmd);
                e.target.value = '';
                renderInput();
                hideCompletions();
            }
        }

        // 获取当前提示符
        function getPrompt() {
            const os = state.os;
            const path = state.path.join(os.sep);
            const fullPath = (os.id === 'windows' ? 'C:\\' : '/') + path;

            if (os.id === 'windows') {
                return `C:\\${path}> `;
            } else if (os.id === 'macos') {
                const user = 'guest';
                const host = 'MacBook';
                const shortPath = state.path.length > 0 ? state.path[state.path.length - 1] : '~';
                return `${user}@${host}:${shortPath}$ `;
            } else {
                const user = 'guest';
                const host = 'ubuntu';
                const shortPath = state.path.length > 0 ? state.path[state.path.length - 1] : '~';
                return `${user}@${host}:${shortPath}$ `;
            }
        }

        // 历史命令导航函数
        function navigateHistory(direction) {
            const input = document.getElementById('input');

            if (state.inputHistory.length === 0) return;

            // 向上导航 (更早的历史命令)
            if (direction > 0) {
                if (state.historyIdx < state.inputHistory.length - 1) {
                    state.historyIdx++;
                    input.value = state.inputHistory[state.historyIdx];
                    renderInput();
                }
            }
            // 向下导航 (更新的历史命令)
            else if (direction < 0) {
                if (state.historyIdx > 0) {
                    state.historyIdx--;
                    input.value = state.inputHistory[state.historyIdx];
                    renderInput();
                } else if (state.historyIdx === 0) {
                    // 回到当前输入
                    state.historyIdx = -1;
                    input.value = '';
                    renderInput();
                }
            }
        }

        function renderInput() {
            const input = document.getElementById('input');
            const renderer = document.getElementById('input-render');
            const cursor = document.getElementById('cursor');
            renderer.textContent = input.value;
            const chWidth = 8.4;
            const width = input.value.length * chWidth;
            cursor.style.transform = `translateX(${width}px)`;

            // 输入时更新补全建议
            if (state.completion.isActive && input.value !== state.completion.lastInput) {
                updateCompletions(input.value);
            }
        }

        // --- 补全UI功能 ---
        function showCompletions(completions, currentInput) {
            state.completion.suggestions = completions;
            state.completion.selectedIndex = 0;
            state.completion.isActive = true;
            state.completion.lastInput = currentInput;

            const terminal = document.getElementById('terminal');
            let completionDiv = document.getElementById('completion-menu');

            // 移除旧的补全菜单
            if (completionDiv) {
                completionDiv.remove();
            }

            // 创建新的补全菜单
            completionDiv = document.createElement('div');
            completionDiv.id = 'completion-menu';
            completionDiv.className = 'absolute z-50 bg-gray-900 border border-gray-700 rounded-lg shadow-xl max-h-64 overflow-y-auto backdrop-blur-sm';
            completionDiv.style.cssText = 'top: 100%; left: 0; min-width: 250px; margin-top: 8px; font-family: inherit;';

            // 计算位置（在输入行下方）
            const inputLine = document.querySelector('#terminal > div.flex');
            if (inputLine) {
                const rect = inputLine.getBoundingClientRect();
                const terminalRect = terminal.getBoundingClientRect();
                completionDiv.style.top = (rect.bottom - terminalRect.top) + 'px';
                completionDiv.style.left = (rect.left - terminalRect.left) + 'px';
            }

            // 渲染补全项
            renderCompletionItems(completionDiv, completions);

            terminal.appendChild(completionDiv);
        }

        function renderCompletionItems(container, completions) {
            container.innerHTML = '';
            completions.forEach((completion, index) => {
                const item = document.createElement('div');
                item.className = 'px-3 py-2 text-sm cursor-pointer hover:bg-blue-600 transition-colors duration-150 flex items-center';

                // 添加图标和文本
                const icon = document.createElement('span');
                icon.className = 'mr-2 opacity-70';
                icon.textContent = this.getFileIcon ? this.getFileIcon(completion) : '📄';

                const text = document.createElement('span');
                text.textContent = completion;

                item.appendChild(icon);
                item.appendChild(text);

                if (index === state.completion.selectedIndex) {
                    item.classList.add('bg-blue-600', 'text-white');
                    item.classList.remove('hover:bg-blue-600');
                }

                item.addEventListener('click', () => {
                    applyCompletion(completion);
                });

                item.addEventListener('mouseenter', () => {
                    state.completion.selectedIndex = index;
                    highlightCompletionItem();
                });

                container.appendChild(item);
            });
        }

        function navigateCompletions(direction) {
            const maxIndex = state.completion.suggestions.length - 1;
            state.completion.selectedIndex += direction;

            if (state.completion.selectedIndex < 0) {
                state.completion.selectedIndex = maxIndex;
            } else if (state.completion.selectedIndex > maxIndex) {
                state.completion.selectedIndex = 0;
            }

            highlightCompletionItem();
        }

        function highlightCompletionItem() {
            const items = document.querySelectorAll('#completion-menu > div');
            items.forEach((item, index) => {
                if (index === state.completion.selectedIndex) {
                    item.classList.add('bg-blue-600');
                } else {
                    item.classList.remove('bg-blue-600');
                }
            });
        }

        function applySelectedCompletion() {
            if (state.completion.suggestions.length > 0) {
                const selected = state.completion.suggestions[state.completion.selectedIndex];
                applyCompletion(selected);
            }
        }

        function applyCompletion(completion) {
            const input = document.getElementById('input');
            const currentInput = input.value;
            const completed = AutoComplete.applyCompletion(currentInput, completion);

            input.value = completed;
            renderInput();

            // 延迟隐藏补全菜单，允许用户继续Tab切换
            setTimeout(() => {
                hideCompletions();
            }, 500);

            // 重新触发补全以显示下一个可能的补全
            setTimeout(() => {
                const newCompletions = AutoComplete.getCompletions(input.value);
                if (newCompletions.length > 0) {
                    showCompletions(newCompletions, input.value);
                }
            }, 100);
        }

        function updateCompletions(currentInput) {
            const completions = AutoComplete.getCompletions(currentInput);

            if (completions.length === 0) {
                hideCompletions();
            } else {
                showCompletions(completions, currentInput);
            }
        }

        function hideCompletions() {
            state.completion.isActive = false;
            state.completion.suggestions = [];
            state.completion.selectedIndex = 0;

            const completionDiv = document.getElementById('completion-menu');
            if (completionDiv) {
                completionDiv.remove();
            }
        }

        async function execute(rawCmd) {
            const args = rawCmd.trim().split(/\s+/);
            const cmd = args[0].toLowerCase();
            const params = args.slice(1);
            const os = state.os;

            // Handle REPL Mode
            if (state.repl) {
                const promptStr = state.repl === 'node' ? `>` : `>>>`;
                appendLog(`${promptStr} ${rawCmd}`, state.repl === 'node' ? 'text-green-500' : 'text-blue-500');

                if (['exit', 'quit', '.exit', 'exit()'].includes(rawCmd.trim())) {
                    state.repl = null;
                    appendLog(state.repl === 'python' ? '' : '(To exit, press Ctrl+C again or .exit)', 'text-gray-500');
                } else if (rawCmd.trim()) {
                    try {
                        if (rawCmd.startsWith('print') || rawCmd.startsWith('console.log')) {
                            const match = rawCmd.match(/["'](.+)["']/);
                            if (match) appendLog(match[1]);
                        } else if (['1+1', '2+2'].includes(rawCmd.replace(/\s/g, ''))) {
                            appendLog(eval(rawCmd));
                        } else {
                            appendLog(state.repl === 'node' ? 'undefined' : '');
                        }
                    } catch {
                        appendLog('Error', 'text-red-400');
                    }
                }
                updateUI();
                return;
            }

            // Normal Shell Mode
            const promptStr = state.isRemote ? `root@server#` : (os.id === 'windows' ? `${state.path.join('\\')}>` : `${os.id === 'macos' ? '%' : '$'}`);
            appendLog(`${promptStr} ${rawCmd}`, 'text-white font-bold');

            // 修复：使用 trim 后的命令进行校验
            state.lastCmd = rawCmd.trim();

            if (!rawCmd.trim()) return;

            let output = '';

            // Check cross-platform command mismatch hints
            if (!state.isRemote) {
                if (os.id === 'windows' && ['ls', 'clear', 'rm', 'cp', 'mv'].includes(cmd))
                    output = `'${cmd}' is not recognized. Did you mean '${os.commands[cmd] || 'dir'}'?`;
                else if (os.id !== 'windows' && ['dir', 'cls', 'del', 'copy', 'move'].includes(cmd))
                    output = `command not found: ${cmd}. Try '${os.commands[cmd] || 'ls'}'`;
            }

            if (!output) {
                switch (cmd) {
                    case 'cls': case 'clear':
                        document.getElementById('output').innerHTML = '';
                        return;
                    case 'dir': case 'ls': case 'll':
                        const list = Object.keys(state.currNode.children || {});
                        if (os.id === 'windows' && !state.isRemote && cmd === 'dir') {
                            output = list.map(k => {
                                const type = state.currNode.children[k].type === 'dir' ? '<DIR>' : '     ';
                                return `05/20/2025  12:00 PM    ${type}    ${k}`;
                            }).join('\n') || 'File Not Found';
                        } else {
                            output = list.join('  ');
                        }
                        break;
                    case 'cd':
                        if (!params[0]) { /* go home */ } else {
                            const newPath = resolvePath(state.path, params[0], os.sep);
                            if (getNode(state.fs, newPath)?.type === 'dir') state.path = newPath;
                            else output = `cd: no such file or directory: ${params[0]}`;
                        }
                        break;
                    case 'mkdir':
                        if (params[0]) state.currNode.children[params[0]] = { type: 'dir', children: {} };
                        break;
                    case 'touch': case 'echo':
                        const fName = cmd === 'touch' ? params[0] : rawCmd.split('>')[1]?.trim();
                        if (fName) state.currNode.children[fName] = { type: 'file', size: '0KB', content: args.slice(1).join(' ').split('>')[0].trim() };
                        break;
                    case 'rm': case 'del':
                        if (state.currNode.children[params[0]]) delete state.currNode.children[params[0]];
                        else output = 'File not found';
                        break;
                    case 'mv': case 'move':
                        if (state.currNode.children[params[0]]) {
                            const content = state.currNode.children[params[0]];
                            delete state.currNode.children[params[0]];
                            state.currNode.children[params[1]] = content;
                        } else output = 'File not found';
                        break;
                    case 'cp': case 'copy':
                        if (state.currNode.children[params[0]]) {
                            state.currNode.children[params[1]] = deepClone(state.currNode.children[params[0]]);
                        } else output = 'File not found';
                        break;
                    case 'cat': case 'type':
                        const f = state.currNode.children[params[0]];
                        output = f?.type === 'file' ? (f.content || '(empty)') : 'File not found';
                        break;
                    case 'tree':
                        output = generateTree(state.currNode);
                        break;
                    case 'pwd':
                        output = (state.isRemote ? '/' : '') + state.path.join(os.sep);
                        break;
                    case 'whoami':

            const progress = state.learningProgress;

                unlockAchievement('firstCommand');

            // 检查基础大师成就
            const basicsProgress = progress.scenarioProgress.basics || 0;
            const basicsTotal = scenarios.find(s => s.id === 'basics')?.levels.length || 0;
            if (basicsProgress >= basicsTotal && !progress.achievements.includes('masterOfBasics')) {

            }

            // 检查网络专家成就
            const networkProgress = progress.scenarioProgress.network || 0;
            const networkTotal = scenarios.find(s => s.id === 'network')?.levels.length || 0;
            if (networkProgress >= networkTotal && !progress.achievements.includes('networkExpert')) {
                unlockAchievement('networkExpert');
                newlyUnlocked.push('networkExpert');
            }

            // 检查系统管理员成就
            const systemProgress = progress.scenarioProgress.system || 0;
            const systemTotal = scenarios.find(s => s.id === 'system')?.levels.length || 0;
            if (systemProgress >= systemTotal && !progress.achievements.includes('systemAdmin')) {
                unlockAchievement('systemAdmin');
                newlyUnlocked.push('systemAdmin');
            }

            // 检查命令大师成就
            const completedScenarios = progress.completedScenarios.length;
            const totalScenarios = scenarios.length;
            if (completedScenarios >= totalScenarios && !progress.achievements.includes('commandMaster')) {

                newlyUnlocked.push('commandMaster');

        // 获取学习路径推荐
        function getLearningRecommendations() {
            const progress = state.learningProgress;
            const recommendations = [];

            // 根据当前进度推荐下一个学习场景
            const completedScenarios = new Set(progress.completedScenarios);
            const scenarioProgress = progress.scenarioProgress;

            // 推荐逻辑
            const beginnerScenarios = scenarios.filter(s => s.difficulty === 'beginner' && !completedScenarios.has(s.id));
            const intermediateScenarios = scenarios.filter(s => s.difficulty === 'intermediate' && !completedScenarios.has(s.id));
            const advancedScenarios = scenarios.filter(s => s.difficulty === 'advanced' && !completedScenarios.has(s.id));

            // 如果还有未完成的基础场景，优先推荐
            if (beginnerScenarios.length > 0) {
                const nextBeginner = beginnerScenarios[0];
                const currentProgress = scenarioProgress[nextBeginner.id] || 0;
                recommendations.push({
                    type: 'continue',
                    scenario: nextBeginner,
                    message: '📚 继续基础学习',
                    reason: '建议先完成所有基础命令学习'
                });
            }

            // 如果有部分完成的场景，推荐继续
            const partiallyCompleted = scenarios.find(s =>
                scenarioProgress[s.id] > 0 && scenarioProgress[s.id] < s.levels.length
            );

            if (partiallyCompleted) {
                recommendations.push({
                    type: 'resume',
                    scenario: partiallyCompleted,
                    message: '🔄 继续上次学习',
                    reason: `还有 ${partiallyCompleted.levels.length - (scenarioProgress[partiallyCompleted.id] || 0)} 个关卡未完成`
                });
            }

            // 基础完成后推荐中级
            const allBeginnerCompleted = scenarios
                .filter(s => s.difficulty === 'beginner')
                .every(s => completedScenarios.has(s.id));

            if (allBeginnerCompleted && intermediateScenarios.length > 0) {
                recommendations.push({
                    type: 'advance',
                    scenario: intermediateScenarios[0],
                    message: '🚀 挑战中级内容',
                    reason: '基础已掌握，可以挑战更复杂的命令'
                });
            }

            // 根据成就推荐
            if (progress.achievements.includes('masterOfBasics') && intermediateScenarios.length > 0) {
                recommendations.push({
                    type: 'achievement_based',
                    scenario: intermediateScenarios[0],
                    message: '🏆 成就解锁新内容',
                    reason: '已获得基础大师成就，推荐学习中级内容'
                });
            }

            // 如果大部分完成，推荐高级内容
            const completionRate = progress.totalCompletedLevels / scenarios.reduce((sum, s) => sum + s.levels.length, 0);
            if (completionRate > 0.6 && advancedScenarios.length > 0) {
                recommendations.push({
                    type: 'expert',
                    scenario: advancedScenarios[0],
                    message: '💎 挑战高级内容',
                    reason: '你已掌握大部分内容，可以尝试高级命令'
                });
            }

            return recommendations.slice(0, 2); // 最多返回2个推荐
        }

            appendLog(`🎯 开始学习: ${scenario.name}`, 'text-purple-400 font-bold');
            appendLog(`📚 场景介绍: ${scenario.description}`, 'text-blue-400');
            appendLog(`📝 共有 ${scenario.levels.length} 个关卡等待挑战`, 'text-green-400');
            appendLog('', 'text-gray-300');

            // 显示第一个关卡
            renderTaskSection();

            // 显示学习推荐
            setTimeout(() => {
                showLearningRecommendations();
            }, 1000);
        }

        // 获取学习统计信息
        function getLearningStats() {
            const progress = state.learningProgress;
            const totalScenarios = scenarios.length;
            const completedScenarios = progress.completedScenarios.length;
            const totalLevels = scenarios.reduce((sum, s) => sum + s.levels.length, 0);

            // 计算连续学习天数
            const dailyDates = Object.keys(progress.dailyProgress).sort();
            let streak = 0;
            let currentDate = new Date();

            for (let i = dailyDates.length - 1; i >= 0; i--) {
                const date = new Date(dailyDates[i]);
                const daysDiff = Math.floor((currentDate - date) / (1000 * 60 * 60 * 24));
                if (daysDiff === streak) {
                    streak++;
                } else {
                    break;
                }
            }

            return {
                totalScenarios,
                completedScenarios,
                totalLevels,
                completedLevels: progress.totalCompletedLevels,
                completionRate: totalLevels > 0 ? Math.round((progress.totalCompletedLevels / totalLevels) * 100) : 0,
                scenarioCompletionRate: totalScenarios > 0 ? Math.round((completedScenarios / totalScenarios) * 100) : 0,
                achievements: progress.achievements.length,
                totalAchievements: Object.keys(achievements).length,
                streak,
                totalTimeSpent: progress.totalTimeSpent,
                difficultyStats: progress.difficultyStats
            };
        }

        // 添加视觉反馈效果
        function addTerminalEffect() {
            const terminal = document.getElementById('terminal');
            terminal.style.filter = 'brightness(1.1)';
            setTimeout(() => {
                terminal.style.filter = 'brightness(1)';
            }, 50);
        }

        // 启动
        loadLearningProgress(); // 加载学习进度
        render();

        // 主题切换功能
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');

        // 设置初始主题
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (currentTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '◑';
            themeIcon.style.color = '#000000';
        } else {
            themeIcon.textContent = '◐';
            themeIcon.style.color = '#ffffff';
        }

        // 主题切换事件
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            themeIcon.textContent = newTheme === 'dark' ? '◐' : '◑';
            themeIcon.style.color = newTheme === 'dark' ? '#ffffff' : '#000000';
        });

    </script>
</body>

</html>
