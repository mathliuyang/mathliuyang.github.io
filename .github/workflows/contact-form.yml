name: Handle Contact Form Submission

on:
  workflow_dispatch:
    inputs:
      name:
        description: '姓名'
        required: true
        type: string
      email:
        description: '邮箱'
        required: true
        type: string
      subject:
        description: '主题'
        required: true
        type: string
      message:
        description: '消息内容'
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue from Contact Form
        uses: actions/github-script@v7
        with:
          script: |
            const { name, email, subject, message } = context.payload.inputs;
            
            // 创建issue标题和标签
            const issueTitle = `💬 新消息: ${subject}`;
            const issueBody = `## 📬 联系表单消息

**发件人:** ${name}  
**邮箱:** ${email}  
**主题:** ${subject}  
**时间:** ${new Date().toLocaleString('zh-CN')}  

---

### 💭 消息内容
${message}

---

*此issue由联系表单自动创建* 🤖`;

            // 创建issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['contact-form', 'message', 'auto-generated']
            });

            console.log(`✅ Issue created: #${issue.data.number}`);
            return issue.data.number;