name: 联系表单后端处理

on:
  workflow_dispatch:
    inputs:
      name:
        description: '发件人姓名'
        required: true
        type: string
      email:
        description: '发件人邮箱'
        required: true
        type: string
      subject:
        description: '消息主题'
        required: true
        type: string
      message:
        description: '消息内容'
        required: true
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: 创建Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { name, email, subject, message } = context.payload.inputs;
            
            // 创建issue标题和内容
            const title = `💬 新消息: ${subject}`;
            const body = `## 📬 联系表单消息
            
            **发件人:** ${name}
            **邮箱:** ${email}
            **主题:** ${subject}
            **时间:** ${new Date().toLocaleString('zh-CN')}
            
            ---
            
            ### 💭 消息内容
            ${message}
            
            ---
            
            *此issue由联系表单自动创建* 🤖`;
            
            // 创建issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['contact-form', 'message', 'auto-generated']
            });
            
            console.log(`✅ Issue created: ${issue.data.html_url}`);
            
      - name: 发送成功通知
        if: success()
        run: echo "✅ 联系表单消息已成功创建为GitHub Issue！"