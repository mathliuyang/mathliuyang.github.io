name: Save Todo Items

on:
  workflow_dispatch:
    inputs:
      todos_data:
        description: '待办事项数据JSON字符串'
        required: true
        type: string

jobs:
  save-todos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 设置Node.js环境
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: 更新待办事项数据
        run: |
          # 创建临时脚本处理数据更新
          cat > update-todo-action.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          // 获取输入数据
          const todosData = JSON.parse(process.env.TODOS_DATA);
          const todoDataPath = path.join(__dirname, 'tools/todo-data.js');
          
          try {
              // 读取当前文件内容
              const currentContent = fs.readFileSync(todoDataPath, 'utf8');
              
              // 找到todos数组定义的开始和结束位置
              const arrayStartRegex = /let todos = \[/;
              const arrayEndRegex = /];/;
              
              const startMatch = currentContent.match(arrayStartRegex);
              const endMatch = currentContent.match(arrayEndRegex);
              
              if (!startMatch || !endMatch) {
                  throw new Error('无法在todo-data.js中找到todos数组定义');
              }
              
              // 保留文件头部和函数定义部分
              const fileHeader = currentContent.substring(0, startMatch.index);
              const functionDefinitions = currentContent.substring(endMatch.index + 2);
              
              // 创建新的文件内容
              const newTodosString = JSON.stringify(todosData, null, 2);
              // 使用字符串拼接避免模板字符串中的${}被YAML解析
              const newContent = fileHeader + 'let todos = ' + newTodosString + ';\n' + functionDefinitions;
              
              // 写入文件
              fs.writeFileSync(todoDataPath, newContent, 'utf8');
              console.log('✅ 待办事项数据更新成功');
          } catch (error) {
              console.error('❌ 更新失败:', error.message);
              process.exit(1);
          }
          EOF
          
          # 执行更新脚本
          TODOS_DATA=${{ inputs.todos_data }} node update-todo-action.js
      
      - name: 提交更改
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add tools/todo-data.js
          git commit -m '自动更新待办事项数据' || echo "没有更改需要提交"
          git push